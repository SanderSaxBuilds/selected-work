<style>
  :root {
    --field: #43413a;      /* the grey floor of the cover */
    --field-deep: #36342e;
    --haze: #ca1008;       /* the red haze */
    --ember: #f1220c;      /* the lit shape */
    --bone: #ece4d8;
    --ash: #b9ae9f;
    --line: rgba(236, 228, 216, 0.16);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--field);
    color: var(--bone);
    font-family: "Archivo", system-ui, sans-serif;
    font-stretch: 100%;
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
  }
  /* film grain, the cover's own texture carried onto the page */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.22;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 1.2 -0.1'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  .page {
    max-width: 560px;
    margin: 0 auto;
  }
  .cover {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    background: var(--haze);
    -webkit-mask-image: linear-gradient(to bottom, #000 80%, transparent);
            mask-image: linear-gradient(to bottom, #000 80%, transparent);
  }
  .head {
    position: relative;
    margin-top: -31%;
    padding: 0 20px;
  }
  h1 {
    margin: 0;
    font-weight: 250;
    font-stretch: 125%;
    font-size: clamp(2.6rem, 12.4vw, 4.4rem);
    line-height: 0.92;
    letter-spacing: -0.035em;
    text-transform: lowercase;
  }
  .by {
    margin: 18px 0 0;
    font-size: 1.0625rem;
    font-weight: 500;
    font-stretch: 100%;
    color: var(--bone);
  }
  .by span { color: var(--ash); font-weight: 400; }

  .links {
    list-style: none;
    margin: 40px 0 0;
    padding: 0 20px;
  }
  .links li + li { border-top: 1px solid var(--line); }
  .links a {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    min-height: 64px;
    padding: 20px 2px;
    color: var(--bone);
    text-decoration: none;
    font-size: 1.375rem;
    font-weight: 380;
    font-stretch: 112%;
    letter-spacing: -0.01em;
    transition: color .18s ease;
  }
  .links a small {
    font-size: 0.9375rem;
    font-weight: 450;
    font-stretch: 100%;
    letter-spacing: 0;
    color: var(--ash);
    transition: color .18s ease;
  }
  .links a:hover, .links a:hover small { color: var(--ember); }
  .links a:focus-visible, .social a:focus-visible {
    outline: 2px solid var(--ember);
    outline-offset: 2px;
  }

  .social {
    list-style: none;
    margin: 44px 0 0;
    padding: 0 20px 56px;
    display: grid;
    gap: 2px;
  }
  .social a {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    padding: 12px 2px;
    color: var(--ash);
    text-decoration: none;
    font-size: 1rem;
    font-weight: 450;
  }
  .social a span { color: var(--bone); }
  .social a:hover, .social a:hover span { color: var(--ember); }

  @media (min-width: 900px) {
    .page {
      max-width: none;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(380px, 520px);
      gap: 0 clamp(40px, 6vw, 96px);
      align-items: start;
      padding-right: clamp(32px, 6vw, 96px);
    }
    .cover {
      position: sticky;
      top: 0;
      height: 100vh;
      width: 100%;
      aspect-ratio: auto;
      object-position: 50% 40%;
      -webkit-mask-image: linear-gradient(to right, #000 82%, transparent);
              mask-image: linear-gradient(to right, #000 82%, transparent);
    }
    .text { padding: 14vh 0 64px; }
    .head { margin-top: 0; padding: 0; }
    h1 { font-size: clamp(3.4rem, 5.6vw, 5.4rem); }
    .links, .social { padding-left: 0; padding-right: 0; }
    .social { padding-bottom: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .links a, .links a small { transition: none; }
  }
</style>
