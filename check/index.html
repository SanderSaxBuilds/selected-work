  <a class="back" href="../" data-s="fAll">All work</a>

<main id="main" class="mon">
  <div class="case">
    <div class="screen">
      <div class="bar">
        <span class="bar-t" aria-hidden="true">WC-3270</span>
        <span class="bar-c" data-s="kick">Website check</span>
        <div class="langs" role="group" aria-label="Language / Язык / ภาษา">
          <button type="button" data-l="en" aria-pressed="true">EN</button>
          <button type="button" data-l="ru" aria-pressed="false">RU</button>
          <button type="button" data-l="th" aria-pressed="false">TH</button>
        </div>
      </div>

      <section class="intro">
        <h1><span data-s="h1a">Measure any website</span> <em data-s="h1b">in about thirty seconds.</em></h1>
        <p class="lead" data-s="lead"></p>
      </section>

      <form class="probe" id="probe" novalidate>
        <label class="f-lab" for="url" data-c="fieldLabel">Your website address</label>
        <div class="f-row">
          <span class="f-box"><span class="f-pre" aria-hidden="true">https://</span><input id="url" type="text" name="url" inputmode="url" autocomplete="url" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-describedby="url-err"></span>
          <div class="dev" role="radiogroup" aria-label="Device" data-s-aria="devLabel">
            <div class="dev-sw" data-on="mobile">
              <button type="button" role="radio" aria-checked="true" data-dev="mobile" data-s="phone">Phone</button>
              <button type="button" role="radio" aria-checked="false" data-dev="desktop" data-s="desktop">Desktop</button>
            </div>
          </div>
          <button class="kc kc-go" type="submit" data-go data-c="check">Check my site</button>
        </div>
        <p class="f-err" id="url-err" data-err aria-live="polite" hidden></p>
        <div class="f-sub">
          <button type="button" class="link-btn" data-example data-c="example">See an example report</button>
          <p class="privacy" data-s="privacy"></p>
        </div>
      </form>

      <div class="panel" data-panel hidden aria-live="polite"></div>

      <div class="rep-wrap" id="report" tabindex="-1"><div class="rep" data-rep hidden></div></div>

      <div class="oia" aria-hidden="true"><span data-stat class="st">READY</span><span data-odev></span><span>LIGHTHOUSE <b data-ver>13</b></span></div>
    </div>
    <div class="badge" aria-hidden="true"><span class="badge-n">SANDERSAX</span><span>WC-3270 WEBSITE CHECK TERMINAL</span></div>
  </div>
