<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d"><title id="t">SOP extraction study</title><desc id="d">A labeled source paragraph and its extracted instruction share the same paragraph reference.</desc><rect width="1600" height="1000" fill="#f5f3ed"/><text x="110" y="125" font-family="Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="4" fill="#075c55">DOCUMENT PROCESSING STUDY</text><text x="110" y="220" font-family="Arial,sans-serif" font-size="68" font-weight="700" fill="#132a3b">Keep every step traceable.</text><text x="110" y="278" font-family="Arial,sans-serif" font-size="29" fill="#516474">Explicit Word labels. JSON and CSV with paragraph references.</text><rect x="110" y="350" width="615" height="440" rx="16" fill="white" stroke="#d3dcd9" stroke-width="3"/><rect x="110" y="350" width="615" height="85" rx="16" fill="#e9f0f5"/><text x="145" y="403" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#132a3b">Source paragraph 3</text><text x="145" y="500" font-family="monospace" font-size="26" fill="#075c55">Step 1:</text><text x="145" y="552" font-family="Arial,sans-serif" font-size="29" fill="#132a3b">Open the sample record.</text><text x="145" y="604" font-family="Arial,sans-serif" font-size="29" fill="#132a3b">Check that the café record</text><text x="145" y="647" font-family="Arial,sans-serif" font-size="29" fill="#132a3b">ID is present.</text><text x="145" y="745" font-family="Arial,sans-serif" font-size="23" fill="#516474">Fictional work instruction</text><path d="M764 571h73m-20-18 20 18-20 18" fill="none" stroke="#075c55" stroke-width="7"/><rect x="875" y="350" width="615" height="440" rx="16" fill="white" stroke="#d3dcd9" stroke-width="3"/><rect x="875" y="350" width="615" height="85" rx="16" fill="#e9f0f5"/><text x="910" y="403" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#132a3b">Extracted step 1</text><text x="910" y="500" font-family="monospace" font-size="23" fill="#075c55">source_paragraph_index: 3</text><text x="910" y="552" font-family="Arial,sans-serif" font-size="29" fill="#132a3b">Open the sample record.</text><text x="910" y="604" font-family="Arial,sans-serif" font-size="29" fill="#132a3b">Check that the café record</text><text x="910" y="647" font-family="Arial,sans-serif" font-size="29" fill="#132a3b">ID is present.</text><text x="910" y="745" font-family="Arial,sans-serif" font-size="23" fill="#516474">Recorded local extraction</text><text x="110" y="884" font-family="Arial,sans-serif" font-size="28" fill="#516474">28 parser tests + 4 independent CLI checks</text><text x="110" y="936" font-family="Arial,sans-serif" font-size="23" fill="#516474">Independent portfolio proof. No manufacturing-system connection.</text></svg>
