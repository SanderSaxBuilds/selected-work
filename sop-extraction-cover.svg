<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d"><title id="t">SOP extraction study</title><desc id="d">A labeled source paragraph and its extracted instruction share the same paragraph reference.</desc><rect width="1600" height="1000" fill="#ffffff"/><text x="110" y="125" font-family="Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="4" fill="#c2410c">DOCUMENT PROCESSING STUDY</text><text x="110" y="220" font-family="IBM Plex Serif, Georgia, serif" font-size="68" font-weight="600" fill="#111111">Keep every step traceable.</text><text x="110" y="278" font-family="Arial,sans-serif" font-size="29" fill="#565656">Explicit Word labels. JSON and CSV with paragraph references.</text><rect x="110" y="350" width="615" height="440" rx="16" fill="white" stroke="#e2e2e0" stroke-width="3"/><rect x="110" y="350" width="615" height="85" rx="16" fill="#fdeee6"/><text x="145" y="403" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#111111">Source paragraph 3</text><text x="145" y="500" font-family="monospace" font-size="26" fill="#c2410c">Step 1:</text><text x="145" y="552" font-family="Arial,sans-serif" font-size="29" fill="#111111">Open the sample record.</text><text x="145" y="604" font-family="Arial,sans-serif" font-size="29" fill="#111111">Check that the café record</text><text x="145" y="647" font-family="Arial,sans-serif" font-size="29" fill="#111111">ID is present.</text><text x="145" y="745" font-family="Arial,sans-serif" font-size="23" fill="#565656">Fictional work instruction</text><path d="M764 571h73m-20-18 20 18-20 18" fill="none" stroke="#c2410c" stroke-width="7"/><rect x="875" y="350" width="615" height="440" rx="16" fill="white" stroke="#e2e2e0" stroke-width="3"/><rect x="875" y="350" width="615" height="85" rx="16" fill="#fdeee6"/><text x="910" y="403" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#111111">Extracted step 1</text><text x="910" y="500" font-family="monospace" font-size="23" fill="#c2410c">source_paragraph_index: 3</text><text x="910" y="552" font-family="Arial,sans-serif" font-size="29" fill="#111111">Open the sample record.</text><text x="910" y="604" font-family="Arial,sans-serif" font-size="29" fill="#111111">Check that the café record</text><text x="910" y="647" font-family="Arial,sans-serif" font-size="29" fill="#111111">ID is present.</text><text x="910" y="745" font-family="Arial,sans-serif" font-size="23" fill="#565656">Recorded local extraction</text><text x="110" y="884" font-family="Arial,sans-serif" font-size="28" fill="#565656">28 parser tests + 4 independent CLI checks</text><text x="110" y="936" font-family="Arial,sans-serif" font-size="23" fill="#565656">Independent portfolio proof. No manufacturing-system connection.</text></svg>
