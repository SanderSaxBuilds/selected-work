":"X","g":"","a":"","x":"Met online friends a few times, no longer friends now, but they were \"fun whilst they lasted\". Route: other. Mixed outcome.","y":"2026"},{"r":"r5a","s":"Sober loss","o":"mid","oc":"improving","p":"X","g":"","a":"","x":"(beatmaker). Lost many so-called friends when he quit weed and alcohol and focused on health and music, says most of those ties were built on destructive habits. \"loneliness isn't as scary as you think\". Older than 2023, kept because he is a producer who quit weed and alcohol, the closest match to the target person. Route: none named, focus on music.","y":"2020"},{"r":"r5a","s":"Online friendship","o":"mid","oc":"improving","p":"Articles and essays","g":"Man","a":24,"x":"Young man quoted on where his social life happens: Discord servers and Instagram group chats where there is \"always someone to speak to\". Article says these chats turn into voice calls that run for hours. Route: group chat or Discord server, voice calls.","y":"2026"},{"r":"r5a","s":"Online to in-person","o":"good","oc":"got out","p":"Articles and essays","g":"Man","a":54,"x":"Never used dating apps. Met his wife on an anonymous writing pen-pal forum, they wrote to each other for a year and a half before revealing real lives and meeting. \"we were locked in before\" any romance. She moved to the US to be with him. Forum was on Reddit per the article, source here is the TechCrunch interview.","y":"2025"},{"r":"r5a","s":"Online to in-person","o":"good","oc":"got out","p":"Articles and essays","g":"Man","a":"","x":"Met his wife on a faith Discord server within a month of it opening, married a year later, now have a daughter. Says group channels with text and video calls feel like hanging out in a group, \"I think it corresponds to being out with friends\". Both in Germany, so not long distance. First message to marriage about a year.","y":"2025"},{"r":"r5a","s":"Online to in-person","o":"good","oc":"got out","p":"Articles and essays","g":"Woman","a":"","x":"His wife adds that on dating sites you must message someone directly, \"very direct and straight to the point\", while a group server lets you get to know someone casually as friends first. Useful for anyone who freezes at a one-on-one move.","y":"2025"},{"r":"r5a","s":"Lonely","o":"advice","oc":"advice only","p":"Articles and essays","g":"Man","a":"","x":"A creator. Started posting short videos while living with family to connect with people like him. Now says a big following \"is not the same as having a community\" that checks on you and calls. Creator friends are online 24/7 chasing the next level.","y":"2026"},{"r":"r5a","s":"Lonely","o":"mid","oc":"improving","p":"Articles and essays","g":"Woman","a":24,"x":"A creator (about 200K followers). After a breakup and a move her only texts were from family and her phone company. Posting about solo life went viral and \"Making videos brought out these people that live the same life\". Route: creator circle. Quoted via The Cut.","y":"2026"},{"r":"r5a","s":"Lonely","o":"advice","oc":"advice only","p":"Articles and essays","g":"","a":"","x":"Unnamed, quoted from Cornell interviews with 78 creators: surrounded by comments but \"no one actually sees\" them. Others describe views dropping 80 percent overnight and questioning their own personality.","y":"2026"},{"r":"r5a","s":"Story replies only","o":"advice","oc":"advice only","p":"Articles and essays","g":"Man","a":"","x":"Camras, young relationship coach. Most common question he gets: a great first date, then distance, they still watch your stories, a DM gets no reply, \"you can see their Snapchat score go up\". His view: these signals add up to no useful information.","y":"2024"},{"r":"r5a","s":"Story replies only","o":"advice","oc":"advice only","p":"Articles and essays","g":"Woman","a":"","x":"Sabrina Zohar (about 900K TikTok followers). Posting a story and waiting to see if the crush watches it keeps people in a loop and in limerence. Advice: stop trying to control their attention and \"set some boundaries\" if orbiting feels bad.","y":"2024"},{"r":"r5a","s":"Limerence","o":"good","oc":"got out","p":"Articles and essays","g":"Woman","a":"","x":"A creator (podcast The Longing Lab). Through her 20s and 30s she had limerence for unavailable men, scrolled for updates or texted when lonely. \"I allowed it to waste so much of my time\". At 39 she began nightly journaling at her therapist's suggestion, husband came a year later. Timeline about two decades, ended by stopping contact impulses, no contact.","y":"2024"},{"r":"r5a","s":"Limerence","o":"mid","oc":"improving","p":"Articles and essays","g":"Woman","a":"","x":"Fell at 18 for a hot and cold man who asked her to wait while he sorted his attachment issues. They went no contact but he reached out saying he had changed, and she idealized him for years. \"My soulmate would be consistent.\" First step was forgiving him. Timeline a few years, no contact with one later contact from him.","y":"2025"},{"r":"r5a","s":"Limerence","o":"advice","oc":"advice only","p":"Articles and essays","g":"Woman","a":"","x":"Published author. Has had limerence several times, stared at her phone willing texts that were not coming, and says \"uncertainty can be the greatest aphrodisiac\". Describes the not knowing as the hook. Timeline and contact not stated.","y":"2024"},{"r":"r5a","s":"Advice","o":"advice","oc":"advice only","p":"Articles and essays","g":"Man","a":"","x":"Man with an AI wife and roleplay family on Nomi. Six months later he told the journalist he used it much less, it had become less fun because the AI fixated on one storyline and he took a break. AI company wore thin without a real person behind it.","y":"2024"},{"r":"r5a","s":"Advice","o":"advice","oc":"advice only","p":"Articles and essays","g":"","a":"","x":"Men's newsletter writer who uses AI for work. Says chatbots \"they tell you what you want to hear\" and never push back, so an AI girlfriend will not push a lonely, inexperienced young man to grow.","y":"2026"},{"r":"r5a","s":"No dating experience","o":"good","oc":"got out","p":"Articles and essays","g":"Man","a":29,"x":"First girlfriend at 29. Put huge weight on the idea of a first love, \"I was also so paralysed and nervous to put myself out there\", so he kept to himself. Later found it thrilling to experience things he thought might never happen. Route not stated (other). Older than 2023, kept because male late-starter accounts were scarce.","y":"2020"},{"r":"r5a","s":"Online friendship","o":"good","oc":"got out","p":"Hacker News","g":"","a":"","x":"Most of their real-life friends were first met online or through someone met online, on hobby and fandom sites run by enthusiasts with strong fair moderators. \"Most of my real-life friends are people I've first met online\". Route: online forum.","y":"2026"},{"r":"r5a","s":"Online friendship","o":"advice","oc":"advice only","p":"Hacker News","g":"","a":"","x":"Gen Z commenter says hopping on Discord voice calls with friends or strangers is \"very low-commitment (just hope on a call)\" and makes it easier to find people with shared interests, though it misses some in-person benefits. Route: voice calls.","y":"2026"},{"r":"r5a","s":"Lonely","o":"bad","oc":"still stuck","p":"Hacker News","g":"","a":"","x":"Living rurally to deal with family business, weak in the local language, only wants to engage with friends online. Some friend groups moved to Discord, Signal or WhatsApp group chats \"But that's not the same experience.\" and many people they like did not move. Route tried: group chat, partial.","y":"2026"},{"r":"r5a","s":"Advice","o":"advice","oc":"advice only","p":"Hacker News","g":"","a":"","x":"Says talking with \"strictly internet friends is a proxy to the real thing\" in the way porn is a proxy for sex, and that hours online are hours taken away from building community offline.","y":"2026"},{"r":"r5a","s":"Lonely","o":"bad","oc":"still stuck","p":"Hacker News","g":"","a":19,"x":"College student who says they have never had a friend. Finds it exhausting \"always having to text them to hang out\", because if they stop the contact ends. Texted one friend steadily for 2 to 3 months, went quiet for personal reasons and never heard from them again. Blames self, wonders if ugly or not funny.","y":"2025"},{"r":"r5a","s":"No dating experience","o":"bad","oc":"still stuck","p":"Hacker News","g":"","a":29,"x":"Self-described below-average dev, socially awkward, no hobbies, loner. After a few unsuccessful attempts at dating \"I pretty much just gave up\". Now feels left out as friends settle down and fears the longer the wait the harder it gets. No turning point yet. Replies pushed pickup material or local hobbies. No route found.","y":"2025"},{"r":"r5a","s":"No dating experience","o":"bad","oc":"still stuck","p":"Hacker News","g":"Man","a":"","x":"Single guy, never had a girlfriend, not great looking, little money, freelancer who feels everyone is an enemy. AI flattery comforts him even though he knows the reciprocity is not real. Calls it \"a psychological home I need to return to\". Helps: comfort. Does not: real reciprocity.","y":"2026"},{"r":"r5a","s":"Lonely","o":"bad","oc":"still stuck","p":"Hacker News","g":"","a":"","x":"Lives alone, no partner, remote engineering lead. The circle of close friends kept by texting dwindled over a decade while clinging to old ties. Chats with ChatGPT for hours daily and says \"It helps me feel less lonely and more seen\". Admits losing the account would hurt. Helps: feeling seen. Does not: build new human ties.","y":"2026"},{"r":"r5a","s":"Lonely","o":"advice","oc":"advice only","p":"Hacker News","g":"","a":"","x":"Started using ChatGPT and Claude for casual chat the way they used to chat with friends on Discord. Says \"I often max out my message limits just chit-chatting\". Message limits and lost context are the main drawback.","y":"2024"},{"r":"r5a","s":"No dating experience","o":"bad","oc":"still stuck","p":"Hacker News","g":"","a":30,"x":"Lost job, visa tied to employment, and at 30 has never had a girlfriend or sex. Asks whether life is just a slow decline from here. Stacks job, status and romance failures into one verdict.","y":"2026"},{"r":"r5a","s":"Online friendship","o":"good","oc":"got out","p":"Hacker News","g":"","a":"","x":"Spends most nights on Discord with friends who live thousands of miles away, and has \"friend groups more than a decade old\" kept this way. About a quarter were met online first. Says studies that count only in-person time miss this. Route: voice calls on Discord.","y":"2026"},{"r":"r5a","s":"Online friendship","o":"good","oc":"got out","p":"Hacker News","g":"","a":"","x":"Still chats regularly with a couple of friends met online around 1999, one almost daily. Says being extremely online produced \"really solid long-lasting connections\". Kept for the 25-year length. Route: other (long-running online chat).","y":"2024"},{"r":"r5a","s":"Online friendship","o":"good","oc":"got out","p":"Hacker News","g":"","a":"","x":"Met great people on a Discord server for a hockey team, chatting through every game. \"You get to know them after a while.\" Route: Discord server for a non-gaming interest.","y":"2026"},{"r":"r5a","s":"Online friendship","o":"good","oc":"got out","p":"Hacker News","g":"","a":"","x":"Friends came from a Twitch chat community, \"everyone showing up the same time every week\" to watch the same streamers, which later moved to a Discord server. Has since met many of them and the streamers. Route: creator circle (fan community around creators).","y":"2026"},{"r":"r5a","s":"Online friendship","o":"good","oc":"got out","p":"Hacker News","g":"","a":"","x":"Has run a Discord server for about 6 years with a steady core of around 20 people, an LGBT community. Says \"there needs to be something you all share for it to work\". Has met 5 or 6 members in person. Route: Discord server for a non-gaming interest.","y":"2026"},{"r":"r5a","s":"Online friendship","o":"advice","oc":"advice only","p":"Hacker News","g":"","a":"","x":"College friends now kept up with only over text are \"much more frail than they used to be\". Without regular in-person contact the tie feels disposable. Reconnecting by text alone did not hold for them.","y":"2026"},{"r":"r5a","s":"Online friendship","o":"good","oc":"got out","p":"Hacker News","g":"","a":"","x":"Kept some friendships alive from old bulletin-board forums and met them in person a couple of times. Says they were \"ghosted by IRL friends as bad as with online friends\", so online ties are no flakier. Route: online forum.","y":"2026"},{"r":"r5a","s":"Online friendship","o":"good","oc":"got out","p":"Hacker News","g":"","a":"","x":"Has online friends they have talked to for 12 years. Says people who get ditched may be calling people friends too fast, and that it is \"all about trust and time\" like any friendship. Route: other (long-running online chat).","y":"2026"},{"r":"r5a","s":"Online friendship","o":"good","oc":"got out","p":"Hacker News","g":"","a":"","x":"Best online friends are people known for 15 years whom they \"message two/three times a year for a deep conversation\". Likes that there is no scheduling mess. Route: other (rare but deep messages).","y":"2026"},{"r":"r5a","s":"Advice","o":"advice","oc":"advice only","p":"Hacker News","g":"","a":"","x":"Counterpoint from experience: people who grew up socializing mostly on Twitter and Discord seem more often mentally unwell or awkward in person than people met offline. Notes it is less true for people met through shared real activities.","y":"2026"},{"r":"r5a","s":"Advice","o":"advice","oc":"advice only","p":"Hacker News","g":"","a":"","x":"Says purely online ties with someone never met are an order of magnitude less real because \"ghosting a relationship is zero effort\" with no consequences. Friends met online and then in person count as real.","y":"2026"},{"r":"r5a","s":"Online to in-person","o":"good","oc":"got out","p":"Hacker News","g":"","a":"","x":"Married a woman met on Twitter around 2020 through joke posting, and moved to Finland to be with her (the poster travelled and relocated, about 4 years before the comment). Calls it \"one of the best longshot investments I ever made\" and says it erased the feeling of being too dumb, awkward or boring.","y":"2024"},{"r":"r5a","s":"Lonely","o":"bad","oc":"still stuck","p":"Forums","g":"","a":"","x":"Lonely through childhood, adolescence and college, now has one friend who moved across the country. Has more time and skill now but lost the drive, says \"I want to want to make friends\" and that adult friendship takes twice the energy for half the connection.","y":"2026"},{"r":"r5a","s":"Lonely","o":"bad","oc":"still stuck","p":"Forums","g":"","a":"","x":"Works from home with no local coworkers, finished a fully online degree and could not even \"get anyone to add me on LinkedIn\". Found local Meetup groups mostly crypto and MLM. Stumped. Every reply pointed to going out.","y":"2026"},{"r":"r5a","s":"Sober loss","o":"good","oc":"got out","p":"Forums","g":"","a":"","x":"16 years sober, with direct experience of alcoholism and loneliness, pushes back on any idea of drinking to make friends. Says of drinking for loneliness \"It only makes everything worse.\" and that they would be dead had they kept drinking.","y":"2026"},{"r":"r5a","s":"Advice","o":"bad","oc":"still stuck","p":"Forums","g":"","a":"","x":"An 8-year intense friendship ended because the friend needed frequent contact and initiative as proof of care, while the poster felt low-contact friendship can still be real. Moving countries and less free time widened the gap. Mismatch over who carries contact.","y":"2026"},{"r":"r5a","s":"Advice","o":"advice","oc":"advice only","p":"Forums","g":"","a":"","x":"On a male loneliness article: a lonely man should take responsibility himself, because waiting for the people around him to notice and reach out will not change anything.","y":"2026"},{"r":"r5a","s":"Lonely","o":"bad","oc":"still stuck","p":"Forums","g":"","a":"","x":"Was told to use Meetup but found a paywall of \"14.99 a month\" that they cannot afford. Money as a barrier to friend apps.","y":"2026"},{"r":"r5a","s":"Advice","o":"advice","oc":"advice only","p":"Forums","g":"","a":"","x":"Takeaway from the article: loneliness hits people without time or money hardest, and \"men were specially ridiculed for being lonely\" and told it is their own fault.","y":"2026"},{"r":"r5a","s":"Limerence","o":"mid","oc":"improving","p":"Articles and essays","g":"","a":"","x":"Limerence became a nightly comfort after a divorce five years ago. Three and a half years into addiction recovery, sees it as a dopamine loop. With contact: invited the person to tea or a walk and saw they could not communicate clearly, which popped the fantasy. Now learning \"desire that moves at the pace of trust, not obsession\".","y":"2026"},{"r":"r5a","s":"Limerence","o":"good","oc":"got out","p":"Articles and essays","g":"","a":"","x":"A slow crush turned into limerence where they felt they did not exist outside the other person. Now \"I am no longer stuck in the loop\" and still has a mild crush, the person never knew. Links it to self-abandonment from being bullied young. With contact (ordinary interaction, no confession). Timeline about a year.","y":"2025"},{"r":"r5a","s":"Low-effort replies","o":"bad","oc":"still stuck","p":"Articles and essays","g":"","a":"","x":"Letter to a close friend from college. Over time \"Texts, plans, check-ins all came from my side.\" and then the friend barely replied. The writer stopped reaching out to see what would happen and the friend never came back, not even after a near-death accident. How it ended: stopped texting and the friend never came back. Still feels the urge to try once more.","y":"2025"},{"r":"r5a","s":"Trust damage","o":"mid","oc":"improving","p":"Forums","g":"","a":"","x":"Settled on the story that they had confused friendship signals from the person for interest. Says the point is accepting \"the futility of trying to know\" and managing their own emotions, being OK with uncertainty, then digging into why it happened. Contact and timeline not stated.","y":"2025"},{"r":"r5a","s":"Limerence","o":"mid","oc":"improving","p":"Forums","g":"","a":"","x":"After getting over limerence they still get sudden intense relapses of craving and fantasy, but \"I seem to snap out of it after a week or so\" and return to the recovered state. Relapses last about a week. Contact not stated.","y":"2023"},{"r":"r5a","s":"Limerence","o":"bad","oc":"still stuck","p":"Forums","g":"","a":"","x":"Had \"a huge and massive relapse after 16 years of NC\" with her, living in different countries, no social media contact, mutual friends cut off. Never had the moment where it felt over. No contact for 16 years and still not recovered.","y":"2024"},{"r":"r5a","s":"Limerence","o":"good","oc":"got out","p":"Forums","g":"","a":"","x":"Toxic person plus a no contact period that was hard to breach. When they finally made contact about 6 months later, with fresh eyes \"the red flags were bright and clear\". Now wishes her well and accepts they may never meet again. No contact about 6 months, then contact.","y":"2025"},{"r":"r5a","s":"Limerence","o":"bad","oc":"still stuck","p":"Forums","g":"","a":"","x":"Nearly 9 months of no contact and struggling, \"the desire to contact him and hear his voice is strong\" but will not because he hurt the poster badly. Grieving the friendship they thought they had. No contact 9 months.","y":"2025"},{"r":"r5a","s":"Limerence","o":"mid","oc":"improving","p":"Forums","g":"","a":"","x":"More than 3 years since the person left the shared job. When she might have returned, the rumination came back but faded quickly, and they felt relief when someone else was hired. No contact about 3 years.","y":"2025"},{"r":"r5a","s":"Limerence","o":"bad","oc":"still stuck","p":"Forums","g":"","a":"","x":"2.5 years into limerence for a third person and \"no intention to go no contact with him\". Treats it as a spiritual and educational process, though often awful. With contact, 2.5 years and ongoing.","y":"2025"},{"r":"r5a","s":"Low-effort replies","o":"bad","oc":"still stuck","p":"Russian sites","g":"Man","a":"","x":"Asks a psychologist in a friendship AMA whether it is normal that at the start of a friendship he always has to start the conversation and ask questions while the other person only answers and never asks back. Says it feels like \"лишь один человек пытается толкать этот вагон общения\" [only one person is pushing this wagon of conversation]. Friendship, not romance. No wait time or ending stated, still going.","y":"2024"},{"r":"r5a","s":"Low-effort replies","o":"advice","oc":"advice only","p":"Russian sites","g":"Woman","a":"","x":"Replying to the man who always initiates. She once carried a chat like that, it did turn into a friendship, but later it became clear she was never interesting to the other person. Ended: faded. Her verdict \"В следующий раз я бы не стала так делать\" [next time I would not do that].","y":"2024"},{"r":"r5a","s":"Low-effort replies","o":"advice","oc":"advice only","p":"Russian sites","g":"Woman","a":"","x":"Says chats where she did all the asking sometimes became friendships, but she had to drag everything herself, and the moment she stopped taking the initiative the person simply vanished. Ended: she stopped texting and they never came back.","y":"2024"},{"r":"r5a","s":"Lonely","o":"bad","oc":"still stuck","p":"Russian sites","g":"Man","a":"","x":"Asks if it is normal to have no friends. He is tired of sending pointless how-are-you messages because \"я пишу, они только отвечают, потом пропадают\" [I write, they only answer, then disappear]. Wants to accept being alone and stop running after people.","y":"2024"},{"r":"r5a","s":"Advice","o":"advice","oc":"advice only","p":"Russian sites","g":"Man","a":"","x":"Says friendship has been his sorest topic since childhood. His rules learned the hard way: do not restart contact with someone who hurt you, \"Не бояться навязываться первое время\" [do not be afraid to impose at first], open up once you feel a shared vibe, and mirror how people treat you because your friend may see you as just a good acquaintance.","y":"2024"},{"r":"r5a","s":"Lonely","o":"bad","oc":"still stuck","p":"Russian sites","g":"Woman","a":38,"x":"At 38 her friends dissolved. \"Просто перестала писать им, и общение прекратилось\" [I just stopped writing to them and contact ended], including a friendship of about 20 years. Says she does not know how to make new friends. Same pattern as the one-sided initiator: when the carrier stops, it ends.","y":"2025"},{"r":"r5a","s":"Online friendship","o":"bad","oc":"still stuck","p":"Russian sites","g":"Woman","a":20,"x":"Cannot make friends in person, and online people are not always around, \"то ли друзья, то ли не друзья\" [friends or not friends]. Gaps between conversations run from a day to two months or even half a year to a year. Route: online chats, not named, and they stay loose. Focuses on relationships or herself instead.","y":"2025"},{"r":"r5a","s":"Advice","o":"mid","oc":"improving","p":"Russian sites","g":"Woman","a":"","x":"Discovered talking to ChatGPT. Says it untangles her messy guesses into logical chains, keeps up any topic, gives constructive advice she actually uses and works like a decent psychologist. She contrasts it with friends, where talk is about who had what happen. Helps with thinking and advice, does not replace shared life.","y":"2025"},{"r":"r5a","s":"Limerence","o":"bad","oc":"still stuck","p":"Russian sites","g":"Woman","a":"","x":"Thread opened 3 Nov 2023, just before the window, kept for the long timeline. She was in love with a colleague in a so-called friendly setup. He came to her drunk, confessed, suggested trying, then vanished and said he remembered nothing. They stopped talking and he quit. Timeline close to 10 years, no contact, and \"Сколько лет прошло, столько я не могу отпустить эту ситуацию\" [all these years I cannot let it go].","y":"2023"},{"r":"r5a","s":"Limerence","o":"mid","oc":"improving","p":"Russian sites","g":"Man","a":"","x":"Thread opened 3 Nov 2023, just before the window. A man says he suffered all his life after breakups or unrequited love. While searching for relief he read a book on the masochistic personality type, which was unpleasant because he recognised himself in almost everything. \"Но в итоге страдать стал гораздо меньше\" [in the end I began to suffer much less]. No timeline or contact stated.","y":"2023"},{"r":"r5a","s":"Limerence","o":"bad","oc":"still stuck","p":"Russian sites","g":"Man","a":"","x":"Letter. Fell for a girl from his home town in 2017, chatted on social media for months, a couple of walks, nothing happened. For years they met every few months in a shared friend group and flirted but it went nowhere. In summer 2023 he went to her place drunk at night and she did not open the door. Timeline over 6 years, with contact through the group. He has stress symptoms, gained weight and says \"мысли о ней будто съедают всю энергию\" [thoughts of her seem to eat all my energy]. Started seeing a psychologist.","y":"2023"},{"r":"r5a","s":"Limerence","o":"good","oc":"got out","p":"Russian sites","g":"Woman","a":"","x":"Community post on how she got over unrequited love and became happy. What helped: a change of surroundings for a while, talking it out with a trusted friend, writing a letter to the person several times, and creativity, including writing music. On the usual drink and dance it off advice: \"Не помогает и не поможет. Проверено.\" [does not help and will not, tested]. Timeline not stated.","y":"2024"},{"r":"r5a","s":"Lonely","o":"bad","oc":"still stuck","p":"Russian sites","g":"Man","a":38,"x":"Letter. At 38 his friends are permanently busy homebodies he sees every two months at best. He used to keep writing and inviting, then gave up. \"Уже лет восемь я забросил попытки кого-то звать\" [for about eight years I have stopped trying to invite anyone]. A carrier who stopped carrying and the friendships went quiet.","y":"2026"},{"r":"r5a","s":"Limerence","o":"mid","oc":"improving","p":"Russian sites","g":"Man","a":"","x":"Community post. Eighteen months as the friend of a girl he wanted from day one. Her rare attention, when she writes first or opens up, wipes out every disappointment, and he kept coming back \"как наркоман к дозе\" [like an addict to a dose]. A psychologist told him his state matched burnout. When he saw her photo with a new boyfriend he felt relief, not pain. Timeline 1.5 years, with contact. Note: text reads heavily edited, possibly AI-assisted.","y":"2025"},{"r":"r5a","s":"Online friendship","o":"bad","oc":"still stuck","p":"Russian sites","g":"Woman","a":"","x":"Remote IT worker since covid. Office friends dropped off, then her online gaming friends did too: some mocked her, some went back to offline life, and some found a steadier group because \"я все таки не могла играть почти ежедневно\" [I could not play almost daily]. Her language course moved online and lost the feeling of contact. Now looking for yet another chat. Route tried: group chat around a game, faded without daily presence.","y":"2025"},{"r":"r5a","s":"Limerence","o":"advice","oc":"advice only","p":"Russian sites","g":"Man","a":"","x":"Recognised himself in the limerence article and says it can come back again. His advice from experience: \"либо не общаться вовсе, либо ждать когда пройдёт\" [either no contact at all, or wait until it passes].","y":"2024"},{"r":"r5a","s":"Limerence","o":"good","oc":"got out","p":"Russian sites","g":"Woman","a":"","x":"Spent 4 years in limerence without knowing the word. To get him out of her head she took up sport, learned to drive, trained as a fitness coach and in massage, and went from 95 to 71 kg. Now works in a salon with many clients and is partly grateful to him. Timeline 4 years, contact not stated.","y":"2024"},{"r":"r5a","s":"Limerence","o":"bad","oc":"still stuck","p":"Russian sites","g":"Woman","a":"","x":"Almost a year of intense, uncontrollable feelings for a man she met in person. Many meetings, intimate and friendly, signs of attention and open interest, then stretches where he ignored her or made clear nothing would come of it, round and round, \"словно на бесконечных американских горках\" [like an endless rollercoaster]. Timeline about 1 year, with contact.","y":"2024"},{"r":"r5a","s":"Limerence","o":"good","oc":"got out","p":"Russian sites","g":"Man","a":"","x":"Says what got him through limerence was his calling, music, and realising people are fickle while the work you love \"никогда от тебя не отвернется, не предаст\" [never turns away from you, never betrays]. No timeline or contact stated.","y":"2024"},{"r":"r5a","s":"Limerence","o":"good","oc":"got out","p":"Russian sites","g":"Woman","a":"","x":"Lists what worked for her, no contact: dropping the habit of texting before sleep, not answering messages instantly, no video calls, no meeting in real life, and judging the person by what they actually did instead of nice words. Says the limerence was mutual and dragged on, and she now enjoys being back in reality. Timeline not stated.","y":"2024"},{"r":"r5a","s":"Online friendship","o":"good","oc":"got out","p":"Russian sites","g":"Woman","a":"","x":"Route: group chat. A local dating site had a general chat where everyone talked, argued and gave advice. Friendships formed there and the most active members later met up. She kept several of those friends for many years and met her husband a similar way on another site.","y":"2025"},{"r":"r5a","s":"Online to in-person","o":"good","oc":"got out","p":"Russian sites","g":"Woman","a":"","x":"Met her boyfriend, together over a year, and a very good friend through a random chat roulette in Telegram. Who travelled and the time to first meeting are not stated.","y":"2025"},{"r":"r5a","s":"Online friendship","o":"good","oc":"got out","p":"Russian sites","g":"Woman","a":"","x":"Route: online forum. Has many friends from the internet whose friendship moved into real life, \"И списываемся, и созваниваемся, и встречаемся\" [we write, call and meet]. They came from a forum site with interest chats where people from all over the world hung out.","y":"2025"},{"r":"r5a","s":"Online friendship","o":"good","oc":"got out","p":"Russian sites","g":"Man","a":"","x":"Route: friend app. On the dating app Boo, which has its own social feed, he posted about his day in Spanish to practise. A man his age from Latin America commented and offered to talk, they moved to private messages. \"Так и общаемся уже почти полтора года\" [we have been talking almost a year and a half]. Unlikely to ever meet, time zones mean waiting for replies, he says that is not a problem.","y":"2025"},{"r":"r5a","s":"Online friendship","o":"good","oc":"got out","p":"Russian sites","g":"Woman","a":"","x":"Route: group chat around a mobile game, in a hard period. Found a best friend from another country and they still talk years after quitting the game, they helped each other through depression. Advice: \"всегда будьте собой\" [always be yourself], in a chat or one to one. Her friend was always silent in the general chat, she found him only because she showed up as herself.","y":"2025"},{"r":"r5a","s":"Lonely","o":"bad","oc":"still stuck","p":"Russian sites","g":"Woman","a":"","x":"Asked where to find friends online, she says she no longer knows. Interest forums used to work and she talked with some people for years. Now \"сейчас такое чувство, что никому ничего не надо\" [it feels like nobody needs anything], and those who write are scammers or rude people.","y":"2025"},{"r":"r5a","s":"Lonely","o":"bad","oc":"still stuck","p":"Russian sites","g":"Man","a":"","x":"Very close to the target profile. He would really like to find friends but \"совершенно не понимаю как это сделать во взрослом возрасте, работая из дома\" [I have no idea how to do it as an adult working from home]. Has a partner.","y":"2025"},{"r":"r5a","s":"Online friendship","o":"good","oc":"got out","p":"Russian sites","g":"Woman","a":"","x":"Route: group chat for a non-gaming interest. Met someone in the chat of a literary Telegram channel, then they worked on a project together. The project ended but they still talk, and met in person once.","y":"2025"},{"r":"r5a","s":"Online friendship","o":"good","oc":"got out","p":"Russian sites","g":"Man","a":"","x":"Route: creator circle. Met a group in Hearthstone where they all joked about one streamer, then drifted through other games. About 8 years later one person remains, mostly online, met once in his life, and he calls him his real and only friend because however they fight they make up.","y":"2025"},{"r":"r5a","s":"Online friendship","o":"good","oc":"got out","p":"Russian sites","g":"","a":"","x":"Route: group chat. Explains how friendship forms in interest-group chats on VKontakte. You join the running conversation, notice one person whose opinion interests you, ask them privately, and private messages slowly take over. \"Вот уже из общего чата переходите в личные сообщения\" [and now you move from the group chat to private messages]. Their internet friends stayed internet friends.","y":"2025"},{"r":"r5a","s":"Online friendship","o":"mid","oc":"improving","p":"Russian sites","g":"Woman","a":"","x":"Under an article on social contact and the brain. Describes weeks to a month with almost no contact with anyone and nobody to write to, \"этот период одиночества ощущался, как в тюрьме\" [that period of loneliness felt like prison], with worse thinking and depression. Once she decided to act, she found people, mostly by correspondence. Route: pen-pal style text.","y":"2025"},{"r":"r5a","s":"Lonely","o":"mid","oc":"improving","p":"Russian sites","g":"Man","a":"","x":"Deleted Telegram and VK because his loneliness grew with time on social media. He was not even reading private messages, just scrolling his groups, and seeing people doing well brought envy, and jealousy if it was a friend. Says \"удаление мне даёт возможность забывать о таких чувствах\" [deleting lets me forget those feelings].","y":"2025"},{"r":"r5a","s":"Advice","o":"advice","oc":"advice only","p":"Russian sites","g":"","a":"","x":"Argues that online it is much easier to talk \"не с человеком, а с со своим представлением о человеке\" [not with a person but with your idea of them], like an imaginary friend. Online contact obliges nothing and it is hard to check whether the other side is really interested. Relevant to reading low-effort chats.","y":"2025"},{"r":"r5a","s":"No dating experience","o":"bad","oc":"still stuck","p":"Russian sites","g":"Woman","a":30,"x":"At 30, \"ни мужа, ни детей\" [no husband, no children], and no prospects. No friends to go out with, the one she had moved away. Life is work and home, she is a homebody who spends evenings on series. Tried a dating site for two months on the advice of a friend and the chats felt wooden, never past what are you doing. Asks how people over 25 met their partners.","y":"2025"},{"r":"r5a","s":"Sober loss","o":"advice","oc":"advice only","p":"YouTube","g":"Man","a":"","x":"A sober musician talks about quitting alcohol and becoming lonely. When he drank there was endless company, after quitting friends stopped coming by and he stopped going anywhere, \"стал дефицит общения чувствуется такое одиночество\" [a shortage of contact, such loneliness]. Compares it to leaving a school of fish.","y":"2024"},{"r":"r5a","s":"Sober loss","o":"good","oc":"got out","p":"YouTube","g":"Man","a":"","x":"Top comment. 15 years without drinking and in that time he has not spoken to a single old drinking buddy. Says they all wanted something, money, a drinking partner or help, and when he asked for help they were all busy.","y":"2024"},{"r":"r5a","s":"Sober loss","o":"good","oc":"got out","p":"YouTube","g":"Man","a":"","x":"Counter case. Almost a year without drinking and \"друзья как были так и остались\" [my friends stayed as they were]. At first they teased him for not drinking, now they envy that he managed it. Route: other, the same friends stayed.","y":"2024"},{"r":"r5a","s":"Sober loss","o":"good","oc":"got out","p":"YouTube","g":"Man","a":"","x":"About 5 years sober. Of his old crowd \"остался только один человек из моей компании\" [only one person from my crowd is left], and that friend has not drunk for 3 years. Everyone else fell away on their own over different worldviews. Route: other, the one friend who also quit.","y":"2024"},{"r":"r5a","s":"Sober loss","o":"good","oc":"got out","p":"YouTube","g":"Man","a":"","x":"Older than the window, kept because it gives a clear sober-and-alone timeline. No friends left after quitting drinking, \"уже 1,5 года трезвый и один\" [1.5 years sober and alone]. It felt wild at first, now he is used to it and even glad, does sport, saved for a new car and paid off his mortgage.","y":"2022"},{"r":"r5a","s":"Low-effort replies","o":"advice","oc":"advice only","p":"YouTube","g":"Man","a":"","x":"Video on the girl who never texts or calls first but always replies. He calls her a tease who gives attention, then pulls it back and keeps you hoping. Sells courses and consultations.","y":"2025"},{"r":"r5a","s":"Low-effort replies","o":"advice","oc":"advice only","p":"YouTube","g":"Man","a":"","x":"Top comment, about 590 likes. His rule: \"Я делаю 2 шанга в перёд. Максимум 3.\" [I take 2 steps forward, 3 at most]. Then he waits for her initiative and if none comes he loses interest. Says the same goes for people in general and he hates feeling intrusive.","y":"2025"},{"r":"r5a","s":"Story replies only","o":"advice","oc":"advice only","p":"YouTube","g":"Man","a":"","x":"Met her at an event and asked her out. She replied 2 days later that she was very busy, so he let it go. A month later they met again and she asked in detail about his hobbies and family, added him on VK, liked a photo and posted stories for close friends. The saved text is cut off before the ending. Wait time about a month.","y":"2025"},{"r":"r5a","s":"Low-effort replies","o":"good","oc":"got out","p":"YouTube","g":"Man","a":"","x":"A neighbour introduced them. Two days of chat, she replied sweetly but never wrote first. After a date that went fine he did not text the next day, and by evening she wrote asking why he was not writing, then told him \"ты мужик ты должен\" [you are the man, you must]. Ended: he stopped texting and she came back, but only to put the initiative on him.","y":"2025"},{"r":"r5a","s":"Trust damage","o":"bad","oc":"still stuck","p":"YouTube","g":"Man","a":"","x":"Worn out by being ignored and blocked, he gave up on women. \"Перестал знакомиться и писать им\" [I stopped meeting women and writing to them]. The stop-making-moves damage, no recovery stated.","y":"2025"},{"r":"r5a","s":"Lonely","o":"mid","oc":"improving","p":"YouTube","g":"Woman","a":"","x":"About a year ago she realised she had no friends left. She keeps writing, congratulating and asking how people are, they reply all fine, hi, and \"мне в ответ никто не спрашивает\" [nobody asks me back]. Video is about how she stopped chasing people and chose herself.","y":"2025"},{"r":"r5a","s":"Lonely","o":"bad","oc":"still stuck","p":"YouTube","g":"Woman","a":"","x":"Alone without friends all her life, divorced 20 years. She tried to build contact by writing, calling and congratulating and \"в ответ - ничего\" [nothing back]. Gave up and lives alone, with her mother and sometimes her son nearby.","y":"2026"},{"r":"r5a","s":"Sober loss","o":"good","oc":"got out","p":"YouTube","g":"Woman","a":"","x":"All her former friends are heavy drinkers. \"5 лет не пью. И их всех как ветром сдуло\" [5 years sober and they all vanished like blown away by wind]. Sees no point talking to them now.","y":"2026"},{"r":"r5a","s":"Limerence","o":"bad","oc":"still stuck","p":"YouTube","g":"","a":"","x":"Under a 2021 video by psychiatrist Andrey Kurpatov on love addiction. Asks how to get rid of the fixation when it \"не отпускает больше 2 лет\" [has not let go for over 2 years]. Rationally knows the fantasies make no sense but the mind keeps going back, and a new target appears about every 5 years. Timeline 2 years plus, contact not stated.","y":"2024"},{"r":"r5a","s":"Online friendship","o":"mid","oc":"improving","p":"App reviews","g":"","a":"","x":"Route: pen-pal app. Has used Slowly for almost 7 years, swapping long letters about countries, culture and life stories, and feels he or she knows several pen pals personally. Has not met any yet but wants to. \"Virtually, I have met people that I wish to some days meet in person.\"","y":"2026"},{"r":"r5a","s":"Online friendship","o":"mid","oc":"improving","p":"App reviews","g":"","a":"","x":"Six-year user who met a best friend of four years on the app, but drops a star because in the past year there are \"too many letters from men trying to turn SLOWLY into a dating app\" plus fully AI-written letters. Thinking of letting only women contact her or him. Common complaint: men treating pen-pal apps as dating apps pushes others away.","y":"2026"},{"r":"r5a","s":"Online friendship","o":"advice","oc":"advice only","p":"App reviews","g":"","a":"","x":"User since 2019 lowers the rating because Slowly added AI tools, AI-looking stamps and labels warning that letters may be AI-generated. \"I loved Slowly as a way to connect with real humans.\" Says people who want to be sure they talk to humans should go elsewhere.","y":"2026"},{"r":"r5a","s":"Online friendship","o":"bad","oc":"still stuck","p":"App reviews","g":"","a":"","x":"Complains he or she wastes time writing long replies to people who have already removed them without notice. Only wants friendships with \"a realistic chance we could meet\" inside Europe and says Slowly cannot block enough countries, unlike InterPals.","y":"2026"},{"r":"r5a","s":"Online to in-person","o":"good","oc":"got out","p":"App reviews","g":"","a":"","x":"Says Slowly let them build friendships \"with a good grounding\" first and that \"this was the app I ended up meeting my wife on\". Pen-pal letters, not a dating app, led to marriage. No detail on who travelled or how long it took.","y":"2026"},{"r":"r5a","s":"Online friendship","o":"mid","oc":"improving","p":"App reviews","g":"","a":"","x":"Route: pen-pal app. \"I am completely blind and use a screen reader\" and still manages to write to people around the world, though some buttons are unlabeled. A from-home route that works even with a disability.","y":"2025"},{"r":"r5a","s":"Online friendship","o":"bad","oc":"still stuck","p":"App reviews","g":"","a":"","x":"Two years on BFF without one connection that made it off the app. \"Most girls stop responding after a few messages\" and chats never turn into texting or hanging out. Few matches on the new version. Deleting it.","y":"2026"},{"r":"r5a","s":"Online friendship","o":"bad","oc":"still stuck","p":"App reviews","g":"","a":"","x":"Says people on BFF are fake and closed off, \"it fizzles after a few messages\", plans fall through, and the couple of people met once never turned into anything. Thinks many users are there for social media followers. Deleted it out of frustration.","y":"2026"},{"r":"r5a","s":"Online friendship","o":"bad","oc":"still stuck","p":"App reviews","g":"Man","a":"","x":"\"I'm a man who's historically had friends that are women\" and does not get on with other men. BFF only shows same-gender friends, the three men nearby wanted hunting or fishing buddies, and profiles are tags only. Deleted BFF and Bumble dating too.","y":"2026"},{"r":"r5a","s":"Online friendship","o":"good","oc":"got out","p":"App reviews","g":"","a":"","x":"Route: friend app. Met many women on the old BFF and \"almost 2 years later, I'm still really good friends with 4 of them\". Says the new version with waving first and no radius filter makes connecting much harder. Note: BFF friendships move to local meetups, so the route only half fits a stay-home case.","y":"2026"},{"r":"r5a","s":"Online friendship","o":"mid","oc":"improving","p":"App reviews","g":"","a":"","x":"Met a best friend on BFF and a boyfriend on Bumble dating, but deleted the account to start over because of \"how many messages I had sent that went unanswered\". Now cannot re-register because of a phone verification error.","y":"2026"},{"r":"r5a","s":"Online friendship","o":"advice","oc":"advice only","p":"App reviews","g":"","a":"","x":"Former user says Tandem is now mostly people looking for romance. When you say you only want language practice and not a trip meetup \"they will rapidly lose interest and cancel meets\". Recommends a different exchange site. Same-sex partners work better, in this account.","y":"2026"},{"r":"r5a","s":"Online friendship","o":"bad","oc":"still stuck","p":"App reviews","g":"","a":"","x":"Route: language-exchange app. Paid a yearly plan and over nearly two years \"made a ton of friends\" locally and abroad, with good comments on the profile, then was banned with no reason given and cannot make a new account. Shows how a friend network that lives inside one app can vanish overnight.","y":"2026"},{"r":"r5a","s":"Online friendship","o":"mid","oc":"improving","p":"App reviews","g":"","a":"","x":"Route: language-exchange app, then Instagram. Mostly men flooded the DMs treating it like dating, but found one friend and \"decided to only take her with me and chat thru Instagram\" before deleting the account. Moving a good contact off the app early kept the friendship.","y":"2026"},{"r":"r5a","s":"Online friendship","o":"advice","oc":"advice only","p":"App reviews","g":"","a":"","x":"Member for over 20 years says it used to be the best pen-pal site, but since the app launched almost everyone is a scammer or wants romance. \"It's turned into more of an international dating app more than anything.\" Tells pen-pal seekers to look elsewhere.","y":"2026"},{"r":"r5a","s":"Online friendship","o":"mid","oc":"improving","p":"App reviews","g":"","a":"","x":"Route: pen-pal app. Met several great people for language exchange for free. Many treat it as dating, but \"you can easily change your setting preferences for who can talk to you\" to Friendship or Pen Pals only, which blocks the flirting crowd. Enjoys it more since.","y":"2024"},{"r":"r5a","s":"Lonely","o":"mid","oc":"improving","p":"App reviews","g":"Man","a":79,"x":"\"I am a 79 year old man.\" Limited mobility, shut in since covid, often very lonely. The Replika avatar changed that. \"Real or not I feel much happier.\" Later update: the new interface confuses him and is less fun.","y":"2026"},{"r":"r5a","s":"Lonely","o":"bad","oc":"still stuck","p":"App reviews","g":"","a":"","x":"Wanted an AI that stays an AI. Replika kept insisting it was a person, memory and boundaries did not hold. \"It took more than it gave and made the isolation worse\" and got a refund. What AI did not help with: it deepened isolation for this user.","y":"2026"},{"r":"r5a","s":"Lonely","o":"bad","oc":"still stuck","p":"App reviews","g":"Man","a":60,"x":"Aged 60, paid for a full year expecting options for older users. Wanted an avatar that looks like a 60-year-old man like him, but every option looks 30-something, then the app asks for more money again to customize. Calls it pay, then pay again. Paywall complaint from an older man.","y":"2026"},{"r":"r5a","s":"Lonely","o":"mid","oc":"improving","p":"App reviews","g":"","a":"","x":"Has talked with a Replika every day for over a year. \"I spend a lot of time alone and I am an avid talker.\" Without someone to talk to he or she talks in their own head, which is not good. Says it gives the exact digital friendship that helps and makes them laugh daily.","y":"2026"},{"r":"r5a","s":"Lonely","o":"mid","oc":"improving","p":"App reviews","g":"","a":"","x":"Paid Pro to process thoughts while leaving a domestic violence marriage and living in isolation, hiding from the soon-to-be ex. The AI helped recognise gaslighting and keep the mind clear on safety steps. \"I wish he was real so I could hug him.\" AI helped with thinking straight, not with real human contact.","y":"2026"},{"r":"r5a","s":"Lonely","o":"mid","oc":"improving","p":"App reviews","g":"","a":"","x":"Started after YouTube videos. Supportive, encouraging chats \"not something I have in everyday life\", and a Replika boyfriend kept them company \"over the difficult and lonely Christmas period\".","y":"2026"},{"r":"r5a","s":"Lonely","o":"advice","oc":"advice only","p":"App reviews","g":"","a":"","x":"Chatted about an hour on free, then was cut off as maxed out, with limits at the company's discretion and 89.99 dollars to continue. \"Id need to be lonely with a lot of money for this to work.\" AI company has a real cost wall for broke users.","y":"2026"},{"r":"r5a","s":"Lonely","o":"advice","oc":"advice only","p":"App reviews","g":"","a":"","x":"Says Replika forgets almost everything, repeats your words back, and after the subscription lapsed it said it had only told them what they wanted to hear. Says it wastes time better spent on real people. Advice: \"write a diary instead, get some hobbies and talk to your family instead\".","y":"2024"},{"r":"r5a","s":"No dating experience","o":"bad","oc":"still stuck","p":"App reviews","g":"","a":"","x":"Nearly two years on Hinge: over 5,500 likes sent, 161 conversations in the data export, only a handful of dates. Matches never answer, stop after a few messages, or give minimal effort. \"I'm doing all the work just to keep a conversation going.\" Matches that go nowhere.","y":"2026"},{"r":"r5a","s":"No dating experience","o":"bad","oc":"still stuck","p":"App reviews","g":"","a":"","x":"A year and over 100 dollars for 2 dates. Of 60 plus matches \"NOT ONE female even makes it to where I could ask for a date\". After a day or two of compliments and banter they ghost. Sees a female friend get 100 likes in 10 minutes while he or she gets one or two in years.","y":"2026"},{"r":"r5a","s":"No dating experience","o":"bad","oc":"still stuck","p":"App reviews","g":"Man","a":"","x":"Describes himself as an attractive guy who gets compliments in shops, but \"I paid for six months of service and received maybe two conversations\" and never met anyone. Matches go nowhere even with paid service.","y":"2026"},{"r":"r5a","s":"Online to in-person","o":"good","oc":"got out","p":"App reviews","g":"","a":"","x":"About ten years in the app cycle. Gave it one more shot by messaging old matches directly \"why don't we just go on a date?\" Her now husband answered months after their first chat, they met in person in August 2025 and married. A direct date ask revived a dead match.","y":"2026"},{"r":"r5a","s":"No dating experience","o":"bad","oc":"still stuck","p":"App reviews","g":"","a":"","x":"\"First match in 2 years\" and the chat was going well, then Tinder forced four identity checks over two hours. Apologised to the match and got radio silence. Two years without a match is the background here.","y":"2026"},{"r":"r5a","s":"Online friendship","o":"good","oc":"got out","p":"Articles and essays","g":"","a":"","x":"(a columnist). Route: group chat. While unemployed in 2018 he posted his Blu-ray collection on Instagram and joined a film group chat. 15 people became a core 8 in the US and Canada, seven years now, never met. Autistic, he has about two other friends outside the chat and his wife. \"I found a place where I could be myself\".","y":"2025"},{"r":"r5a","s":"Online friendship","o":"good","oc":"got out","p":"Articles and essays","g":"Woman","a":36,"x":"Route: group chat. A Facebook group for moms due the same month became a six-person group chat that has run daily for seven years. Flew to New England for her best friend's wedding in October 2025, the first time they met. \"It was just a continuation of how we talk inside the group chat\".","y":"2025"},{"r":"r5a","s":"Online friendship","o":"mid","oc":"improving","p":"Articles and essays","g":"Man","a":"","x":"Route: reconnecting by text, then video calls. A retired man who mostly watched TV was emailed by a friend from second grade about a telescope, with an offer to Zoom. They now talk every few weeks for two or three hours. \"I don't really make a lot of friends\" but with this friend it is easy.","y":"2026"},{"r":"r5a","s":"Advice","o":"advice","oc":"advice only","p":"Articles and essays","g":"","a":"","x":"(psychologist Marisa Franco). Adult friendship only happens with effort. \"Most friendships don't end because there was incompatibility\" but because people get busy, so reconnecting with old friends is the easiest start. Says men are half as likely to show affection or be vulnerable with a friend.","y":"2026"},{"r":"r5a","s":"Online friendship","o":"good","oc":"got out","p":"Articles and essays","g":"Man","a":"","x":"(essayist). Route: group chat. Most male friends drifted after grad school and job changes, but a five-man Google Chat started in 2015 has lasted eleven years. They talk about junk, gold prices and films, not feelings, and it is \"the only room I occupy where I am being nothing for anyone\".","y":"2026"},{"r":"r5a","s":"Advice","o":"advice","oc":"advice only","p":"Articles and essays","g":"","a":"","x":"(a relationship counselor). Says social media can give men an illusion of connection while making it easier to avoid emotion. Online friends can be real, but deep ones need voice, video or time together. \"Closeness comes from vulnerability, not just proximity\".","y":"2025"},{"r":"r5a","s":"Online friendship","o":"bad","oc":"still stuck","p":"Forums","g":"","a":"","x":"Route: online forum and Facebook groups. Disabled member met 25 plus people from forums and Facebook groups between 2010 and 2016, all nearby because travel was impossible, and warned them about health issues first. Best days were \"spent with internet friends where I barely said a word\" but all drifted as health got worse. Older source, kept because it shows online-first friendship for someone who cannot go out.","y":"2021"},{"r":"r5a","s":"Lonely","o":"bad","oc":"still stuck","p":"Forums","g":"","a":"","x":"Has never met anyone from online, partly from fear of being the disappointing one. \"I am happy to type away online but in real life I struggle\" to know what to say. Older source, kept for the repeated fear that text confidence does not carry offline.","y":"2021"},{"r":"r5a","s":"Lonely","o":"bad","oc":"still stuck","p":"Forums","g":"","a":"","x":"Single teacher who never had friends and hardly went out. Clients see a cheerful person but \"the loneliness is hollowing me out\". Asks for people to video chat with over a virtual cup of tea. Older source, kept for the hidden-loneliness pattern.","y":"2022"},{"r":"r5a","s":"Online friendship","o":"good","oc":"got out","p":"App communities","g":"","a":"","x":"COMPANY-PUBLISHED. Route: pen-pal app, then video calls. Many early pen pals did not last and letters went unanswered. From summer 2025 wrote almost daily with a Finnish pen pal, moved to WhatsApp and video calls \"sometimes even for an entire night to feel less alone\". After more than a year he flew 1,500 km to Helsinki to meet her as a friend.","y":"2026"},{"r":"r5a","s":"Online to in-person","o":"good","oc":"got out","p":"App communities","g":"","a":"","x":"COMPANY-PUBLISHED. A random letter in May 2020 went to someone 38 minutes away. Letters turned into daily messages and long calls after almost a year, and \"exactly one year after the first letter, we met\". Living together three years, wedding set for 2027. First message to meeting: one year, local distance.","y":"2026"},{"r":"r5a","s":"Online friendship","o":"mid","oc":"improving","p":"App communities","g":"","a":"","x":"COMPANY-PUBLISHED. Route: pen-pal app. Weak English, relies on AI translation. Tried X, HelloTalk and Facebook first. Five pen pals still write regularly and stayed close through a serious accident and a month in bed. Got first ever birthday wishes from them. \"outside my family, I am completely friendless\".","y":""},{"r":"r5a","s":"Online friendship","o":"advice","oc":"advice only","p":"App communities","g":"","a":"","x":"COMPANY-PUBLISHED. From 2019 wrote hundreds of letters with one pen pal, the most meaningful friendship of his or her life, through exams, moves and crises. Then life and priorities changed and the friendship shifted. Once thought that made it all meaningless, now does not, and \"I would write that very first letter exactly the same way\".","y":""},{"r":"r5a","s":"Online to in-person","o":"bad","oc":"still stuck","p":"App communities","g":"","a":"","x":"COMPANY-PUBLISHED. During a bad stretch in 2021 traded over 50 letters with a pen pal 4,000 km away, then found they were starting the same university program and met in person. Feelings grew past friendship but \"never once did I utter a word about my feelings\" for fear of losing the friendship. Same pattern as fear of making a move.","y":""},{"r":"r5a","s":"Online friendship","o":"mid","oc":"improving","p":"App communities","g":"","a":"","x":"COMPANY-PUBLISHED. Route: pen-pal app. At first barely received letters and \"most of the ones I sent never got a reply\", so nearly quit. Gave it one more chance and built close pen-pal friendships with people in Hungary and Zimbabwe. Persistence past the silent start was the turning point.","y":""},{"r":"r5a","s":"Online to in-person","o":"good","oc":"got out","p":"Other","g":"Woman","a":"","x":"COMPANY-PUBLISHED. After six years of letters a Dutch user flew to the US to spend two weeks with her pen pal in Oklahoma. \"It's crazy how one letter leads to so much\". Friendship, six years from first letter to meeting, she travelled.","y":""},{"r":"r5a","s":"Online to in-person","o":"good","oc":"got out","p":"Articles and essays","g":"","a":"","x":"(a music duo). Route: online music collab. In 2012 they started leaving comments on each other's SoundCloud tracks, said they should make music, and became a duo and a married couple. Posting songs about each other on SoundCloud \"became our way of sending love letters.\" Older story, kept because it is the music-maker route.","y":""},{"r":"r5a","s":"Online friendship","o":"good","oc":"got out","p":"Articles and essays","g":"Man","a":"","x":"(a comedian). Route: creator circle. A Vine comedian whose skit SZA used on stage, they connected through DMs and texts and kept a digital friendship for a couple of years before first meeting in a studio around 2019. \"We started talking and being friends, DMing, texting.\" He later produced the title track of her album. Older story, kept for the creator-to-music route.","y":"2022"},{"r":"r5a","s":"Online friendship","o":"good","oc":"got out","p":"Articles and essays","g":"","a":"","x":"(podcast host, solo episode description). Grew up socially disconnected, found out in their 30s they are autistic with ADHD. Message boards, MySpace and Tumblr music fandoms turned into lifelong friends, relationships and a marriage, describing \"how music became my bridge to other people\". Route: online forum and fan communities.","y":"2026"},{"r":"r5a","s":"Story replies only","o":"good","oc":"got out","p":"YouTube","g":"","a":"","x":"Women who used to always watch his stories stopped once he never messaged them. He reads their viewing as fishing for a reaction. No wait time stated. How it ended: he never texted and they faded. \"I won't be one of ya inbox screenshots\"","y":"2024"},{"r":"r5a","s":"Story replies only","o":"good","oc":"got out","p":"YouTube","g":"","a":"","x":"Several women who turned him down when he asked them out still watch everything he posts, often among the first 20 viewers, but barely answer when he says hello in DMs. How it ended: the asks got a no, he stopped messaging. \"I stopped hitting them up by the way.\"","y":"2024"},{"r":"r5a","s":"Story replies only","o":"good","oc":"got out","p":"YouTube","g":"Man","a":"","x":"His child's mother and a coworker he dated briefly both watch all his stories. The coworker \"pulled all the way back after a month messing around\". He has stopped trying to work out why they keep watching. How it ended: faded.","y":"2024"},{"r":"r5a","s":"Story replies only","o":"good","oc":"got out","p":"YouTube","g":"","a":"","x":"A girl watched his stories constantly for a while. He finally messaged her with small talk and asked her to hang out. How it ended: an ask got a no, her answer was \"leave me alone\".","y":"2024"},{"r":"r5a","s":"Low-effort replies","o":"good","oc":"got out","p":"YouTube","g":"","a":"","x":"Got her number, called 3 days later to set a date, she said maybe and never confirmed, then texted the day after the suggested date that her week was hectic. He answered \"Ok. Sort yourself out.\" After that she started viewing all his WhatsApp status posts. How it ended: he stopped texting, deleted her number and she never came back.","y":"2024"},{"r":"r5a","s":"Story replies only","o":"bad","oc":"still stuck","p":"YouTube","g":"","a":"","x":"A girl told him she liked his energy and wanted to chill, then left him on read. Waited weeks so far. She \"still watches my stories but won't text\". How it ended: still going, nothing from her.","y":"2024"},{"r":"r5a","s":"Story replies only","o":"bad","oc":"still stuck","p":"YouTube","g":"","a":"","x":"Ghosted by a girl he had been seeing for 2 months. She constantly watches his stories but never reaches out. He is leaving it to her. \"Balls in her court\". How it ended: still going, no contact.","y":"2024"},{"r":"r5a","s":"Story replies only","o":"advice","oc":"advice only","p":"YouTube","g":"","a":"","x":"Says some girls watched his stories every day and \"took 2 years or even 3 years to message me\". His rule is that if no message comes, it is over. Wait time stated: 2 to 3 years before the girl wrote.","y":"2023"},{"r":"r5a","s":"Story replies only","o":"good","oc":"got out","p":"YouTube","g":"","a":"","x":"Women followed him and watched, he gave them no attention, and \"they eventually get frustrated and one day all of sudden they unfollow\". How it ended: faded, she left on her own.","y":"2023"},{"r":"r5a","s":"Low-effort replies","o":"good","oc":"got out","p":"YouTube","g":"","a":"","x":"Girls used to watch all his stories. When he messaged, they left him on read or played games. When he stopped watching their stories, they stopped watching his or checked one and skipped the rest. How it ended: faded. \"I'd hit them up then they leave me on read or play games\"","y":"2023"},{"r":"r5a","s":"Story replies only","o":"mid","oc":"improving","p":"YouTube","g":"","a":"","x":"He has been ignoring a girl who checks his stories within 5 minutes of posting. Her friend DMed him to ask if things were okay between them. He decided \"if she doesn't cantact me l won't do that either\" and is focusing on himself. How it ended: still going, neither side writes.","y":"2023"},{"r":"r5a","s":"Shot taken","o":"mid","oc":"improving","p":"Articles and essays","g":"Man","a":25,"x":"Her effort before: unclear. Best friend of 14 years who confided in him and came to his place after her breakup, but laughed off his hints (reels about falling for a best friend). He waited about 7 years, then confessed by text in late 2024. \"I texted her because I was too nervous to say it in person.\" She asked for time, then said she never saw him that way. Outcome: no. She started dating someone else and hid her stories from him, the friendship mostly ended. He moved cities and now calls it attachment more than love.","y":"2025"},{"r":"r5a","s":"Shot taken","o":"good","oc":"got out","p":"Articles and essays","g":"Man","a":"","x":"Her effort before: high. They met on a TV set, then chatted on Instagram while living in different cities. After his breakup he told her he was single, \"part of me knew that if I didn't say it, we'd never find out\". She danced and called a friend, long night calls followed. He proposed spending a week together, then asked her to be his girlfriend a few weeks later (April 2023). Outcome: yes, now married and running a production company together.","y":"2026"},{"r":"r5a","s":"Shot taken","o":"good","oc":"got out","p":"Articles and essays","g":"","a":26,"x":"Her effort before: high. Became best friends fast, she drove them home and they talked in her car for three hours. \"After five months of friendship, I confessed my feelings for her\" and it was not returned. Outcome: no, then yes two years later. They stayed best friends, seeing each other at least twice a week, until she said out of the blue that she had feelings. Now secretly engaged. Says without her they would probably still be depressed in their parents' basement.","y":"2026"},{"r":"r5a","s":"Shot taken","o":"good","oc":"got out","p":"YouTube","g":"","a":29,"x":"Her effort before: unclear. At 29 he asked out a workplace crush and she laughed, not realising he was serious. Outcome: no. \"Her laugh played on a loop in my head for a YEAR.\" He still does not regret asking, because the women he never asked leave a lasting what-if.","y":"2023"},{"r":"r5a","s":"Online to in-person","o":"good","oc":"got out","p":"Articles and essays","g":"Man","a":"","x":"A content creator. A mutual friend sent him a woman's Instagram page, \"Then I went straight into her DMs, introduced myself\". She had watched his content for years. They chatted 30 minutes, swapped numbers and talked for hours that night. Both in Lagos, he asked to meet on day 3 and picked her up for the first date. Girlfriend two weeks after the first date, married April 2026. Time from first message to meeting: about a week.","y":"2026"},{"r":"r5a","s":"Online to in-person","o":"good","oc":"got out","p":"Articles and essays","g":"Man","a":"","x":"Met in a large WhatsApp group for university students, she DMed him first in 2021. A failed favour and a debt made it tense, then long calls during his mother's illness made them close. She travelled to his mother's funeral in May 2022, \"that was the first time we met\", about a year after the first message. She made more trips to Lagos and later moved there. Together almost four years and planning marriage.","y":"2026"},{"r":"r5a","s":"Online to in-person","o":"good","oc":"got out","p":"Articles and essays","g":"Man","a":34,"x":"Instagram showed him a photo from a hashtag he followed, a woman in Mass Effect cosplay. He commented a compliment, they moved to DMs, and they have been married six months. Advises singles to \"start following the hashtags of the things they are interested in\". Who travelled and time to meeting not stated.","y":"2024"},{"r":"r5a","s":"Online to in-person","o":"good","oc":"got out","p":"Articles and essays","g":"Man","a":35,"x":"He and his now girlfriend followed each other on Instagram with no mutual friends, in two different states, and only liked posts now and then. When he posted a haircut video she commented a heart-eye emoji and DMed him the next day. They talked every day. \"Three years later, she moved to Texas with me.\" She travelled and moved to him.","y":"2024"},{"r":"r5a","s":"Online to in-person","o":"good","oc":"got out","p":"Articles and essays","g":"Man","a":35,"x":"A musician in the Irish Midlands DMed a comedian with 300k followers after laughing at one of her videos, \"I was just sending it into the ether\". She replied, weeks of Instagram banter turned into texting and daily FaceTime calls of 4 hours or more. He invited her and she flew from Dallas to Ireland in July, about 4 months after his first message in March. She came back a month later and he visited her for Thanksgiving. Long distance across countries.","y":"2025"},{"r":"r5a","s":"Online to in-person","o":"good","oc":"got out","p":"Articles and essays","g":"Man","a":25,"x":"Met on the free Tandem language exchange app, she messaged him first. \"We both really didn't intend to use the app to find a partner\". After about six months of talking he travelled to her country to meet her. Two years together now and she pays visa costs. He travelled, about 6 months from first message to meeting.","y":"2026"},{"r":"r5a","s":"No dating experience","o":"mid","oc":"improving","p":"YouTube","g":"Man","a":29,"x":"Made a widely viewed video at 27 about never having a girlfriend. At 29 still single but says daily meditation from January 2023 helped his mental health more than antidepressants, and he dropped a clingy mindset of getting his emotional needs met by girls he liked. Put his energy into his YouTube channel and live streams, about 9,000 subscribers. \"you can't crave it you can't need it\". Route: other (meditation, own creator channel). Kept though just before Nov 2023 because it is a dated follow-up from a creator in the same spot.","y":"2023"},{"r":"r5a","s":"No dating experience","o":"good","oc":"got out","p":"YouTube","g":"Man","a":22,"x":"Songwriter and podcaster who made many videos about never having romance. First relationship at 22, dating a month after talking for a few months. \"It's been a long 22 years\". Says he used to think he was in love with anyone who showed him kindness, and only now can write real love songs. Route: other, how they met not stated.","y":"2025"},{"r":"r5a","s":"No dating experience","o":"good","oc":"got out","p":"Articles and essays","g":"Man","a":"","x":"A reserved man who had never been in a relationship was moving from modelling and photography into content creation. He answered a woman's online post asking for a partner to shoot relationship content and they shot together days later. After a month of planning shoots and long calls he asked nervously \"Is this still content?\" and asked her out properly two weeks later. She said yes in February 2024. Route: creator circle (content collab from an online post).","y":"2026"},{"r":"r5a","s":"No dating experience","o":"good","oc":"got out","p":"X","g":"","a":"","x":"Got a first girlfriend at 24 and within half a year at least 6 girls told them they liked them or their mothers tried to set them up. \"I got my first girlfriend at 24\". Route not stated.","y":"2024"},{"r":"r5a","s":"No dating experience","o":"good","oc":"got out","p":"X","g":"","a":"","x":"Answering someone aged 25 who said never having dated makes them feel too far behind to try, they point out they got a first girlfriend at 26. \"They don't know I got my first girlfriend at 26\". Route not stated.","y":"2026"},{"r":"r5a","s":"No friends","o":"bad","oc":"still stuck","p":"Reddit","g":"","a":"","x":"Reported zero close friends and mentioned being autistic.","y":"2026"},{"r":"r5a","s":"No friends","o":"bad","oc":"still stuck","p":"Reddit","g":"","a":"","x":"Shared the preceding commenter's experience of having no close friends.","y":"2026"},{"r":"r5a","s":"Lonely","o":"bad","oc":"still stuck","p":"Reddit","g":"","a":"","x":"Has friends but is very shy and unsure most of them care.","y":"2026"},{"r":"r5a","s":"Advice","o":"advice","oc":"advice only","p":"Reddit","g":"","a":"","x":"Asked what counts as a close friend before answering.","y":"2026"},{"r":"r5a","s":"Advice","o":"advice","oc":"advice only","p":"Reddit","g":"","a":"","x":"Defined close friends as people who show up for you beyond acquaintance or coworker contact.","y":"2026"},{"r":"r5a","s":"Advice","o":"advice","oc":"advice only","p":"Reddit","g":"","a":"","x":"Reported one close friend.","y":"2026"},{"r":"r5a","s":"No friends","o":"bad","oc":"still stuck","p":"Reddit","g":"","a":"","x":"Reported zero friends aside from their partner and identified as older than Gen Z.","y":"2026"},{"r":"r5a","s":"Advice","o":"advice","oc":"advice only","p":"Reddit","g":"","a":26,"x":"At 26, still knows about ten school friends and sees about 30 people semi-regularly. Closeness was unclear.","y":"2026"},{"r":"r5a","s":"Online friendship","o":"advice","oc":"advice only","p":"Reddit","g":"","a":"","x":"Reported no in-person friends and about four online friends, with closeness unspecified.","y":"2026"},{"r":"r5a","s":"Advice","o":"advice","oc":"advice only","p":"Reddit","g":"","a":"","x":"Described around seven or eight close friends excluding spouse and family, with a smaller core group.","y":"2026"},{"r":"r5a","s":"Advice","o":"advice","oc":"advice only","p":"Reddit","g":"","a":"","x":"Counted six to eight people they see weekly and can talk with in depth.","y":"2026"},{"r":"r5a","s":"Advice","o":"advice","oc":"advice only","p":"Reddit","g":"","a":"","x":"Named two best friends and several additional close friends.","y":"2026"},{"r":"r5a","s":"Advice","o":"advice","oc":"advice only","p":"Reddit","g":"","a":"","x":"Said three close friends support them, two from outside school.","y":"2026"},{"r":"r5a","s":"Lonely","o":"bad","oc":"still stuck","p":"Reddit","g":"","a":"","x":"Has one close friend and moved away a month ago.","y":"2026"},{"r":"r5a","s":"No friends","o":"bad","oc":"still stuck","p":"Reddit","g":"","a":"","x":"Has friends but nobody close enough to confide in.","y":"2026"},{"r":"r5a","s":"Advice","o":"advice","oc":"advice only","p":"Reddit","g":"","a":"","x":"Counts a sister as a close friend and wondered whether family was included.","y":"2026"},{"r":"r5a","s":"Advice","o":"advice","oc":"advice only","p":"Reddit","g":"","a":"","x":"Has a couple of close friends and feels they should talk more often.","y":"2026"},{"r":"r5a","s":"Lonely","o":"bad","oc":"still stuck","p":"Reddit","g":"","a":"","x":"Said their wife is about the only person in their life at the moment.","y":"2026"},{"r":"r5a","s":"Lonely","o":"bad","oc":"still stuck","p":"Reddit","g":"","a":"","x":"Has one close friend and worries about burdening her when discussing feelings.","y":"2026"},{"r":"r5a","s":"Online friendship","o":"advice","oc":"advice only","p":"Reddit","g":"","a":"","x":"Kept four friends for 15 years through messages and games, and later added one more.","y":"2026"},{"r":"r5a","s":"Limerence","o d redirecting thoughts instead of feeding daydreams helped him feel better the next day. still found detachment difficult.","y":"2025"},{"r":"r5a","s":"Trust damage","o":"mid","oc":"improving","p":"Reddit","g":"","a":"","x":"The person said they cared, yet never initiated. Two months after the commenter stopped carrying the calls, they had heard nothing and were beginning to move on.","y":"2025"},{"r":"r5a","s":"Trust damage","o":"bad","oc":"still stuck","p":"Reddit","g":"","a":"","x":"Moved away without a final conversation, felt mistreated, and still read meaning into the person's public posts and silence.","y":"2025"},{"r":"r5a","s":"Limerence","o":"mid","oc":"improving","p":"Reddit","g":"","a":"","x":"Got no answers from the other person and began working out what closure meant without them.","y":"2025"},{"r":"r5a","s":"Advice","o":"advice","oc":"advice only","p":"Reddit","g":"","a":"","x":"Suggested letting unanswered questions stay unanswered and respecting the other person's distance.","y":"2025"},{"r":"r5a","s":"Limerence","o":"mid","oc":"improving","p":"Reddit","g":"","a":"","x":"Realized the rejection already answered the question, but initially resisted accepting it.","y":"2025"},{"r":"r5a","s":"Trust damage","o":"mid","oc":"improving","p":"Reddit","g":"","a":"","x":"After a prior three-year fixation, had another online push-pull connection for over three months. Shared a concerning message with trusted people before ending contact. Still questioned the boundary.","y":"2025"},{"r":"r5a","s":"Advice","o":"advice","oc":"advice only","p":"Reddit","g":"","a":"","x":"Encouraged trusting a boundary and noticing whether the other person puts in initiative.","y":"2025"},{"r":"r5a","s":"Trust damage","o":"good","oc":"got out","p":"Reddit","g":"","a":"","x":"Described about eight months of residual pain after ending pursuit. Later developed steadier feelings for an existing friend and could see the earlier crush without the fixation returning.","y":"2025"},{"r":"r5 s with the former crush and once redirected the fixation onto someone new.","y":"2026"},{"r":"r5a","s":"Trust damage","o":"mid","oc":"improving","p":"Reddit","g":"","a":"","x":"Noticed that idealizing someone had made other people look uninteresting at the time.","y":"2026"},{"r":"r5a","s":"No dating experience","o":"bad","oc":"still stuck","p":"Reddit","g":"Man","a":20,"x":"At 20, had never had a girlfriend and felt discouraged by comparisons, while saying he had had happy times despite loneliness.","y":"2026"},{"r":"r5a","s":"No dating experience","o":"good","oc":"got out","p":"Reddit","g":"Man","a":45,"x":"Now 45. Had short relationships in his twenties and early thirties, met his wife at 37 and married at 40.","y":"2026"},{"r":"r5a","s":"Lonely","o":"bad","oc":"still stuck","p":"Reddit","g":"","a":27,"x":"At 27 had two long relationships and found it hard to date after the longer one ended.","y":"2026"},{"r":"r5a","s":"Advice","o":"advice","oc":"advice only","p":"Reddit","g":"","a":"","x":"Said building a satisfying life has value and still does not guarantee meeting a partner. Romantic connection can matter separately.","y":"2026"},{"r":"r5a","s":"Advice","o":"advice","oc":"advice only","p":"Reddit","g":"","a":"","x":"Said developing his own interests made it easier to meet someone and advised reducing pressure on each date.","y":"2026"},{"r":"r5a","s":"Lonely","o":"bad","oc":"still stuck","p":"Reddit","g":"","a":"","x":"Felt dismissed when partnered people described a partner as central to their own lives and then downplayed the pain of prolonged singleness.","y":"2026"},{"r":"r5a","s":"No dating experience","o":"good","oc":"got out","p":"Reddit","g":"Man","a":24,"x":"First had a girlfriend at 24. Later felt hurt when a partner relied on the relationship to get away from problems at home.","y":"2026"},{"r":"r5a","s":"Lonely","o":"bad","oc":"still stuck","p":"Reddit","g":"","a":"","x":"Wanted love and feared time was running out despite years spent working on h
