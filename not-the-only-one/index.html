Forums","g":"","a":"","x":"Five years long distance with an American partner. The plan was that the poster would move, he kept delaying, then backed out of a promise to move to the poster instead. The stalled plan is what is hurting it.","y":"2025"},{"r":"r3","s":"Gaming","o":"good","oc":"long distance relationship","p":"Forums","g":"Woman","a":"","x":"Met a friend online, asked her to show how the coffee machines work in a VRChat cafe world, talked on Discord, and realized mid-hangout it was a date. Now calls her an online girlfriend.","y":"2026"},{"r":"r3","s":"Other online routes","o":"good","oc":"long distance relationship","p":"Forums","g":"","a":"","x":"In a long distance relationship, they read books aloud to each other over the phone. It became a bedtime ritual, also while she cooks.","y":"2023"},{"r":"r3","s":"Other online routes","o":"good","oc":"met in person","p":"Forums","g":"Man","a":"","x":"Met both girlfriends at real meetups of an online community without looking for it. Advice: go where interests are shared and try to make friends, not find a partner.","y":"2025"},{"r":"r3","s":"Discord","o":"good","oc":"met in person","p":"Articles and essays","g":"Woman","a":"","x":"Joined a One Piece fan Discord from a Tumblr invite. A lawyer from Louisiana DMed her writing prompts, they bonded in group voice chats, met in person within 7 months on a group trip. Then saved for flights, got a long stay visa and moved.","y":"2024"},{"r":"r3","s":"Instagram","o":"bad","oc":"nothing","p":"Articles and essays","g":"Woman","a":30,"x":"Posted a personal ad through an Instagram personals account. A woman from another city DMed, weeks of texts and FaceTime felt like fate, but the visit in person was awkward and it fell apart. Now uses online only to get to a real date. \"Our connection was in the cloud\"","y":"2024"},{"r":"r3","s":"Discord","o":"good","oc":"long distance relationship","p":"Other","g":"Woman","a":"","x":"Met online and became friends in Discord voice channels, listening to music and talking till 3 am. Feelings came months later. Two years in they have met in person only nine times.","y":"2025"},{"r":"r3","s":"Gaming","o":"good","oc":"met in person","p":"Articles and essays","g":"Man","a":22,"x":"OLDER ROW, kept for value: after a Friday the 13th match on Xbox he sent her a private party link and said hello. They gamed daily, did a video call to rule out catfishing before he asked her out. She flew to Wales, 5 years LDR, married over video call, she moved in 2023.","y":"2023"},{"r":"r3","s":"Gaming","o":"good","oc":"met in person","p":"Other","g":"Woman","a":"","x":"OLDER ROW, kept for value: met her partner in Final Fantasy XIV. The game gave their long distance relationship a place to exist with dates and an in-game wedding, then he proposed in person at the game's fan festival.","y":"2023"},{"r":"r3","s":"Instagram","o":"good","oc":"met in person","p":"Articles and essays","g":"Woman","a":"","x":"Dating newsletter writer. Ignores most DMs because many are crude. A confident footballer's DM banter lasted three days and went nowhere. A man whose videos she already watched DMed her and their coffee date ran 10 hours. \"Confidence online, inertia offline, an overall waste of time.\"","y":"2026"},{"r":"r3","s":"Instagram","o":"advice","oc":"advice only","p":"Other","g":"Woman","a":"","x":"Writer's own guide, prefers DMs to swiping. Warm up first with likes, comments or story reactions so you are a familiar face, open friendly about something you share, and if seen with no reply, move on, no double texting.","y":"2026"},{"r":"r3","s":"Other apps","o":"bad","oc":"nothing","p":"Articles and essays","g":"Man","a":"","x":"SCAM FLAG: reporter's own near miss. A woman messaged him on a meditation app, moved him to WhatsApp, texted daily with photos of a rich LA life, then showed crypto trading dashboards. Classic pig butchering setup.","y":"2026"},{"r":"r3","s":"Content","o":"good","oc":"met in person","p":"Articles and essays","g":"Man","a":"","x":"Public creator, singer Jordy. A man who saw his TikToks DMed him on Instagram and gave his number. Daily FaceTime, 2400 miles apart, then a weekend together. He wrote a song about it. \"a random guy who saw one of my TikToks\"","y":"2023"},{"r":"r3","s":"Gaming","o":"good","oc":"met in person","p":"Other","g":"Man","a":"","x":"Says all of their ex-boyfriends were met online through gaming, and they were the one who asked to hang out. \"I met all my ex boyfriends online through gaming.\"","y":"2024"},{"r":"r3","s":"Gaming","o":"good","oc":"long distance relationship","p":"Other","g":"Man","a":"","x":"OLDER ROW, kept for value: met their boyfriend on Steam and have been together a long time. Calls Steam the best way to meet good people abroad without the desperation of dating sites.","y":"2020"},{"r":"r3","s":"Instagram","o":"mid","oc":"daily talking","p":"Other","g":"Woman","a":"","x":"OLDER ROW, kept for value: photojournalist complimented a foreign photographer's work by Instagram DM. Months of daily messages and video calls, then his country's unrest and Covid stopped any visit and it faded. Never met.","y":"2020"},{"r":"r3","s":"Language apps","o":"good","oc":"long distance relationship","p":"App communities","g":"","a":"","x":"A girl messaged him on HelloTalk, they talked all day every day, and four months later she is his girlfriend. He plans to fly from Australia to Ecuador. Posted on the app's own public feed, date not shown.","y":""},{"r":"r3","s":"Language apps","o":"good","oc":"met in person","p":"Articles and essays","g":"Woman","a":"","x":"Met a Korean man on an unnamed language exchange app and first met in person in Aug 2017. \"We broke up a few months after we began seeing each other\" over distance, got back together, Covid kept them apart Feb 2020 to Nov 2021, married in 2023 and he moved to Singapore.","y":"2024"},{"r":"r3","s":"Instagram","o":"good","oc":"long distance relationship","p":"Articles and essays","g":"Woman","a":33,"x":"Public comedian Theresa Rowley (about 307k Instagram followers) answered a cold DM from an Irish musician. Weeks of flirty DMs, then texts and daily FaceTime of 4 hours or more, she flew to Ireland after about 4 months and they became a couple on that visit. \"I felt more understood by him than I ever had before.\"","y":"2025"},{"r":"r3","s":"Instagram","o":"good","oc":"long distance relationship","p":"Articles and essays","g":"Man","a":35,"x":"Musician who cold-DMed a US comedian after watching one of her videos because he found her funny and attractive, and did not expect a reply. \"I was just sending it into the ether.\" They now fly to see each other.","y":"2025"},{"r":"r3","s":"Other apps","o":"bad","oc":"nothing","p":"Articles and essays","g":"Man","a":"","x":"SCAM FLAG: sextortion. Matched a woman on Hinge, she quickly asked to move to Instagram, talk turned sexual, he sent one nude and about 10 minutes later got a threat with a screenshot of a group chat of his Instagram contacts. Images were not released. \"The person who has all the shame is the scammer, not you.\"","y":"2026"},{"r":"r3","s":"Other apps","o":"bad","oc":"nothing","p":"Articles and essays","g":"Man","a":"","x":"SCAM FLAG: pig-butchering. Adult man (a work colleague of the guest) met a woman posing as French on a dating platform. After a close text relationship she pitched crypto with about 20% a day returns, then demanded $40,000 within 96 hours to unlock his account. Lost about $90,000 and clawed back about $10,000.","y":"2024"},{"r":"r3","s":"Content","o":"good","oc":"met in person","p":"Articles and essays","g":"Man","a":"","x":"A VTuber started as a fan clipping another VTuber's streams in 2021, she noticed the clips, collabs turned into friendship then romance. About 2 years long distance before meeting at TwitchCon 2023, moved in together, proposed at TwitchCon 2025. \"I liked her personality, content, and model,\"","y":"2025"},{"r":"r3","s":"Content","o":"good","oc":"met in person","p":"Articles and essays","g":"Woman","a":"","x":"A VTuber. Lived across the country from the other VTuber, they visited each other about every other month, then she moved cross-country in a U-Haul to live with him. \"Nothing bad happened, though,\"","y":"2025"},{"r":"r3","s":"TikTok","o":"good","oc":"met in person","p":"Articles and essays","g":"Man","a":26,"x":"Public TikTok creator Angel (about 400k followers then). TikTok mutuals with light comments under videos for years, his Tinder message went unanswered, both landed in a shared group TikTok account, then his Instagram DM got a reply. Together nearly 4 years. \"I just love showing my man love.\"","y":"2025"},{"r":"r3","s":"TikTok","o":"good","oc":"met in person","p":"Articles and essays","g":"Man","a":23,"x":"Public TikTok creator Armani (about 30k followers then). Replied to the Instagram DM after years of being TikTok mutuals, they swapped zodiac signs and then numbers. \"We are always just together, hooked to each other and attached by the hip.\"","y":"2025"},{"r":"r3","s":"Instagram","o":"good","oc":"met in person","p":"Articles and essays","g":"Woman","a":"","x":"Knew him only in passing from a Facebook meme group, replied to his Instagram post in 2019, he answered \"Marry me\" and they talked constantly across the border. Now married with a 2-year-old. \"Do I acknowledge that this feels like something, or will that ruin it?\"","y":"2025"},{"r":"r3","s":"Other online routes","o":"good","oc":"met in person","p":"Articles and essays","g":"","a":"","x":"Writer who followed their partner on Twitter over niche rock bands, then they matched on Tinder already knowing each other. Shared music taste worked as a filter, \"which underground indie band do you like?\"","y":"2025"},{"r":"r3","s":"Other online routes","o":"good","oc":"met in person","p":"Articles and essays","g":"","a":"","x":"Partner of the writer above. Bonded on Twitter over an obscure band. \"I don't know anyone that listens to Cheem\"","y":"2025"},{"r":"r3","s":"Instagram","o":"good","oc":"met in person","p":"Articles and essays","g":"Woman","a":"","x":"OLDER ROW, kept for Q2. Joy Ofodu, public host of the podcast Dating Unsettled, met her boyfriend through Instagram DMs. Says comments and story replies show how someone treats friends. \"It breathes off the page a little bit more.\"","y":"2023"},{"r":"r3","s":"Instagram","o":"advice","oc":"advice only","p":"Articles and essays","g":"Woman","a":23,"x":"OLDER ROW. Woman now in a relationship who used Instagram while dating to check that a person was real and single. \"you can get so much more information from Instagram.\"","y":"2023"},{"r":"r3","s":"Instagram","o":"advice","oc":"advice only","p":"Articles and essays","g":"","a":20,"x":"OLDER ROW. Says a strong come-on in DMs puts most people off, better to open casually off a post, story or Reel meme. \"It can just be casual and friendly or we can take it slow.\"","y":"2023"},{"r":"r3","s":"Instagram","o":"advice","oc":"advice only","p":"Articles and essays","g":"","a":26,"x":"OLDER ROW. People move from a dating app to Instagram before giving a phone number, a lower pressure step. \"We can be friends and grow from there.\"","y":"2023"},{"r":"r3","s":"Discord","o":"mid","oc":"daily talking","p":"Articles and essays","g":"Man","a":23,"x":"OLDER ROW. Invited to a Valorant Discord server by a friend and met his now-girlfriend through rounds of the game. Article does not say how or when they first met offline. \"It's not the way you meet, but the person you meet.\"","y":"2023"},{"r":"r3","s":"Discord","o":"good","oc":"long distance relationship","p":"Articles and essays","g":"Woman","a":25,"x":"OLDER ROW. Met her boyfriend, who is from another country, in a Valorant match, then invited him into her friends' Discord for games and movie nights, feelings grew there. \"He's funny and always interested in things.\"","y":"2023"},{"r":"r3","s":"Discord","o":"good","oc":"met in person","p":"Articles and essays","g":"Man","a":27,"x":"OLDER ROW. First relationship started in a personal finance Discord channel through late-night voice calls and later ended. Current girlfriend came from a local-area Discord channel, first met in person at a rally. \"Discord gives you a sense of belonging.\"","y":"2023"},{"r":"r3","s":"Other online routes","o":"good","oc":"met in person","p":"Articles and essays","g":"Woman","a":29,"x":"OLDER ROW, kept for Q5 and Q6. Met him in a Facebook fan group for a fantasy book series, then Messenger and Skype. About 4 years of online friendship before he visited, 2 years long distance, married in 2017 and he moved to South Africa. \"Mine was 13,000km away.\"","y":"2022"},{"r":"r3","s":"Instagram","o":"good","oc":"met in person","p":"Articles and essays","g":"Woman","a":26,"x":"OLDER ROW. He followed her from the Explore page and they liked each other's posts for months before she messaged first. Moved in together after 3 months, together 4 years. \"We talked like we had known each other for years\"","y":"2021"},{"r":"r3","s":"Other online routes","o":"good","oc":"long distance relationship","p":"Articles and essays","g":"Woman","a":24,"x":"OLDER ROW. Bonded with him on Tumblr over film and music around age 18, stayed friends for years via Snapchat and Instagram, then she flew out to meet him and they began long distance. \"It was honestly a leap of faith, and we've been happily together.\"","y":"2021"},{"r":"r3","s":"Other online routes","o":"good","oc":"met in person","p":"Russian sites","g":"Man","a":31,"x":"Russian-speaking. An old online pen friend from the ICQ era wrote him a birthday greeting after years of silence. They texted as friends, then grew closer over six months while he worked in another country. On his first vacation home he went straight to her and they became a couple from day one, he quit the job abroad and moved back. About a year later she said something was missing, \"afraid of wasting your time\", and is pulling away.","y":"2026"},{"r":"r3","s":"Other online routes","o":"good","oc":"met in person","p":"Russian sites","g":"Woman","a":"","x":"Russian-speaking. Texted a man for more than six months and met him a couple of times in Siberian cities. Left her job, flat and car and flew across the country with three bags to live with him. Within a day of landing he changed completely, with reproaches, silence and avoidance. She moved into a rented flat after a few days and stayed alone in a city where she knew nobody.","y":"2026"},{"r":"r3","s":"Gaming","o":"good","oc":"long distance relationship","p":"Russian sites","g":"Man","a":25,"x":"Russian-speaking. Left dating sites as \"too much fakeness\" and went back to Warface, where a girl (20) he had played with before wrote to him. They played, watched films online and confessed feelings within weeks. Over 8 months they never met and never had one video call, he offered to fly her or fly himself many times and there was always a reason. Her name turned out to be different, then came requests for money for loans and depression, he covered about 150,000 rubles. Lesson he states: distance works only if both actually move toward meeting. SCAM FLAG: fake name, no video ever, repeated money requests.","y":"2026"},{"r":"r3","s":"Discord","o":"mid","oc":"daily talking","p":"Russian sites","g":"Woman","a":25,"x":"Russian-speaking. Met a man her own age in a Discord voice chat, they flirted and talked about everything, then moved to Telegram. She helped with homework for his sister and they talked daily. Later he told her he had a girlfriend after all and then stopped talking to her, which left her unable to enjoy anything. A good example of voice-chat chemistry that never got a clear statement of intent.","y":"2025"},{"r":"r3","s":"Other apps","o":"bad","oc":"nothing","p":"Russian sites","g":"Man","a":"","x":"Russian-speaking. A pretty woman on a dating site wrote first and moved the chat to WhatsApp fast. She built rapport with questions about kids and school, swapped photos that matched her profile, praised his smile and voice. Then came a story of making \"1700 dollars in one morning\" and an offer to connect him with her stock market analyst. He saw it coming and played along. SCAM FLAG: pig-butchering pattern, WhatsApp move plus investment mentor.","y":"2025"},{"r":"r3","s":"Other apps","o":"advice","oc":"advice only","p":"Russian sites","g":"Man","a":"","x":"Russian-speaking. Guide writer, counts as one voice. Describes sextortion on dating sites: mutual likes, warm chat, a young fun girl steers talk to intimacy and swaps explicit photos, then the man's real identity is looked up through his phone number and the threats start. He warns a blackmailer never stops at one payment. Also covers fake theater tickets, fake crypto trading and anti-cafe scams. SCAM FLAG: sextortion.","y":"2025"},{"r":"r3","s":"Other online routes","o":"advice","oc":"advice only","p":"Russian sites","g":"","a":"","x":"Russian-speaking. Adds a newer trick: the girl sends a link to \"my blog where I stream\", which needs a Telegram login. Logging in hands over the account, so they pull the contact list and can take over the session for blackmail. SCAM FLAG: phishing via fake stream link.","y":"2025"},{"r":"r3","s":"Gaming","o":"mid","oc":"daily talking","p":"Russian sites","g":"Woman","a":"","x":"Russian-speaking. Has a long history of virtual relationships because her sex drive is high. Met a man in a game and has had an online romance with him for about a year, in contact almost constantly, with virtual sex and a lot of care and attention. He lives and runs a business in Western Europe. Both want to meet but distance, her child, her ill mother and her own fear keep it online.","y":"2024"},{"r":"r3","s":"Other online routes","o":"advice","oc":"advice only","p":"Russian sites","g":"Woman","a":"","x":"Russian-speaking. Argues a woman will not go on a date with a stranger from the internet without a plan B. Advice to men: invite her somewhere near a place she already likes, show a photo of the food at the place, offer something small regardless of how the date goes. The question \"why should I go out with you\" is not answered by praising yourself.","y":"2026"},{"r":"r3","s":"Other online routes","o":"advice","oc":"advice only","p":"Russian sites","g":"Man","a":"","x":"Russian-speaking. Cynical take on long distance: nobody deserves that you uproot your life for them, and you have to be really special for someone to travel to you. Says most people are not worth the trip. A blunt voice of the men who give up on long distance before trying.","y":"2026"},{"r":"r3","s":"Other online routes","o":"good","oc":"long distance relationship","p":"YouTube","g":"Woman","a":"","x":"Russian-speaking. Married to her husband but still living apart. Recorded the video after their meeting was cancelled \"once again\". Says the hardest part is the lack of support, since friends without this experience do not know what to say. Top comment from another viewer: almost two years long distance, now four months living together.","y":"2023"},{"r":"r3","s":"Other apps","o":"advice","oc":"advice only","p":"YouTube","g":"Man","a":"","x":"Russian-speaking creator, one voice. Spent time on Davinchik, VK Dating, Twinby and Pure and catalogued the scams he met. The main one is the theater scheme: a sweet match suggests a show, sends a ticket site, the money is gone. Also casino, drug and escort fronts using stolen photos of real women. SCAM FLAG.","y":"2025"},{"r":"r3","s":"Other apps","o":"bad","oc":"nothing","p":"YouTube","g":"Man","a":"","x":"Russian-speaking. Nearly fell for it the day before writing: matched on a site, she asked to move to Telegram and on the same day sent a theater poster asking which seats he had picked. Same-day event invite plus a move to Telegram tipped him off. SCAM FLAG: fake ticket site.","y":"2025"},{"r":"r3","s":"Other apps","o":"bad","oc":"nothing","p":"YouTube","g":"Man","a":"","x":"Russian-speaking. Met an upgraded theater scheme: after he paid for the ticket she wrote that a friend was in trouble and she could not go, and said the ticket could be refunded on the same site, which asks for card details again. SCAM FLAG: refund step is a second theft.","y":"2025"},{"r":"r3","s":"Other apps","o":"bad","oc":"nothing","p":"YouTube","g":"Man","a":"","x":"Russian-speaking. Met a girl on Davinchik whose profile said she had just flown in to his city looking for company. That detail made him ask questions, and it turned into an NFT investment pitch. SCAM FLAG: \"just arrived in your city\" profiles.","y":"2025"},{"r":"r3","s":"Other apps","o":"advice","oc":"advice only","p":"YouTube","g":"Man","a":"","x":"Russian-speaking creator, one voice. Shows real scam chats. Shared signs: she is very attractive, \"unnaturally interested\", and proposes plans herself. Ticket scams for theater, stand-up or concerts are the oldest, the payment site can drain the card. SCAM FLAG.","y":"2026"},{"r":"r3","s":"Other apps","o":"advice","oc":"advice only","p":"YouTube","g":"","a":"","x":"Russian-speaking. Top comment (64 likes): most of the time it is not women on the other side but men scamming men, using prepared video circles and voice notes. SCAM FLAG: voice notes and circles do not prove a real woman.","y":"2026"},{"r":"r3","s":"Other apps","o":"bad","oc":"nothing","p":"YouTube","g":"Man","a":"","x":"Russian-speaking man living on Phuket. Random match on a dating app, long chat with shared music, films and video circles. She said she lived in Belgium, traded crypto and worked in modelling, and hinted he could visit. She shamed him for not cheering her wins, linked him to her trader, and he lost about 10,000 dollars plus a 300,000 ruble loan when a fake insurance fee froze the account. SCAM FLAG: pig-butchering.","y":"2024"},{"r":"r3","s":"Other online routes","o":"bad","oc":"nothing","p":"YouTube","g":"Man","a":"","x":"Russian-speaking. Older (2019) but a clear sextortion case of a young man. A pretty girl on VK chatted, the talk turned intimate, then a message said he had been caught by a fake \"morality fighters\" project and must pay 3,000 rubles or the chat goes to his friends and family. He did not pay. Tips: fake pages have all photos uploaded on one day. SCAM FLAG: sextortion.","y":"2019"},{"r":"r3","s":"Other online routes","o":"bad","oc":"nothing","p":"YouTube","g":"Man","a":"","x":"Russian-speaking. Says he paid a blackmailer 120,000 rubles even though he knew the tricks, because the scammer had a compromising video of him. SCAM FLAG: sextortion, paying did not end it in other replies under the video.","y":"2019"},{"r":"r3","s":"Other apps","o":"bad","oc":"nothing","p":"Russian sites","g":"Man","a":29,"x":"Russian-speaking. Older (2021) but a full pig-butchering case. Recently divorced, he matched with a woman \"from Singapore\" on a well known app. She had a French WhatsApp number, many photos, voice messages and one call. After weeks she pushed a new coin, let him withdraw a little, then demanded a 20 percent tax and an audit fee. Lost about 520,000 rubles and still owes 165,000. He later met a real girlfriend on the same app. SCAM FLAG.","y":"2021"},{"r":"r3","s":"Other apps","o":"bad","oc":"nothing","p":"Russian sites","g":"Man","a":"","x":"Russian-speaking. Matched on Mamba with a woman who said she was spending summer with her father in Ljubljana and earned on investments a friend of her father advised. The chat drifted into light flirting. She offered to ask her mentor to help him too and told him not to mention they had just met. He lost 310 dollars before checking the site. Red flag he lists: she has no social media anywhere. SCAM FLAG.","y":"2025"},{"r":"r3","s":"Gaming","o":"good","oc":"met in person","p":"YouTube","g":"Woman","a":"","x":"Russian-speaking couple. It all started in Phasmophobia, playing together as a duo, and nobody expected it to last more than eight months. The video films their first real meeting at a train platform, both shaking, she says \"tears in my eyes\". Ages not stated, see unsure note.","y":"2026"},{"r":"r3","s":"Instagram","o":"good","oc":"met in person","p":"YouTube","g":"Man","a":"","x":"Russian-speaking male couple, kept for the route only. One was scrolling Reels, liked a video of the other, and the other wrote to him even though he rarely replies to likes. Now engaged, one moved to Tbilisi and they plan Spain. Shows a like on a Reel opening the door to a DM.","y":"2026"},{"r":"r3","s":"Other apps","o":"good","oc":"met in person","p":"YouTube","g":"Woman","a":"","x":"Russian-speaking. Older (2020). Met a Spanish man on a dating site, they talked online and after some time decided she should move, she has lived in Spain about a year. Says shy men find writing in a profile easier than approaching, and that online is now normal practice.","y":"2020"},{"r":"r3","s":"Other apps","o":"good","oc":"met in person","p":"YouTube","g":"Woman","a":"","x":"Russian-speaking. Slightly older (Jan 2023). Matched with a man in Moscow on Tinder, answered him about once a week at first, kept talking, then travelled from Tyumen for their first meeting and filmed it. Commenters describe 1.5 to 3 years of talking before a first meeting.","y":"2023"},{"r":"r3","s":"Other online routes","o":"advice","oc":"advice only","p":"Russian sites","g":"Man","a":"","x":"Russian-speaking. Replying to a man asking for stories with foreign women: says such stories are rare because Russian men are \"not valued much\" by women from rich countries, and the exceptions moved abroad young and know the language well. Pessimistic view of cross-border dating for Russian men.","y":"2025"},{"r":"r3","s":"Other online routes","o":"advice","oc":"advice only","p":"Russian sites","g":"","a":"","x":"Russian-speaking. Says long distance with someone you love works only for a short time, \"more than a year apart equals a breakup\". Daily calls and synced films helped for two years with visits every 2 to 3 months.","y":"2023"},{"r":"r3","s":"Other online routes","o":"bad","oc":"nothing","p":"Russian sites","g":"","a":"","x":"Russian-speaking. Nearly five years long distance. Planned to move to Moscow together, then the pandemic and mobilization split their lives. They flew to each other and met in other cities, always bright dates, but \"not a real relationship\" since they never knew each other day to day. When things settled, neither wanted to change their life and they split.","y":"2023"},{"r":"r3","s":"Other online routes","o":"good","oc":"long distance relationship","p":"Russian sites","g":"Woman","a":"","x":"Russian-speaking. Practical cost: she spent close to half a million rubles on tickets, deposits, rent and new things while moving between countries for the relationship. Says money for travel is the hardest part, not logistics.","y":"2023"},{"r":"r3","s":"Other online routes","o":"good","oc":"long distance relationship","p":"Russian sites","g":"Woman","a":"","x":"Russian-speaking. Routine that worked for a two-month separation: Telegram video circles every morning, a video call of a couple of hours every evening, planning a shared holiday, and he sent flowers or berries every week or two. Something real in her hands from him helped a lot.","y":"2023"},{"r":"r3","s":"Gaming","o":"bad","oc":"nothing","p":"Russian sites","g":"Man","a":"","x":"Russian-speaking. Older (2022) but on looks. Met a girl in CS:GO, moved to WhatsApp, asked her to the cinema within days. He came unshaven and shaggy, she left after a couple of minutes. After a haircut and a new avatar photo she started writing again, but it still did not work out. Shows how much the first photo and grooming matter.","y":"2022"},{"r":"r3","s":"Gaming","o":"good","oc":"met in person","p":"Russian sites","g":"Woman","a":"","x":"Russian-speaking. Older (2022). Met her fiance in League of Legends. He simply invited her to play together on VK and it turned out he lived in her home city.","y":"2022"},{"r":"r3","s":"Gaming","o":"advice","oc":"advice only","p":"Russian sites","g":"Man","a":"","x":"Russian-speaking. Older (2022). Met three guys in Dota from Kazakhstan and Ukraine and they have been friends ten years. One of them found a girlfriend during one of their games and they have been together five years. Friend groups in games as a slow route.","y":"2022"},{"r":"r3","s":"Gaming","o":"good","oc":"met in person","p":"Russian sites","g":"Woman","a":"","x":"Russian-speaking. Older (2022). She and her husband of ten years played opposing factions in an online game, fought one on one, neither won and he just waved and left. She wrote to ask why, a conversation started, then friendship, a move and a wedding.","y":"2022"},{"r":"r3","s":"Other online routes","o":"advice","oc":"advice only","p":"Russian sites","g":"Man","a":"","x":"Russian-speaking gamer. Lives with his girlfriend and sees how many men hit on her everywhere, even after she says she is married. Says most men who hunt for a girlfriend use \"stuffy phrases\" that scare women. His own habit of writing playful random messages to strangers in VK chats led to real friendships and meetups in other cities.","y":"2025"},{"r":"r3","s":"Discord","o":"bad","oc":"nothing","p":"YouTube","g":"Man","a":"","x":"Russian-speaking creator, one voice. Tried Discord dating and teammate-search servers. Says roughly one woman in twenty answers because men vastly outnumber women, and many female accounts advertise private Telegram content or look for sponsors. SCAM FLAG: paid-content promoters on Discord dating servers.","y":"2026"},{"r":"r3","s":"Other online routes","o":"bad","oc":"nothing","p":"YouTube","g":"Man","a":"","x":"Russian-speaking. Calls himself a careful person, yet scammers found \"a key to me\" through warm female chat and took money. SCAM FLAG: romance as the opener for fraud.","y":"2024"},{"r":"r3","s":"Language apps","o":"good","oc":"met in person","p":"App communities","g":"Woman","a":"","x":"Company-curated. Downloaded Slo orm was unstated.","y":"2026"},{"r":"r3","s":"Other online routes","o":"good","oc":"met in person","p":"Reddit","g":"","a":"","x":"Talked and video-called for a year before a first meeting. They had discussed a mutual way to end the visit kindly if the chemistry was absent.","y":"2026"},{"r":"r3","s":"Other online routes","o":"advice","oc":"advice only","p":"Reddit","g":"","a":"","x":"Their partner used edited photos, but in-person appearance felt close enough and they still found her attractive. This was a preference, no sign of impersonation reported.","y":"2026"},{"r":"r3","s":"Other online routes","o":"good","oc":"met in person","p":"Reddit","g":"","a":"","x":"First transfer from phone calls to in-person time felt unfamiliar. Physical comfort increased on the second meeting.","y":"2026"},{"r":"r3","s":"Other online routes","o":"advice","oc":"advice only","p":"Reddit","g":"","a":"","x":"Said physical attraction can grow as you get to experience someone's in-person presence.","y":"2026"},{"r":"r3","s":"Other online routes","o":"advice","oc":"advice only","p":"Reddit","g":"","a":"","x":"Suggested taking attraction seriously while giving character a fair chance and being honest if compatibility does not develop.","y":"2026"},{"r":"r3","s":"Other online routes","o":"advice","oc":"advice only","p":"Reddit","g":"","a":"","x":"Saw a strong initial attraction as important enough to avoid investing indefinitely when someone felt persistently unsure.","y":"2026"},{"r":"r3","s":"Other online routes","o":"advice","oc":"advice only","p":"Reddit","g":"","a":"","x":"Video and photos help set expectations, and both people remain free to walk away after a first visit.","y":"2026"},{"r":"r3","s":"Other online routes","o":"good","oc":"met in person","p":"Reddit","g":"","a":"","x":"Fell for her husband's voice before his appearance. Frequent video calls let small details build attraction, and it carried through to their first visit.","y":"2026"},{"r":"r3","s":"Other online routes"," teresting]","y":"2026"},{"r":"r4","s":"Advice","o":"advice","oc":"advice only","p":"Russian sites","g":"Man","a":"","x":"After three countries he says friendships built on shared relocation stress break easily, the ones that last come from shared passions like sport or hobbies. \"дружба на почве общего стресса - штука хрупкая\" [friendship built on shared stress is fragile]","y":"2026"},{"r":"r4","s":"Expat","o":"mid","oc":"improving","p":"Russian sites","g":"Woman","a":"","x":"Moved with her husband in summer 2024. Treats loneliness as part of relocation, talks to strangers in shops and at events, got close to neighbours, joined a local cycling association with rides and meetups. After about a year no real local friendship yet, only hope. \"Да, одиночество - это часть релокации.\" [yes, loneliness is part of relocation]","y":"2025"},{"r":"r4","s":"Expat","o":"mid","oc":"improving","p":"Russian sites","g":"","a":30,"x":"Older thread, kept because it says what helped. First six months abroad felt unreal, introvert, kept calling friends in Russia instead of meeting locals. What helped: building a routine and favourite places and deliberately starting contact. After a year things were more or less normal. \"никто за тобой со своей дружбой бегать не будет\" [nobody will chase you with their friendship]","y":"2022"},{"r":"r4","s":"Limerence","o":"good","oc":"got out","p":"Russian sites","g":"Woman","a":40,"x":"Married, adult daughter. On and off for about 20 years, the latest loop 5 years, fixated on a man she knew only through online chats, he would vanish and return. Tried quitting alcohol, sport, promising not to check his pages. Finally blocked him everywhere and later wrote that it was over. \"Я влюблена в образ, призрак, которого нет на самом деле.\" [I'm in love with an image, a ghost]","y":"2025"},{"r":"r4","s":"Friend-zone","o":"good","oc":"got out","p":"Russian sites","g":"Man","a":"","x":"Was in the same spot of loving someone who did not return it. Told her, as hell. Timeline one year, contact not stated. \"the next year of my life was hell\"","y":"2025"},{"r":"r5a","s":"Lonely","o":"bad","oc":"still stuck","p":"YouTube","g":"Woman","a":25,"x":"Age 25, has a job and soon an apartment but no one outside family, and works where the only two colleagues are much older. \"i'm completely failing at the human part of life\"","y":"2023"},{"r":"r5a","s":"No dating experience","o":"bad","oc":"still stuck","p":"YouTube","g":"","a":29,"x":"Age 29, works and studies, did not finish college at 22 like peers, never had a girlfriend and it hurts every day. Feels life went downhill after school. No route yet. \"never had a girlfriend though not having one pains me every day\"","y":"2023"},{"r":"r5a","s":"Got out","o":"good","oc":"got out","p":"YouTube","g":"","a":22,"x":"Was the loner type at 22 apart from having a job. Coworkers kept asking friendly questions until they opened up, and lunchtime card games led to many new friends, some now close. Route other, coworkers at the job. \"I made so many new friends\"","y":"2023"},{"r":"r5a","s":"No dating experience","o":"bad","oc":"still stuck","p":"YouTube","g":"Man","a":21,"x":"Interviewee on Dr. K Interviews. Age 21, has never really dated, stays inside most of the time, and had feelings for a friend who messaged him about her guy problems while he never told her. Interview from 2020, kept because it matches the never-sent-a-clear-invite pattern closely. No route. \"I just stay inside majority of the time.\"","y":"2020"},{"r":"r5a","s":"Got out","o":"good","oc":"got out","p":"YouTube","g":"","a":"","x":"First real relationship started at 20 and they are 3 years in. Tells others to stay patient and keep working on themselves. Route not stated. \"my first real relationship started when I was 20\"","y":"2026"},{"r":"r5a","s":"Online to in-person","o":"mid","oc":"improving","p":"YouTube","g":"","a":"","x":"Met a new partner on Hinge and has been on several dates. Felt alone for a long time and says it happened once they built their own life first. Met through a dating app, then in person, time not stated. \"we met on Hinge and have been on several dates already\"","y":"2026"},{"r":"r5a","s":"Sober loss","o":"bad","oc":"still stuck","p":"YouTube","g":"","a":"","x":"11 years clean and says there were never friends, only people to drink with. Not very happy and feels nothing at times. No route. \"I had ppl i knew that I drank with\"","y":"2023"},{"r":"r5a","s":"Sober loss","o":"bad","oc":"still stuck","p":"YouTube","g":"","a":"","x":"Sober over 5 years. The old crowd left one by one because the commenter no longer parties, and new connections are hard. No route. \"one by one my old crowd has left because I no longer party\"","y":"2023"},{"r":"r5a","s":"Sober loss","o":"good","oc":"got out","p":"YouTube","g":"","a":"","x":"Says most former drinking friends were only drinking friends and does not miss them. Route not stated. \"Most of my ex drinking friends were just that\"","y":"2025"},{"r":"r5a","s":"Lonely","o":"bad","oc":"still stuck","p":"YouTube","g":"Man","a":"","x":"Caller on The Dr. John Delony Show. Works alone in landscaping, lives alone, and goes whole days without talking to anyone. Knows many people but no one he could call at 3 a.m. to drive him to hospital. \"I usually don't interact with anybody\"","y":"2023"},{"r":"r5a","s":"Online friendship","o":"mid","oc":"improving","p":"YouTube","g":"","a":"","x":"No friends and a busy life. Started hosting an online Bible study for millennials and says it has filled their life and let them give to others. Route other, an online faith group they host. \"I actually started hosting an online bible study for Millennials\"","y":"2023"},{"r":"r5a","s":"Got out","o":"good","oc":"got out","p":"YouTube","g":"Man","a":"","x":"A realtor who realised while planning his wedding that his only friend was his mom. His now best friend walked into one of his open houses and he decided to be brave. Route other, met through work. \"I didn’t have any friends except my mom\"","y":"2023"},{"r":"r5a","s":"Online to in-person","o":"good","oc":"got out","p":"YouTube","g":"Woman","a":"","x":"Listener story read on The Oversharers Podcast. A woman on a UK work visa followed a guy Instagram suggested, they chatted on and off for about a year and a half, and when he replied to her stories she found him boring. Then he asked to meet, they fell for each other, survived a break during long distance and he later met her family. Both in the UK, he asked, about 18 months from first chat to meeting. \"whenever he replied to my stories I had thought that he was boring\"","y":"2023"},{"r":"r5a","s":"Online friendship","o":"advice","oc":"advice only","p":"YouTube","g":"Woman","a":"","x":"Two podcast hosts say new creators keep telling them the work is lonely and they have no creator friends. Their routes are creator communities, including course communities and their own free office hours with a WhatsApp group, and messaging creators you like while accepting not everyone replies. Route creator circle. \"Feel free to DM them.\"","y":"2026"},{"r":"r5a","s":"Online friendship","o":"good","oc":"got out","p":"YouTube","g":"","a":"","x":"Has two close friends met on the internet and visits them every so often. Thinks it only works with something to bond over regularly and talk often, like music or games. Comment from about 2022, kept because recent B rows are thin. Route other, shared interest online. \"something to regularly bond over\"","y":"2022"},{"r":"r5a","s":"Online to in-person","o":"good","oc":"got out","p":"YouTube","g":"Woman","a":"","x":"Couple storytime from 2020, kept because a story reaction turned into a date. He reacted to her Instagram story in late October and replied slowly, so she assumed he had a girlfriend. FaceTime, long late-night calls and swapped music playlists led to a first date on 4 January. Same area, she had a car. About two months from first message to meeting. \"he was responding back very slow\"","y":"2020"},{"r":"r5a","s":"Low-effort replies","o":"advice","oc":"advice only","p":"X","g":"","a":"","x":"Viral reply-guy wisdom (3.4K likes, 156K views): a girl called a dry texter is simply not interested. \"she just don't fw you bro\". One of many near-identical posts in the search, the most repeated line in this niche.","y":"2025"},{"r":"r5a","s":"Low-effort replies","o":"advice","oc":"advice only","p":"X","g":"","a":"","x":"Tells another man that if she wanted to she would write long messages and keep the chat alive, interest fades, not typing energy. \"Stop blaming her typing style.\"","y":"2026"},{"r":"r5a","s":"Low-effort replies","o":"advice","oc":"advice only","p":"X","g":"","a":"","x":"Same stock phrase, 249 likes and 23K views. \"she just doesnt like you\". Shows the line has been circulating unchanged for years.","y":"2023"},{"r":"r5a","s":"Low-effort replies","o":"advice","oc":"advice only","p":"X","g":"","a":"","x":"Says he will stop replying fast once he notices a girl is a dry texter, matching her pace instead of carrying the chat. No wait time or ending stated.","y":"2026"},{"r":"r5a","s":"Low-effort replies","o":"good","oc":"got out","p":"X","g":"","a":"","x":"Ended it himself. \"blocked her cus she was a dry texter\". How it ended: he cut contact, no ask mentioned, wait time not stated.","y":"2026"},{"r":"r5a","s":"Low-effort replies","o":"good","oc":"got out","p":"X","g":"","a":"","x":"They talked every day for months but he was always the one reaching out. He stopped to test her, \"the silence told me everything\". She later asked why he stopped texting. Waited: months. Ended: he stopped texting and she only noticed later. 234 likes, 51 bookmarks. Account looks like a relatable-quotes page, treat as weak.","y":"2026"},{"r":"r5a","s":"Low-effort replies","o":"bad","oc":"still stuck","p":"X","g":"","a":"","x":"Stopped texting her first and the chat died. \"we aint talked in 3 days\". Ended: he stopped texting and she did not come back (so far).","y":"2026"},{"r":"r5a","s":"Low-effort replies","o":"bad","oc":"still stuck","p":"X","g":"","a":"","x":"Quote-posting a joke about the not-texting-first trick. \"Been almost 8 months since I've really spoken to my best friend\" after he stopped texting her first. Waited 8 months. Ended: he stopped texting and she never came back.","y":"2026"},{"r":"r5a","s":"Low-effort replies","o":"bad","oc":"still stuck","p":"X","g":"","a":"","x":"Lost a friendship purely by no longer starting the chats. \"That's all it took\". Common realization that the friendship rested on one person initiating.","y":"2025"},{"r":"r5a","s":"Low-effort replies","o":"bad","oc":"still stuck","p":"X","g":"","a":"","x":"\"I thought she was my babe till I stopped texting her first\". Ended: faded once he stopped carrying it.","y":"2026"},{"r":"r5a","s":"Advice","o":"advice","oc":"advice only","p":"X","g":"","a":"","x":"(men's advice page). \"If you stopped texting her first, she won't text you again.\" 2.8K likes, 170K views, copied word for word by another advice page two weeks later. Framed as a test that exposes one-sided chats.","y":"2026"},{"r":"r5a","s":"Advice","o":"advice","oc":"advice only","p":"X","g":"","a":"","x":"(dating advice thread, 124K views) on women who answer but never start a chat. \"Stop making excuses for her lack of effort\". Suggests asking whether she would even notice if he stopped texting first.","y":"2026"},{"r":"r5a","s":"Advice","o":"advice","oc":"advice only","p":"X","g":"","a":"","x":"\"Me replaying the disrespect so I can stay in no contact\" (111K likes, 2.4M views, a near copy by another user got 62K). The most shared no contact tactic in this search: keep the bad memories in front to resist reaching out. No contact.","y":"2026"},{"r":"r5a","s":"Limerence","o":"mid","oc":"improving","p":"X","g":"","a":"","x":"Calls limerence all consuming. After years fixated on one person, finally unfollowed and blocked them, \"i feel like i can breathe
