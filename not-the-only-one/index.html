<!doctype html>
<html lang="en">
<head>

<meta property="og:description" content="3,070 real people on loneliness, friendship, dating and getting out, read over two nights.">

<style>
:root{
 --ink:#0E1A36;--deep:#17264A;--deep2:#1F3159;--line:#2B3D66;
 --amber:#F4B23E;--blue:#8DB6F2;--lilac:#B7A8D6;--dawn:#F6E3CF;
 --text:#EEE7DC;--muted:#A9B3CC;--inktext:#1A2240;
 --disp:"Cormorant Garamond",Georgia,serif;--ui:"Hanken Grotesk",system-ui,sans-serif;--read:var(--ui);--dw:600;
 --col:40rem;--wide:70rem;--g:16px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--ui);font-size:17px;line-height:1.5;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,#0E1A36 0%,#0E1A36 30%,#162650 55%,#2C2F5C 72%,#5B4565 84%,#B98575 93%,#F0CFB4 100%);background-size:100% 100%;transform:translateY(calc(var(--night,0) * -1%));height:200%}
a{color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:4px}
.wrap{max-width:var(--wide);margin:0 auto;padding:0 var(--g)}
.col{max-width:var(--col)}
@media(min-width:900px){:root{--g:40px}}

.hero h1,h2,h3,.num .v,.rules .r,.rules .rn,.big,.runs .k,.help b,.widget h4{font-feature-settings:"lnum" 1}
/* nav */
.bar{position:sticky;top:0;z-index:20;background:rgba(14,26,54,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid rgba(141,182,242,.14)}
.bar nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:8px var(--g);max-width:var(--wide);margin:0 auto}
.bar nav::-webkit-scrollbar{display:none}
.bar a{flex:none;text-decoration:none;font-size:14px;font-weight:500;color:var(--muted);padding:6px 10px 6px 18px;white-space:nowrap;position:relative}
.bar a::before{content:"";position:absolute;left:7px;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:rgba(169,179,204,.35)}
.bar a.on{color:var(--text)}
.bar a.on::before{background:var(--amber);box-shadow:0 0 8px var(--amber)}
.prog{height:2px;background:var(--amber);width:0;transform-origin:left}

/* hero */
.hero{position:relative;min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:9vh}
#sky{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:pointer;touch-action:pan-y}
.hero .wrap{position:relative;pointer-events:none;width:100%}
.hero h1{font-family:var(--disp);font-size:clamp(4rem,19vw,10.5rem);line-height:.86;letter-spacing:-.015em;font-weight:var(--dw);margin:0 0 .3em}
.hero .lede{font-size:clamp(1.15rem,4.6vw,1.6rem);line-height:1.3;max-width:28ch;margin:0 0 1.1em;font-weight:400}
.hero .lede b{font-weight:700;color:var(--amber)}
.key{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--muted);margin:0;padding:0;list-style:none}
.key li{display:flex;align-items:center;gap:7px}
.key i{width:9px;height:9px;border-radius:50%;display:inline-block}
.hint{font-size:14px;color:var(--muted);margin-top:14px}
.peek{position:fixed;left:var(--g);right:var(--g);bottom:16px;z-index:30;max-width:30rem;margin:0 auto;transform:translateY(140%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.peek.show{transform:none}
.peek .bub{box-shadow:0 18px 50px rgba(0,0,0,.45)}
.peek button{position:absolute;top:8px;right:10px;background:none;border:0;color:var(--muted);font-size:22px;line-height:1;cursor:pointer;padding:4px 8px}

/* sections */
section{padding:clamp(72px,14vw,150px) 0 0}
h2{font-family:var(--disp);font-size:clamp(2.6rem,10vw,5rem);line-height:.95;letter-spacing:-.01em;font-weight:var(--dw);margin:0 0 .45em;max-width:14ch}
h3{font-family:var(--disp);font-size:clamp(1.9rem,6.6vw,2.9rem);line-height:1;letter-spacing:-.008em;font-weight:var(--dw);margin:0 0 .4em;max-width:20ch}
p{margin:0 0 1em}
.read{font-family:var(--read);font-size:1.13rem;line-height:1.62}
.muted{color:var(--muted)}
.src{font-size:13px;color:var(--muted);line-height:1.4}
.nv{display:inline-block;font-size:12px;font-weight:600;color:var(--ink);background:var(--lilac);border-radius:3px;padding:1px 5px;margin-left:4px;vertical-align:2px}

/* numbers */
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:28px 24px;margin:30px 0 10px}
.num .v{font-family:var(--disp);font-size:clamp(2.5rem,9.5vw,3.7rem);text-wrap:balance;font-weight:var(--dw);letter-spacing:-.01em;line-height:.9;font-variant-numeric:lining-nums tabular-nums;color:var(--amber);font-variant-numeric:tabular-nums}
.num .v.b{color:var(--blue)}
.num .l{font-size:15px;line-height:1.3;margin-top:6px;max-width:22ch}
.num .src{margin-top:4px}

/* bars */
.chart{margin:30px 0;max-width:46rem}
.chart h4{font-size:16px;font-weight:600;margin:0 0 12px}
.brow{display:grid;grid-template-columns:minmax(90px,38%) 1fr;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.brow .lab{line-height:1.25}
.brow .track{position:relative;height:22px;background:rgba(141,182,242,.10);border-radius:3px}
.brow .fill{position:absolute;inset:0 auto 0 0;background:var(--blue);border-radius:3px}
.brow .fill.a{background:var(--amber)}
.brow .val{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-weight:700;font-size:13px;color:var(--ink)}
.brow .val.out{color:var(--text)}
table.t{border-collapse:collapse;width:100%;font-size:15px;margin:20px 0}
table.t th,table.t td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.t th{font-weight:600;color:var(--muted);font-size:13px}
table.t td.n{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}

/* split */
.split{display:flex;height:64px;border-radius:4px;overflow:hidden;margin:18px 0 8px}
.split div{display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:var(--ink);min-width:0;overflow:hidden;white-space:nowrap}

/* bubbles */
.bub{position:relative;background:var(--deep);border:1px solid rgba(141,182,242,.16);border-radius:20px 20px 20px 6px;padding:15px 17px 13px}
.bub .x{font-family:var(--read);font-size:1.04rem;line-height:1.5;margin:0}
.bub .who{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12.5px;color:var(--muted);margin-top:9px}
.bub .who .o{font-weight:600;position:relative;padding-left:12px}.bub .who .o::before{content:"";position:absolute;left:0;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:currentColor}
.o.good{color:var(--amber)}.o.bad{color:var(--blue)}.o.mid{color:var(--lilac)}.o.advice{color:var(--muted)}
.bub.good{border-color:rgba(244,178,62,.38)}
.swipe{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px var(--g) 18px;margin:10px calc(var(--g) * -1) 0;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.swipe .bub{flex:0 0 min(84%,22rem);scroll-snap-align:start}
@media(min-width:900px){.swipe{flex-wrap:wrap;overflow:visible;margin:10px 0 0;padding:6px 0 0}.swipe .bub{flex:0 0 calc(33.33% - 8px)}}

/* rules */
.rules{list-style:none;margin:40px 0 0;padding:0;border-top:1px solid var(--line)}
.rules li{display:grid;grid-template-columns:1fr;gap:6px 30px;padding:26px 0;border-bottom:1px solid var(--line)}
@media(min-width:760px){.rules li{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}}
.rules .r{font-family:var(--disp);font-size:clamp(1.75rem,6.6vw,2.6rem);font-weight:var(--dw);letter-spacing:-.008em;line-height:1.02}
.rules .rn{font-family:var(--disp);font-size:clamp(2rem,8vw,3rem);font-weight:var(--dw);color:var(--amber);letter-spacing:-.01em;line-height:1;font-variant-numeric:lining-nums}
.rules .re{font-size:15px;margin:6px 0 0}
.rules .rs{font-family:var(--read);font-size:1rem;color:var(--muted);margin:8px 0 0}

/* widgets */
.widget{background:rgba(23,38,74,.72);border:1px solid rgba(141,182,242,.2);border-radius:16px;padding:24px 22px;margin:34px 0;max-width:46rem}
.widget h4{font-family:var(--disp);font-size:1.6rem;font-weight:var(--dw);margin:0 0 6px}
.widget input[type=range]{width:100%;accent-color:var(--amber);margin:14px 0 6px}
.tn{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 8.5em;gap:12px;align-items:center;padding:9px 0;border-top:1px solid rgba(238,231,220,.09)}.tl{font-size:.92rem;line-height:1.3}.tb{height:10px;border-radius:5px;background:rgba(238,231,220,.08);overflow:hidden}.tb i{display:block;height:100%;border-radius:5px;background:var(--muted);transition:width .12s linear,background .3s}.tb i.up,.tb i.dn{background:var(--lilac)}.tb.ef{height:14px;margin:10px 0 4px}.tb.ef i{background:var(--amber);transition:width .45s}.tv{font-variant-numeric:tabular-nums;font-size:.9rem}.tv b{font-size:1.15rem}.tv span{color:var(--muted);font-size:.78rem;display:block}@media(max-width:640px){.tn{grid-template-columns:1fr 5.6em}.tn .tb{grid-column:1/-1;grid-row:2}}
.meter{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--blue),var(--lilac),var(--amber));position:relative;margin:16px 0 6px}
.meter .needle{position:absolute;top:-6px;width:4px;height:26px;background:var(--text);border-radius:2px;left:4%;transition:left .5s}
.mlab{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.big{font-family:var(--disp);font-size:clamp(1.9rem,7.5vw,2.8rem);font-weight:var(--dw);letter-spacing:-.01em;font-variant-numeric:lining-nums;line-height:1.05;margin:10px 0 4px}
.seg{display:inline-flex;background:var(--ink);border-radius:999px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{font:inherit;font-size:14px;font-weight:600;border:0;border-radius:999px;padding:8px 14px;background:none;color:var(--muted);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--amber);color:var(--ink)}

/* method timeline */
.runs{list-style:none;margin:30px 0;padding:0;display:grid;gap:0}
.runs li{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.runs .k{font-family:var(--disp);font-size:32px;font-weight:var(--dw);color:var(--amber);line-height:1;font-variant-numeric:lining-nums}
.runs .t{font-weight:650;font-size:17px;line-height:1.25}
.runs .d{font-size:14px;color:var(--muted)}

/* topics */
.topic{padding-top:clamp(56px,10vw,110px)}
.topic .lede{font-family:var(--read);font-size:1.2rem;line-height:1.5;max-width:34em}

/* wall */
.wall{columns:1;column-gap:12px;margin-top:30px}
@media(min-width:620px){.wall{columns:2}}
@media(min-width:1000px){.wall{columns:3}}
.wall .bub{break-inside:avoid;margin:0 0 12px}

/* explorer */
.ex-controls{display:grid;gap:10px;margin:24px 0 14px;grid-template-columns:1fr 1fr}
.ex-controls input,.ex-controls select{font:inherit;font-size:15px;color:var(--text);background:var(--deep);border:1px solid var(--line);border-radius:8px;padding:11px 12px;width:100%;min-width:0}
.ex-controls input{grid-column:1/-1}
@media(min-width:900px){.ex-controls{grid-template-columns:2fr repeat(5,1fr)}.ex-controls input{grid-column:auto}}
.ex-count{font-size:14px;color:var(--muted);margin:0 0 12px}
.ex-list{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:900px){.ex-list{grid-template-columns:1fr 1fr}}
.more{font:inherit;font-weight:650;font-size:15px;margin:18px 0;padding:12px 20px;border-radius:999px;border:1px solid var(--amber);background:none;color:var(--amber);cursor:pointer}

/* dawn */
.dawn{color:var(--inktext);background:var(--dawn);display:flow-root;padding-bottom:clamp(40px,8vw,80px)}
.hero h1,.hero p,.hero .key{text-shadow:0 0 18px #0E1A36,0 0 6px #0E1A36}
#meaning.dawn{background:linear-gradient(180deg,rgba(246,227,207,0) 0,#B98575 150px,var(--dawn) 340px);padding-top:340px}
.dawn .muted,.dawn .src{color:#4A4F6A}
.dawn .bub{background:rgba(255,255,255,.55);border-color:rgba(26,34,64,.15)}
.dawn table.t th,.dawn table.t td{border-color:rgba(26,34,64,.18)}
.dawn .rules li,.dawn .rules{border-color:rgba(26,34,64,.2)}
ul.plain{padding-left:1.1em;margin:0 0 1em}
ul.plain li{margin:.35em 0}
footer{padding:90px 0 60px}
.help{display:grid;gap:4px 24px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin:18px 0 26px}
.help div{font-size:15px}
.help b{display:block;font-family:var(--disp);font-size:1.9rem;font-weight:var(--dw);font-variant-numeric:lining-nums}
</style>
</head>
