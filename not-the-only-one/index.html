 campus. She had suggested a group hangout and liked his Instagram stories. After she told him she missed him, he asked her out and she accepted, then did not read his question about her schedule.","y":"2024"},{"r":"r5a","s":"Story replies only","o":"bad","oc":"still stuck","p":"Reddit","g":"","a":"","x":"Asked a woman he had known for years for coffee after replying to her story and flirting for a few days. She said she had a boyfriend. He stopped reaching out, but she now likes all of his stories and he wonders what it means.","y":"2026"},{"r":"r5a","s":"Low-effort replies","o":"bad","oc":"still stuck","p":"Reddit","g":"","a":36,"x":"A manager several levels above a coworker had gone out with her several times. He usually invited her and she accepted, but she rarely texted and did not follow up when saying she would. He stopped asking for a month and is unsure whether her visits to places he mentioned were signals.","y":"2024"},{"r":"r5a","s":"Low-effort replies","o":"bad","oc":"still stuck","p":"Reddit","g":"","a":27,"x":"Met through a dating app and moved to Instagram, where he initially replied to her stories. After sex he asked for commitment, and she said not yet but maybe later. Her later messages were pictures with no words, sometimes followed by silence, while the same pictures appeared on her stories.","y":"2024"},{"r":"r5a","s":"Shot taken","o":"bad","oc":"still stuck","p":"Reddit","g":"","a":"","x":"Matched with a coworker on an app. She asked him on a date and they went out twice. After he asked for a third date, she replied about ten days later that she would meet as friends because she felt no chemistry. He had not responded two weeks later.","y":"2026"},{"r":"r5a","s":"Shot taken","o":"bad","oc":"still stuck","p":"Reddit","g":"","a":"","x":"Asked a coworker out. She warmly said yes, but was distant the next day. They were supposed to meet the day after the post, and he was still deciding whether to confirm.","y":"2026"},{"r":"r5a","s":"Shot taken","o":"bad","oc":"still stuck","p":"Reddit","g":"","a":"","x":"A woman he liked invited him to a mutual friends house when she was visiting from out of town. He found himself alone with her and another friend, then asked the mutual friend a month or two later whether there had been interest. She said no.","y":"2024"},{"r":"r5a","s":"Shot taken","o":"mid","oc":"improving","p":"Reddit","g":"","a":"","x":"A coworker invited him to a movie and he assumed it was a date. He later realized it was friendly because she talked about her boyfriend. He disengaged when the conversation grew awkward.","y":"2024"},{"r":"r5a","s":"Shot taken","o":"mid","oc":"improving","p":"Reddit","g":"","a":"","x":"A coworker invited him to a movie and later a hike. He thought the invitations were romantic and eventually confessed after several months. She said she liked him as a friend, which he considered useful clarity.","y":"2024"},{"r":"r5a","s":"Shot taken","o":"mid","oc":"improving","p":"Reddit","g":"","a":"","x":"Asked a friend out long ago, was told she only wanted friendship, and remained friends. He now invites other people when they spend time together to respect her relationship and manage his own feelings.","y":"2024"},{"r":"r5a","s":"Shot taken","o":"good","oc":"got out","p":"Reddit","g":"","a":"","x":"Described dating a friend after repeated casual activity invitations were treated as group outings. A later friend used a more direct physical signal, and they became a couple.","y":"2024"},{"r":"r5a","s":"Advice","o":"bad","oc":"still stuck","p":"Reddit","g":"","a":"","x":"Said someone agreed to go out with him despite lacking attraction, and the experience felt worse than a direct no.","y":"2025"},{"r":"r5a","s":"Advice","o":"advice","oc":"advice only","p":"Reddit","g":"","a":"","x":"Based on past dates without chemistry, said it can be harder to return to friendship afterward, especially if one person initiates physical contact.","y":"2025"},{"r":"r5a","s":"Shot taken","o":"bad","oc":"still stuck","p":"Reddit","g":"","a":33,"x":"Said she married a man for ten years despite not being happy, describing a pattern of sacrificing her wishes to avoid his discomfort. She advised being direct when there is no attraction.","y":"2025"},{"r":"r5a","s":"Shot taken","o":"mid","oc":"improving","p":"Reddit","g":"","a":"","x":"Said he had been the person asking a female friend who did not reciprocate. He described the uncertainty as painful, but said the friendships remained intact.","y":"2025"},{"r":"r5a","s":"Shot taken","o":"good","oc":"got out","p":"Reddit","g":"","a":"","x":"A coworker asked her to dinner. She enjoyed the date but declined another because she did not want to mix work and personal life. They stayed friendly in groups, later dated for two years after she changed jobs.","y":"2026"},{"r":"r5a","s":"Advice","o":"mid","oc":"improving","p":"Reddit","g":"","a":"","x":"Said she had told a man she was open to friendship only. He accepted the boundary and did not make another date plan, and they still talk normally at work.","y":"2026"},{"r":"r5a","s":"Shot taken","o":"bad","oc":"still stuck","p":"Reddit","g":"","a":"","x":"Described a woman flirting repeatedly and saying she wanted him to take her on a date, then later saying she had been joking after he accepted.","y":"2026"},{"r":"r5a","s":"Shot taken","o":"good","oc":"got out","p":"Reddit","g":"","a":"","x":"Said a best friendship lasted seven years before one of them asked to kiss the other at a bar. They have spent nearly every day together for over fourteen years since.","y":"2024"},{"r":"r5a","s":"Shot taken","o":"bad","oc":"still stuck","p":"Reddit","g":"Woman","a":"","x":"After a breakup she became close to a male friend and shared personal details. He asked her out six months later. She felt betrayed and told him so. Nine months later they were cordial but she avoided him in group settings.","y":"2024"},{"r":"r5a","s":"Online friendship","o":"bad","oc":"still stuck","p":"Reddit","g":"","a ot more friendship is built.","y":""},{"r":"r5a","s":"Online friendship","o":"mid","oc":"improving","p":"Reddit","g":"","a":"","x":"Found three valued penpals on the subreddit and has corresponded with them for over a year.","y":""},{"r":"r5a","s":"Online friendship","o":"mid","oc":"improving","p":"Reddit","g":"","a":"","x":"Many contacts stop replying after a few sessions, but one penpal relationship has continued for over three years.","y":""},{"r":"r5a","s":"Advice","o":"advice","oc":"advice only","p":"Reddit","g":"","a":"","x":"Suggests email or messages as a lower-disclosure starting format and warns that ghosting and mismatched effort are common. Also mentions games as an optional shared activity.","y":""},{"r":"r5a","s":"Online friendship","o":"mid","oc":"improving","p":"Reddit","g":"","a":"","x":"Reports a decade-long tie from an online book-club community and several years of contact through a writing Discord. Some ties remain comfortable, others strain over changed views.","y":""},{"r":"r5a","s":"Online friendship","o":"mid","oc":"improving","p":"Reddit","g":"","a":"","x":"Has several current penpals and several false starts. Shared detailed interests and ongoing correspondence are part of the durable ties.","y":""},{"r":"r5a","s":"Online friendship","o":"mid","oc":"improving","p":"Reddit","g":"","a":"","x":"Still exchanges French-touch and house-music recommendations online with a former school friend not seen since graduation.","y":"2026"},{"r":"r5a","s":"Online friendship","o":"mid","oc":"improving","p":"Reddit","g":"","a":"","x":"A friend introduced through MSN chat rooms is still contacted by birthday calls and occasional Instagram chats after many years.","y":"2026"},{"r":"r5a","s":"Online friendship","o":"mid","oc":"improving","p":"Reddit","g":"","a":"","x":"A LiveJournal community moved to a Facebook group, which remains the main reason the poster keeps the account.","y":"2026"},{"r":"r5a","s":"Online friendship","o":"mid","oc":"improving","p":"Reddit","g":"","a":"","x":"Keeps valued online-only friends from a specific forum around the world through texts, emails, messages, and occasional letters. Expects some may never meet.","y":"2026"},{"r":"r5a","s":"Online friendship","o":"mid","oc":"improving","p":"Reddit","g":"","a":"","x":"Reddit contacts became an Instagram group chat that the poster describes as a very important part of life.","y":"2026"},{"r":"r5a","s":"Online friendship","o":"mid","oc":"improving","p":"Reddit","g":"","a":"","x":"Reports still being friends with someone first met on Reddit about two years earlier.","y":"2026"},{"r":"r5a","s":"Online to in-person","o":"mid","oc":"improving","p":"Reddit","g":"Woman","a":"","x":"Met online in December, flew to him about six weeks later, and reported being together nine months later.","y":"2024"},{"r":"r5a","s":"Online to in-person","o":"mid","oc":"improving","p":"Reddit","g":"Woman","a":"","x":"University student without full-time work visited him twice during semester breaks. She had no income while in the US, he paid the first flight and part of the second trip, and she said the combined costs ran above a few thousand dollars.","y":"2024"},{"r":"r5a","s":"Online to in-person","o":"bad","oc":"still stuck","p":"Reddit","g":"","a":"","x":"Said they had been together nearly two and a half years without meeting, partly because of financial struggles.","y":"2024"},{"r":"r5a","s":"Online to in-person","o":"bad","oc":"still stuck","p":"Reddit","g":"","a":19,"x":"Said bills and expenses made saving for a visit compete with hobbies and future savings, and they were trying to save to see the partner.","y":"2024"},{"r":"r5a","s":"Online to in-person","o":"mid","oc":"improving","p":"Reddit","g":"","a":"","x":"After almost two years together, reported about $2,700 in flights to see him, plus lodging and local travel. She paid her own flights, and a month-long trip meant a month without pay.","y":"2024"},{"r":"r5a","s":"Online to in-person","o":"mid","oc":"improving","p":"Reddit","g":"","a":"","x":"Said she was low income, he paid for visits around twice a year and nearly all expenses, and she covered bus fare. He had visited her, and she saved enough for a passport so she could fly to him later that year.","y":"2024"},{"r":"r5a","s":"Online to in-person","o":"bad","oc":"still stuck","p":"Reddit","g":"Woman","a":"","x":"They started talking in November 2024, became official in January 2025, and after a year still had no plans to meet, perhaps next year but without expectation.","y":"2026"},{"r":"r5a","s":"Online to in-person","o":"mid","oc":"improving","p":"Reddit","g":"","a":"","x":"Said she lives with parents and studies remotely. She works as much as possible during the months at home to save for long visits. Exchange rates make his pay go farther in Mexico, and he saves half her flight while they split costs.","y":"2026"},{"r":"r5a","s":"Online to in-person","o":"mid","oc":"improving","p":"Reddit","g":"","a":"","x":"Met online in December 2023 and traveled to India in October 2024, then visited again in February and October 2025. His visitor visa was denied after a salary question. She plans more visits and says a return ticket is about $1,000, which she can afford more easily than he can.","y":"2026"},{"r":"r5a","s":"Online to in-person","o":"bad","oc":"still stuck","p":"Reddit","g":"Woman","a":"","x":"At the post, she planned a first solo international flight to see him, while his visa made a reciprocal visit difficult. She said this would be her first international and solo trip and she felt scared.","y":"2025"},{"r":"r5a","s":"Online to in-person","o":"mid","oc":"improving","p":"Reddit","g":"","a":"","x":"They both flew to Thailand after knowing each other one year and seven months. She brought a friend, booked separate rooms in one hotel, and planned tours so the trip also worked as a vacation. She said he could afford to let her choose the safer plan.","y":"2025"},{"r":"r5a","s":"Online to in-person","o":"good","oc":"got out","p":"Reddit","g":"","a":18,"x":"After three years of online contact, he traveled to her home area first. She later moved to him, they married, and were planning a move back toward her home state.","y":"2025"},{"r":"r5a","s":"Online to in-person","o":"mid","oc":"improving","p":"Reddit","g":"","a":"","x":"Reported four trips to see a male partner over about a year and a half. He could not yet come to Canada because of finances, limited time off in the trades, and no passport.","y":"2025"},{"r":"r5a","s":"Online to in-person","o":"mid","oc":"improving","p":"Reddit","g":"","a":"","x":"A university student abroad said she could not afford to fly to him, so he visited first and sponsors her trips during breaks. She also expected possible visa difficulty because of her passport.","y":"2025"},{"r":"r5a","s":"Online to in-person","o":"mid","oc":"improving","p":"Reddit","g":"","a":"","x":"He was about to visit her after five to six months together. In a follow-up he said their chemistry carried over in person and they were planning another trip.","y":"2025"},{"r":"r5a","s":"Online to in-person","o":"mid","oc":"improving","p":"Reddit","g":"Man","a":"","x":"He flew to meet her after four months of online conversations because he thought it felt safer for her. They made the relationship official on the second date and he planned another visit.","y":"2025"},{"r":"r5a","s":"Online to in-person","o":"mid","oc":"improving","p":"Reddit","g":"Woman","a":"","x":"Flew across the country to meet a man she had matched with while in the same town for work. They split the ticket, he covered meals there, and she had coworkers nearby as a backup. They later split flights while becoming exclusive.","y":"2024"},{"r":"r5a","s":"Online to in-person","o":"good","oc":"got out","p":"Reddit","g":"Woman","a":"","x":"Flew to meet a man she met on Reddit and stayed with him. After two years long distance she moved across the country, and they married.","y":"2025"},{"r":"r5a","s":"Online to in-person","o":"good","oc":"got out","p":"Reddit","g":"","a":19,"x":"Got a job at 19 to board a plane and meet a nevermet partner about 3,000 miles away. They said they had been married for a year.","y":"2026"},{"r":"r5a","s":"Online to in-person","o":"good","oc":"got out","p":"Reddit","g":"","a":34,"x":"A web-forum friend became a romantic connection after a decade. Neither had money to travel, then the narrator took a side trip to meet him while attending an event about two hours from his home. The later relationship ended badly.","y":"2026"},{"r":"r5a","s":"Online to in-person","o":"good","oc":"got out","p":"Reddit","g":"","a":"","x":"Met on Reddit, texted for about a month, then he came to the narrator's city. The narrator disliked his manners and felt no attraction, and they met once more before losing contact.","y":"2026"},{"r":"r5a","s":"Online to in-person","o":"mid","oc":"improving","p":"Reddit","g":"","a":"","x":"He flew to see her in July after they started talking in March. She planned later trips to see him, followed by a visit where he would fly home with her.","y":"2025"},{"r":"r5a","s":"Online to in-person","o":"good","oc":"got out","p":"Reddit","g":"","a":"","x":"After chatting online for about one and a half years, he flew to meet the narrator. She had booked a hotel near the airport with a backup room in case she felt uncomfortable, then reported later visits, engagement and marriage.","y":"2026"},{"r":"r5a","s":"Online friendship","o":"mid","oc":"improving","p":"Reddit","g":"Man","a":"","x":"She texted him after about four years while briefly in his city. They renewed daily-life messages and good-morning texts, though he was unsure what the renewed connection meant.","y":"2024"},{"r":"r5a","s":"Online friendship","o":"mid","oc":"improving","p":"Reddit","g":"","a":"","x":"Sent a simple text to a close college friend after years apart. The friend replied immediately, they talked for hours by phone, and now text weekly.","y":"2025"},{"r":"r5a","s":"Online friendship","o":"mid","oc":"improving","p":"Reddit","g":"","a":"","x":"Recently reconnected with two friends. One she had not seen for 17 years visited her town for dinner. Another, not spoken to for about 15 years, lives far away and now texts regularly.","y":"2025"},{"r":"r5a","s":"Online friendship","o":"mid","oc":"improving","p":"Reddit","g":"","a":"","x":"Found a childhood best friend again after 17 years and they are close again. A separate friend read a message but never answered.","y":"2025"},{"r":"r5a","s":"Online friendship","o":"mid","oc":"improving","p":"Reddit","g":"Man","a":"","x":"After earlier attempts got no reply or interest, an old friend contacted him unexpectedly. They had a great conversation, including the same friend he had reached out to more than two years before.","y":"2025"},{"r":"r5a","s":"Online to in-person","o":"good","oc":"got out","p":"Reddit","g":"Man","a":"","x":"Texted the old housemate's number after returning to a town he had left 20 years earlier. The housemate invited him over and they picked up where they left off.","y":"2025"},{"r":"r5a","s":"Online friendship","o":"bad","oc":"still stuck","p":"Reddit","g":"Man","a":"","x":"Texted an old friend after years without contact. The friend was hurt about the long gap and told him to go away, ending the friendship.","y":"2025"},{"r":"r5a","s":"Online friendship","o":"bad","oc":"still stuck","p":"Reddit","g":"Man","a":"","x":"Missed the friend, but got only two replies before being left on read. He said the lack of reciprocity hurt.","y":"2025"},{"r":"r5a","s":"Online friendship","o":"mid","oc":"improving","p":"Reddit","g":"Man","a":"","x":"Several friendships took 10 to 15 years to reconnect. They now text regularly enough and meet every three to five years. The initial reconnect was awkward but welcomed.","y":"2025"},{"r":"r5a","s":"Online friendship","o":"mid","oc":"improving","p":"Reddit","g":"Man","a":"","x":"Reached out and now has what he calls a true friend, with weekly contact.","y":"2025"},{"r":"r5a","s":"Online friendship","o":"mid","oc":"improving","p":"Reddit","g":"","a":"","x":"A couple of friends reached out after behaving poorly, apologized, and started hanging out again. The author was pleasantly surprised.","y":"2025"},{"r":"r5a","s":"Lonely","o":"bad","oc":"still stuck","p":"Reddit","g":"","a":"","x":"Said repeated outreach ended in ghosting, ignored messages, rude responses, and uncertainty about what went wrong, so they stopped trying.","y":"2025"},{"r":"r5b","s":"Limerence","o":"advice","oc":"advice only","p":"Articles and essays","g":"Man","a":"","x":"Tom Bellamy, neuroscientist and limerence writer, ran a Pollfish survey of US and UK adults. He reads it as most people having felt limerence at some point, about a third as full person addiction, and anxious people far more often. He warns most starters quit the survey, so the sample is self-selected. \"about 50-60% of the general population has experienced\"","y":"2024"},{"r":"r5b","s":"Limerence","o":"advice","oc":"advice only","p":"Articles and essays","g":"Man","a":"","x":"Marios Georgiou, counselling psychology doctoral researcher who has worked with limerent clients for three years, puts the average episode at 1.5 to 3 years and says it often lands on people in a gap or transition in life. \"limerence tends to co-occur with uncertain life transition, loneliness\"","y":"2024"},{"r":"r5b","s":"Older men switch","o":"advice","oc":"advice only","p":"Articles and essays","g":"Man","a":"","x":"Sociologist Nicholas Wolfinger argues the big single gap between young men and women is partly an age effect, since women under 30 often date men a bit older, and counting men up to 32 shrinks the gap. \"many women in the 18-29 age group are dating men outside the group\"","y":"2023"},{"r":"r5b","s":"Older men switch","o":"advice","oc":"advice only","p":"Articles and essays","g":"Man","a":"","x":"Justin Lehmiller, co-author of the 2008 age-gap study, says women who were much older than their partners were the most satisfied, despite strong social disapproval of woman-older couples. Older than 2023, kept because he is the study author. \"According to my own research on this topic, they most certainly can.\"","y":"2019"},{"r":"r5b","s":"Limerence","o":"bad","oc":"still stuck","p":"YouTube","g":"","a":"","x":"Fixer pattern. He left a healthy relationship and spent years driving his boss, his limerent object, around and buying her gifts with almost nothing back, she refused all physical contact. \"I would be her doormat so long as she was comfortable walking on me\". How it ended: years of this wore thin and he changed jobs, then formed a new bond with a kinder coworker, so the pattern moved to a new person.","y":"2025"},{"r":"r5b","s":"Limerence","o":"mid","oc":"improving","p":"YouTube","g":"","a":"","x":"Confession case. A close, ambiguous friendship, he told her how he felt and \"She told me that it was not the right time\". Timeline 20 days. They agreed on no contact, then she wrote to him 4 times in the next 2 weeks. He explained again that he needed distance. What is getting him out: no contact. Later contact: her messages kept restarting it. He hopes to keep a sincere friendship later.","y":"2026"},{"r":"r5b","s":"Limerence","o":"bad","oc":"still stuck","p":"YouTube","g":"","a":"","x":"Confession then friends answer. He told her he had feelings, she was not available, \"She said we could continue to be friends and I tried\". Staying friends failed, he told her he was going crazy thinking about her and needed space. She was the one who told him about limerence and suggested therapy. What helped: telling her and taking space, but it is still hard.","y":"2026"},{"r":"r5b","s":"Limerence","o":"good","oc":"got out","p":"YouTube","g":"","a":"","x":"Timeline 18 months of a limerent on and off relationship with a woman who was sleeping with many other guys. How it ended: he left. What got him out: time and distance, \"time away has changed things\". He now has no feelings for her either way. No later contact mentioned.","y":"2025"},{"r":"r5b","s":"Push-pull switch","o":"bad","oc":"still stuck","p":"YouTube","g":"","a":"","x":"A short relationship, then 2 years of being friends who still sleep together now and then. He does not idolize her and knows she would not be good for him, yet he is still obsessed and thinks about her constantly. Nothing has got him out yet, the ongoing contact keeps it alive.","y":"2025"},{"r":"r5b","s":"Limerence","o":"bad","oc":"still stuck","p":"YouTube","g":"","a":"","x":"She invites him to her apartment to study and he stays over, they used to share a bed, now separate beds. They kissed once and it was forgotten. He told her he is in love with her, it was not returned, \"I have already distanced myself from her because it was not reciprocated\", but she keeps seeking him out. Later contact: she keeps reaching out, he is unsure what to do.","y":"2024"},{"r":"r5b","s":"Push-pull switch","o":"good","oc":"got out","p":"YouTube","g":"","a":"","x":"Block and unblock case. After something sketchy he backed off, she blocked and unadded him and turned off her location for days, then said she could not be there for him. He said okay and wished her well. She then texted asking if they could still be friends with benefits. He did not reply, and 5 weeks later she said she was in a relationship. What got him out: not replying.","y":"2026"},{"r":"r5b","s":"Push-pull switch","o":"mid","oc":"improving","p":"YouTube","g":"","a":"","x":"Block and unblock case. During his no contact she unblocked him only to message that she hated him, would never forgive him and that he destroyed the relationship, then blocked him on everything again. It wrecked his whole day. He is not going to answer. What is helping: no contact.","y":"2025"},{"r":"r5b","s":"Push-pull switch","o":"mid","oc":"improving","p":"YouTube","g":"","a":"","x":"Timeline 3 years together. She had cheated before and he took her back. Since the breakup 2 months ago he did not answer her birthday message to him and blocked her on every social media. She still texts him saying how happy she is without him. What is getting him out: blocking and not answering.","y":"2026"},{"r":"r5b","s":"Push-pull switch","o":"bad","oc":"still stuck","p":"YouTube","g":"","a":"","x":"Friends answer case. She sent good morning messages, asked about his day, said yes to every hangout, invited him out herself, hours one on one with heart emojis, then \"today she said it's just friendly and shot me down\". He feels he is not built for dating. No way out named yet.","y":"2025"},{"r":"r5b","s":"Push-pull switch","o":"bad","oc":"still stuck","p":"YouTube","g":"","a":"","x":"Friends answer case. A woman from a dating app left him breadcrumbs, and when he thought they were finally going on a date \"she said she wanted to stay friends\", saying she was going through something and wanted to do it alone. He says it shattered his idea of what love is like.","y":"2025"},{"r":"r5b","s":"Push-pull switch","o":"bad","oc":"still stuck","p":"YouTube","g":"","a":39,"x":"Block case. Aged 39, talked with a woman for a couple of months, a few great dates, lots in common. Then one morning she texted that she was not ready for a relationship, ghosted him and blocked him on every platform. Over a month later he is still tearful and misses her every day. Got out: not yet.","y":"2026"},{"r":"r5b","s":"Limerence","o":"mid","oc":"improving","p":"YouTube","g":"","a":"","x":"Confession case. He had feelings for a woman friend for about 30 years. About a year ago he told her he had been in love with her since first sight and that he was \"breaking up\" with her, a joke since they were never together. What got him out: deciding to stop for his own self-respect. Later contact: they remain friends, nothing more. \"pursuing the real and available\".","y":"2025"},{"r":"r5b","s":"Push-pull switch","o":"mid","oc":"improving","p":"YouTube","g":"","a":"","x":"Two years with a girlfriend he calls dismissive avoidant, endless moods, pull aways, gaslighting and fault finding, and he only gets anxious with her. He went no contact for 10 to 12 days and says they should not talk again unless they get a therapist or coaching on communication. What is helping: no contact.","y":"2024"},{"r":"r5b","s":"Limerence","o":"mid","oc":"improving","p":"YouTube","g":"","a":"","x":"Rule: \"anyone who really excites me and causes me to hyper focus is not healthy\", so they run. Warning sign named: instant intense excitement. They say they are drawn to emotionally unavailable people because that is what they grew up with, and that healthy available people feel uncomfortable.","y":"2026"},{"r":"r5b","s":"Limerence","o":"mid","oc":"improving","p":"YouTube","g":"","a":"","x":"He says the problem is being \"obsessed with her desire for me\" more than with her, and the relationship is impossible. Rule chosen: cut off all contact and let it fade.","y":"2026"},{"r":"r5b","s":"Limerence","o":"good","oc":"got out","p":"YouTube","g":"","a":"","x":"Limerent for a coworker they sat next to for 10 months. \"It took me 4 years to recover\". What worked: no contact, then one day it was simply over. Rule: no contact and time.","y":"2025"},{"r":"r5b","s":"Limerence","o":"mid","oc":"improving","p":"YouTube","g":"Woman","a":"","x":"Her own history of romantic obsession. 3 years ago she met a man who ticked every box, he was honest that he was not available. When he stopped texting back she removed him from her contacts so she could not reach out. Rule: take away the temptation to message. They ran into each other 8 months later through mutual friends, and she had used the time to build herself up.","y":"2026"},{"r":"r5b","s":"Limerence","o":"good","oc":"got out","p":"YouTube","g":"","a":"","x":"Spent 20 years falling obsessively for people who were only being nice. Breakthrough: \"other people are not puppets or chess pieces I can move around\". Warning sign: reading niceness as love. When the therapist missed the point, they got a better therapist.","y":"2023"},{"r":"r5b","s":"Limerence","o":"good","oc":"got out","p":"YouTube","g":"","a":"","x":"Warning sign learned the hard way: disclosing to a coworker who did not feel the same. She was very uncomfortable, went to HR, filed a protection order and a judge upheld it. He is now free of limerence but lives with guilt, shame and what he calls PTSD from it.","y":"2026"},{"r":"r5b","s":"Advice","o":"advice","oc":"advice only","p":"YouTube","g":"","a":"","x":"Rule: stop long text chats, have about a 20 minute conversation after getting her number, then ask for the date. If she says no or ignores it, \"delete her number and move onto the next girl\".","y":"2024"},{"r":"r5b","s":"Limerence","o":"mid","oc":"improving","p":"YouTube","g":"","a":"","x":"Fell for a female coworker a year ago, it has happened only twice in his life. Rules he now keeps: \"No wild texts\", proper boundaries when she replies slowly, separating his feelings from reality and going very slowly despite intrusive thoughts. She may not feel the same.","y":"2024"},{"r":"r5b","s":"Limerence","o":"mid","oc":"improving","p":"YouTube","g":"","a":"","x":"His partner ended their engagement and moved out 3 weeks earlier, saying they both had healing to do, and she did not leave the door open. After weeks of no contact he saw his own anxious attachment for the first time and is starting to work on it. Rule: no contact and self-work.","y":"2025"},{"r":"r5b","s":"Limerence","o":"mid","oc":"improving","p":"YouTube","g":"","a":"","x":"Warning sign he names: mistaking ordinary kindness for special interest. She was the only one who let him be vulnerable, but \"Whatever she gave was not special treatment\", she treated everyone that way. He calls it his delusion painting what could have been.","y":"2025"},{"r":"r5b","s":"Limerence","o":"mid","oc":"improving","p":"YouTube","g":"","a":"","x":"Married and loves his wife, but after one glimpse of a woman he spent about 7 months limerent and \"I was about to throw away everything I built for a fantasy\". Finding a name for it stopped him. Rule: see it as fantasy, not love.","y":"2025"},{"r":"r5b","s":"Limerence","o":"good","oc":"got out","p":"YouTube","g":"","a":"","x":"He walked away from a woman who treated him like an option, the final blow was being friend-zoned. \"I've managed to stay strong and have not heard from her in two months\". Rule: leave when you are treated as an option.","y":"2025"},{"r":"r5b","s":"Limerence","o":"mid","oc":"improving","p":"YouTube","g":"","a":"","x":"After his breakup he saw that his ex always expected him to look after her but never did the same. Rules he now applies: pull back when needed, more self-respect, value a woman without putting himself down. He says breaking that pattern gave him a stronger character.","y":"2026"},{"r":"r5b","s":"Love bomb flip","o":"bad","oc":"still stuck","p":"YouTube","g":"","a":45,"x":"Aged 45, fell for a coworker who returned it, secret making out at the office, he met her family. Reason on her side: a hidden boyfriend, she was cheating on him with this man. Then she slowly withdrew while still calling daily, and he went no contact without telling her. He has never had a real girlfriend and says she was the first person who said she loved him.","y":"2026"},{"r":"r5b","s":"Love bomb flip","o":"good","oc":"got out","p":"YouTube","g":"","a":"","x":"A woman at work treated him as an option, so he stopped answering her texts. \"Now she comes over to my desk at work all the time\", and he is no longer into her. Reason on her side as he sees it: other options, she took him for granted.","y":"2024"},{"r":"r5b","s":"Love bomb flip","o":"bad","oc":"still stuck","p":"YouTube","g":"","a":"","x":"Within about a week she went from \"no one's ever made me feel how you made me feel\" to saying they should just be friends. Reason on her side as he guesses it: she wants to be free with other guys, many guys. He says it was mutual and he liked her a lot.","y":"2026"},{"r":"r5b","s":"Love bomb flip","o":"good","oc":"got out","p":"YouTube","g":"","a":"","x":"For about a month she drove an hour to see him, bought him food and was intensely physical, then wanted to quit her job to join his planned Japan trip. He told her not to. She dumped him and went exclusive with another man the day before his birthday. Reason on her side: another guy.","y":"2026"},{"r":"r5b","s":"Love bomb flip","o":"advice","oc":"advice only","p":"YouTube","g":"Woman","a":"","x":"She is the one going hot and cold right now. Reason she gives: she wants something light and fun, \"without expectation or pressure\", while he is catching feelings, wants to see her more and uses dating words. Not trauma or games, she says, the coldness comes from discomfort with his pace.","y":"2026"},{"r":"r5b","s":"Love bomb flip","o":"mid","oc":"improving","p":"YouTube","g":"","a":"","x":"He gave a woman lots of help and attention, then burned out and said he needed rest. She answered with guilt trips, control and comparisons to her idea of the best boyfriend. Reason on her side as he saw it: losing the attention. He hit a hard pause, met her months later, she acted as if nothing happened. He is \"standing my ground, protecting my worth\".","y":"2025"},{"r":"r5b","s":"Love bomb flip","o":"good","oc":"got out","p":"YouTube","g":"","a":"","x":"He dated a woman who treated him as a backup and stayed because he was lonely. She dumped him and he felt relieved. Reason on her side: he was the backup option. About two years later she contacted him wanting to get back together and he said no, he had fully moved on.","y":"2025"},{"r":"r5b","s":"No then yes","o":"good","oc":"got out","p":"YouTube","g":"","a":21,"x":"At 21 he fell for a 19-year-old female friend, told her, she did not return it. He stayed friends instead of leaving. A year later the friendship turned into a relationship and a year after that they married. After 33 years of marriage, with 3 children, she ended it and they divorced. He says he would not change it.","y":"2026"},{"r":"r5b","s":"No then yes","o":"good","oc":"got out","p":"YouTube","g":"","a":"","x":"He finally got out of the friend zone after 8 or 9 years of pursuit, and once they were together \"the flame burned out instantly\". He says lusting after someone that long does not prepare you for a healthy relationship.","y":"2023"},{"r":"r5b","s":"No then yes","o":"mid","oc":"improving","p":"YouTube","g":"","a":"","x":"An introvert, a friend to her for over 9 years. He watched the video several times for courage, told her how he felt expecting rejection, and \"she gave me a green light\". Their talks have turned romantic. Too early to know how it lasts.","y":"2023"},{"r":"r5b","s":"No then yes","o":"good","oc":"got out","p":"YouTube","g":"","a":"","x":"Two months earlier he was sure she was not into him and was deep in limerence. With his friends' help he told her how he felt and that they should date, and she felt the same. They are together now. Advice: \"Get help from your friends\" and be brave.","y":"2026"},{"r":"r5b","s":"Long watcher","o":"bad","oc":"still stuck","p":"YouTube","g":"Woman","a":"","x":"He wanted to meet immediately, she could not that day, the chat cooled and both stopped texting. \"We follow each other for 2 years now. Not a single move.\" He sometimes hides his stories from her and she keeps watching his. She says she is afraid of rejection, so nobody messages.","y":"2024"},{"r":"r5b","s":"Long watcher","o":"mid","oc":"improving","p":"YouTube","g":"","a":"","x":"His ex and another woman who ditched him, both now married, watch all his stories. He is just working on himself, and \"one of them just messaged me saying she is proud of me\". The watcher finally messaged, but only with praise, no move.","y":"2024"},{"r":"r5b","s":"Long watcher","o":"bad","oc":"still stuck","p":"YouTube","g":"","a":"","x":"They reconnected, she said r5b","s":"Push-pull switch","o":"mid","oc":"improving","p":"YouTube","g":"","a":"","x":"Seven years with a woman who was terrible to be with, \"great highs, but by god did I pay for them with the lows\". He left permanently a year ago and still misses her daily. He links it to a cruel mother and a hyper-critical father. Nothing boring here yet, he is still in the after phase.","y":"2026"},{"r":"r5b","s":"Found partner","o":"good","oc":"got out","p":"YouTube","g":"","a":"","x":"First serious and most stable relationship of their life, the first time love is not one-sided. \"I've never chased any high since I've known her because it's so consistent.\" What felt boring is not named, the steadiness itself replaced the chase. Lasting so far, they say they will never let go.","y":"2023"},{"r":"r5b","s":"Found partner","o":"mid","oc":"improving","p":"YouTube","g":"","a":"","x":"After a short but damaging abusive relationship over 2 years ago they spent a year healing. The current relationship was all green flags but old anxiety kept rising. What helped: learning to stay calm and read their own thoughts. Lasting so far, still together.","y":"2025"},{"r":"r5b","s":"Push-pull switch","o":"good","oc":"got out","p":"YouTube","g":"","a":"","x":"Fixer story. He saw his ex as a scared bird with a broken wing, \"I wanted to fix her wing make her safe and let her fly\". Once she was healthy again her anger came out at him. Lesson: rescuing is not a base for a relationship.","y":"2026"},{"r":"r5b","s":"Push-pull switch","o":"good","oc":"got out","p":"YouTube","g":"","a":"","x":"He dated a 22-year-old single mother with heavy trauma. Intense at first, then intimacy faded and she was exhausted by motherhood. \"10/10 experience but I stayed too long\". Chaos at the start, then the drop, he left late.","y":"2026"},{"r":"r5b","s":"Found partner","o":"good","oc":"got out","p":"YouTube","g":"","a":"","x":"He credits a woman who was \"consistent since day one\" with no mind games for his PhD, a business, more income and a good circle. His rule: if a woman plays hot and cold or confused games when you are clear, put one foot out the door. Lasting: shown as a long relationship.","y":"2026"},{"r":"r5b","s":"Advice","o":"good","oc":"got out","p":"YouTube","g":"","a":"","x":"Just left an 8 month relationship. \"There was nothing technically wrong with him\", but she was bored, long trips with barely any conversation. She told herself it was comfortable introvert silence, then admitted it was not. Here boring meant no real connection, not calm, and it did not last.","y":"2026"},{"r":"r5b","s":"Late bloomer","o":"mid","oc":"improving","p":"YouTube","g":"","a":"","x":"First-girlfriend age: mid 20s. One limerent object for 6 years, then others, and the last was his first relationship. He got over his fear of intimacy, \"Lost my virginity in my mid 20s, long been an insecurity of mine\". Three weeks after the breakup he is working on himself and less anxious outside the house.","y":"2026"},{"r":"r5b","s":"Late bloomer","o":"good","oc":"got out","p":"YouTube","g":"","a":"","x":"First-girlfriend age: 25. \"I had my first girlfriend at 25\", after thinking he would never be in a relationship. He gives the credit to his best friend acting as wingman.","y":"2024"},{"r":"r5b","s":"Late bloomer","o":"good","oc":"got out","p":"YouTube","g":"","a":"","x":"First-girlfriend age: started dating at 27. \"Now at 31 i have a son and an awesome girlfriend\". He felt very insecure while single.","y":"2025"},{"r":"r5b","s":"Late bloomer","o":"good","oc":"got out","p":"YouTube","g":"","a":"","x":"First-girlfriend age: 27. \"My first girlfriend was at 27 and now we are engaged.\" Myth he dropped: that lack of experience matters, he says it does not.","y":"2023"},{"r":"r5b","s":"Late bloomer","o":"mid","oc":"improving","p":"YouTube","g":"","a":"","x":"Myth: I will be happy when I have a girlfriend. He admits he lived by it, and his first relationship felt like it validated his existence. He says the mindset spreads into every part of life.","y":"2023"},{"r":"r5b","s":"Late bloomer","o":"mid","oc":"improving","p":"YouTube","g":"","a":"","x":"Myth: treat her like a queen and she will stay. His first proper long relationship lasted nearly a year, then she stopped replying for 3 days and sent a breakup email saying \"she hated the way I was so nice to her\", that he treated her like a queen and like glass. It left him with anxious attachment.","y":"2024"},{"r":"r5b","s":"Late bloomer","o":"good","oc":"got out","p":"YouTube","g":"","a":"","x":"First-girlfriend age: 25. He \"had my first girlfriend at 25\" while at community college, living with his parents and never kissed. She was 18 and far ahead of him in experience and independence. His point: people reach milestones at different ages.","y":"2025"},{"r":"r5b","s":"Late bloomer","o":"bad","oc":"still stuck","p":"YouTube","g":"Man","a":31,"x":"Aged 31, never dated, never held hands or been kissed or complimented. He keeps his eyes open but feels it may be too late. No first-girlfriend age yet.","y":"2023"},{"r":"r5b","s":"Advice","o":"advice","oc":"advice only","p":"YouTube","g":"Man","a":"","x":"Dr Tom Bellamy. His main cure for limerence is a purposeful life, not hunting for meaning in one person or one job. \"see being purposeful as the primary goal of a good life\".","y":"2025"},{"r":"r5b","s":"Advice","o":"advice","oc":"advice only","p":"YouTube","g":"Man","a":"","x":"Patrick Teahan, therapist. Frames limerence as \"a carrying over symptom of poor attachment in childhood\", and says inner work can burst the bubble faster. Older than the window, kept because his video drew several recovery stories used here.","y":"2023"},{"r":"r5b","s":"Advice","o":"advice","oc":"advice only","p":"YouTube","g":"Man","a":"","x":"Casey Zander. On a woman going hot and cold: often \"this is a woman who is dealing with multiple men\" and her interest is lower than yours. His advice is to match her and keep moving dation, and when she stopped starting chats he did not notice for months. Rule: count who initiates.'","y":"2024"},{"r":"r5b","s":"Ex reconnect","o":"good","oc":"got out","p":"Forums","g":"Man","a":"","x":"A school-era on and off girlfriend: they reconnected right after college as adults, went on a few dates, and he had zero interest left and walked away. His college girlfriend of 3 years was harder, he pursued her for 3 years after the breakup, almost got back together a few times, then she made it clear she was not interested. He went no contact and it took about 10 years for the feelings to fade fully. Led to: school-era ex one talk and closure, adult ex closure without her. J9 too, a later summer love asked to visit a year into his relationship, he said no and \"I have questioned that decision for 25 years now\".'","y":"2024"},{"r":"r5b","s":"Ex closure","o":"bad","oc":"still stuck","p":"Forums","g":"Man","a":"","x":"J8 without closure. At 18 in college, a 10 week romance full of long talks, then she said \"I can't see you any more\" and would not even say hi on campus. He never learned why. 55 years later it still haunts him, and the article on first love helped him see why. Shows what no explanation can do.'","y":"2024"},{"r":"r5b","s":"Ex reconnect","o":"mid","oc":"improving","p":"Forums","g":"Woman","a":"","x":"J3 he faded, adult part only. They had been friends and wrote letters when she went to university, she cut contact when she got engaged. \"More than 20 years later he emailed me\" after finding her on social media. Intense flirty emails, a few drinks, one hotel meeting that went badly, then he withdrew to friendly emails. Both had partners, he has been with someone for almost 10 years. His wedding news pushed her to end contact. Two weeks into no contact and miserable but sure it is right.'","y":"2025"},{"r":"r5b","s":"Push-pull switch","o":"mid","oc":"improving","p":"Forums","g":"Woman","a":"","x":"In her forties she has just begun a relationship with \"someone who actually likes me back\", a first for her. Before that her ex-husband liked her only for what she did for him and the men she liked ran away. What felt different: she is still on a roller coaster of feelings, but calls the last crush a warm-up that taught her to manage emotions. Too new to say if it lasts.'","y":"2024"},{"r":"r5b","s":"Push-pull switch","o":"mid","oc":"improving","p":"Forums","g":"Woman","a":"","x":"She picked a man from a dating app who was not her usual type, his photo was only cute. Attraction grew in person because he was excellent at communicating and following through, and within 4 to 5 weeks he said he wanted to court her for marriage. \"I don't value the first-glance attraction as much as I used to\". He later had to pause things for his work, which hurt, but she keeps the lesson about steady men.'","y":"2025"},{"r":"r5b","s":"Older men switch","o":"good","oc":"got out","p":"Articles and essays","g":"Woman","a":36,"x":"She spent her whole 20s dating men 15 to 20 years older, looking for a \"big bear\" figure, \"someone who was going to tell me what to do\". Reasons she gives: wanting to be guided and saved, plus a workplace culture where older men held power. Where she ended: the bubble popped, she now dates a man 7 years younger. She asked her Instagram followers and found women mostly remember relationships with older men badly while men remember older women fondly.'","y":"2026"},{"r":"r5b","s":"Older men switch","o":"good","oc":"got out","p":"Articles and essays","g":"Woman","a":22,"x":"Writer. Her side. At 22 she dated a recently divorced father in his thirties from Hinge. Reasons then: she felt \"convinced I was really mature for my age\", he flattered that. He talked about his good job, house and car, she sat in the role he gave her and now thinks he dated her to feel better about himself. At 25 he messaged \"Don't ignore me\" and she laughed and deleted his number. Where she ended: not against an older man who truly fits, but advises young women to be the age they are.'","y":"2025"},{"r":"r5b","s":"Older men switch","o":"mid","oc":"improving","p":"Articles and essays","g":"Woman","a":21,"x":"A reader, 21, recently broke up with a 34 year old she met on Bumble. Reasons she liked him: more in common than guys her age. Problems: friends and family saw the gap as a red flag, and they argued whenever she went out with friends, which he called being protective. Where she ended: broken up and unsure, still missing him.'","y":"2025"},{"r":"r5b","s":"Older men switch","o":"good","oc":"got out","p":"Articles and essays","g":"Woman","a":26,"x":"Her side, first person essay, date not shown on page. After her 25 year old boyfriend cheated, friends all said she needed an older man. At 26 she dated a man in his mid 40s for a summer, he looked after her and everyone's parents loved him, but his caution irritated her. Reason it ended: at 26 she was not ready to settle and he would want that soon. She ended it herself and sees him around town with no regret.'","y":""},{"r":"r5b","s":"Older men switch","o":"mid","oc":"improving","p":"Forums","g":"Woman","a":29,"x":"She met him at 25 when he was 40 and has now stepped away at 29. Only after leaving did it strike her that he could have a child her age. He was much older in attitude, music taste and so on, though it never felt weird while together. Where she ended: out of it and reconsidering.'","y":"2025"},{"r":"r5b","s":"Older men switch","o":"good","oc":"got out","p":"Forums","g":"Woman","a":"","x":"She was 20, he was 34, together a couple of years on and off. She says the age was not the issue, \"it worked because of chemistry\". Where she ended: she called it off when she met her now husband.'","y":"2025"},{"r":"r5b","s":"Older men switch","o":"good","oc":"got out","p":"Forums","g":"Woman","a":"","x":"Her side, stayed with the older man. \"I met DH at 22 he was 30\" and they have been married 26 years. He was more financially secure than her at the start but never made it an issue, they pooled what they had.'","y":"2025"},{"r":"r5b","s":"Older men switch","o":"good","oc":"got out","p":"Forums","g":"Woman","a":21,"x":"Her side, stayed. She was nearly 21, he had just turned 33. They met online, he had set his filter to 25 and over and she found him. She already had a child and her own flat and says a hard childhood made her old beyond her years. Annoyed when people assume she is a victim, still together.'","y":"2024"},{"r":"r5b","s":"Advice","o":"bad","oc":"still stuck","p":"Articles and essays","g":"Woman","a":"","x":"Rule she set after a confession cost her a friend in college: \"never tell a guy I like him unless he tells me first\". Now in her 20s an old friend from school years reconnected as an adult, daily calls and a great weekend visit, but he asks her advice on a girl from a dating app. Warning sign she half sees: a man who likes you would not ask that. The columnist told her to make a move or take a break and reset.'","y":"2024"},{"r":"r5b","s":"Ex reconnect","o":"bad","oc":"still stuck","p":"Articles and essays","g":"Woman","a":40,"x":"J3 FWB or hookup, then situationship. Adult friends for two decades, he confessed late, they jumped into an undefined relationship, a phone fight and her move ended it. After a few years apart they mended things, \"mired with a hookup almost instantly\". His friends said he wanted to marry her but he only hinted when drunk and told her not to move back for him. Both now married with kids and she still does not want to cut him out.'","y":"2025"},{"r":"r5b","s":"Ex came back","o":"bad","oc":"still stuck","p":"Forums","g":"Man","a":"","x":"Just before the window, kept for the pattern. In one year several women he used to have a thing with texted him \"out of nowhere after 6 months to a year of no contact\", apologizing or asking how he was, then stopped replying once he answered. Led to: she faded again, each time. Replies said they were bored, lonely or guilty in that ,"a":"","x":"Writer calling herself a reformed chaos addict. She was drawn to breadcrumbing men and love bombers, and \"pushed away the healthy ones because it didn't feel chaotic enough\". What changed: self worth work and boundaries so she no longer needs someone to complete her. No long relationship outcome given.'","y":"2025"},{"r":"r5b","s":"No then yes","o":"good","oc":"got out","p":"Hacker News","g":"Man","a":"","x":"Set up through a long chain of acquaintances. After one short date she told a friend she was never going out with him again. \"Didn't work out the way she thought though\", she became his wife. Time between the no and the yes not stated, nothing about a friendship in between.'","y":"2024"},{"r":"r5b","s":"Late bloomer","o":"good","oc":"got out","p":"Hacker News","g":"Man","a":"","x":"What worked online for a self described average looking guy, OKCupid. Average looks in his own view, \"not particularly attractive\". His now wife messaged him first. What worked: opening messages that picked up something specific from her profile instead of hey, and a written list of deal breakers, must haves and do not cares, which mattered more as self knowledge than as a list. Married.'","y":"2024"},{"r":"r5b","s":"Late bloomer","o":"good","oc":"got out","p":"Hacker News","g":"Man","a":"","x":"Myth dropped: that it has to start with instant attraction. He met her helping at a friend's drama class, it was easy to talk, \"I wasn't actually attracted to her at first\", they stayed around each other and are together nearly 25 years. He calls himself bad at dating and flirting and was invisible next to friends who were magnets.'","y":"2024"},{"r":"r5b","s":"Advice","o":"advice","oc":"advice only","p":"Forums","g":"","a":"","x":"Rule. \"Anything other than a yes needs to be taken as a NO\", and lines like not wanting a relationship right now are a kind no. Then decide honestly if you can stay friends within her boundaries or walk away, never ask again or pester, she knows you like her and can come to you if she changes her mind.'","y":"2024"},{"r":"r5b","s":"Late bloomer","o":"good","oc":"got out","p":"Forums","g":"Man","a":"","x":"What made a plain guy attractive, in his words. Big nose, scrawny, weak chin, bad hairline, yet he always dated above his league. His answer: he just made friends and met their friends, and \"Women are the best wingmen\", a female friend vouched for him to two long term girlfriends. He was friends with his wife for a decade before a spark. Key skills he names: reading social cues and letting people open up layer by layer, and never making friends just to get laid.'","y":"2024"},{"r":"r5b","s":"Ex reconnect","o":"good","oc":"got out","p":"Forums","g":"Woman","a":"","x":"J5 school-era ex, adult part only. They broke up when he left for college. Before they got back together they tried to be just friends \"and that didn't work at all\". They got back together and she is now married to him. Her view: they are best friends but could never be just friends. She also warns that dating a friend is no guarantee, she knows plenty who broke up after.'","y":"2024"},{"r":"r5b","s":"Advice","o":"advice","oc":"advice only","p":"Forums","g":"Woman","a":"","x":"Myth quiet guys believe, from her side. At a college reunion two old male friends admitted they had feelings for her in college but never said a word. She assumed then that men only wanted the beauty queens, and says if they had said something \"I probably would have accepted in a heartbeat\". More than a decade later all are married. One reply summed it up as if he wanted to, he would.'","y":"2025"},{"r":"r5b","s":"No then yes","o":"good","oc":"got out","p":"Articles and essays","g":"Woman","a":"","x":"A friend of her ex had a crush on her for about eight years. Three years after her breakup he messaged and she turned him down several times. Two more years later they crossed paths, he asked one last time and she said yes. Time between the first no and the yes about two years. What changed: his persistence and sweet words. It went fast, then after two weeks his replies slowed, he ghosted, came back a month later as if nothing happened, \"All I saw were red flags\". She stopped replying and that was the end, no friendship left.'","y":"2024"},{"r":"r5b","s":"Ex closure","o":"mid","oc":"improving","p":"Articles and essays","g":"","a":"","x":"Queer writer looking back one year after being dumped, their first relationship after four years of recovering from an earlier big breakup. What worked: therapy, grieving for months, taking the other person's coldness at face value, and a firm rule of \"Not allowing anyway for them to circle back\". About a year in they still believe in partnership and are working out what they want. No contact from the ex is described.'","y":"2025"},{"r":"r5b","s":"Limerence","o":"good","oc":"got out","p":"Forums","g":"Man","a":"","x":"Two Tinder dates, then she said she saw him as a really good friend. For six months he fixed her problems and paid for outings and gifts while she dated other men and told him how bad they were. He read her texts as chances. It ended when a video about not chasing hit him and he stopped. What got him out: seeing the truth, then gym, friends and family. \"It was an expensive lesson\". No later contact described. Replies said the moment she friendzoned him he should have stopped all contact.'","y":"2024"},{"r":"r5b","s":"Ex came back","o":"good","oc":"got out","p":"Forums","g":"Man","a":"","x":"Three months after she dumped him by text and called him creepy for his apology flowers, she messaged at year end to say sorry and that \"she wants to thank me for all the time we spent together\". He had moved on with gym and new job offers, sent one short thanks and she liked it instantly. Led to: one talk and closure. Replies guessed holiday loneliness, one said her New Years plans fell through.'","y":"2023"},{"r":"r5b","s":"Ex came back","o":"mid","oc":"improving","p":"Forums","g":"Man","a":"","x":"Close match. Met a woman visiting his city, on and off messaging, she invited him to stay with her, he could not go, months later she broke it off and blocked his number. Months after that she messaged him on another app and for about a year hinted at meeting. She then said she was coming to his city alone, went silent, and when he called from another number she brushed him off. \"I get angry and ask her not to message me again\". What got him out: seeing the pattern, a friend backing him. Year inferred, Blind shows Mar 21 with no year for the current year.'","y":"2026"},{"r":"r5b","s":"Ex came back","o":"advice","oc":"advice only","p":"Forums","g":"","a":"","x":"An ex texted on her own wedding day, \"Thank you for everything. You helped me get here.\" Time apart not stated, she had a new partner. Why she came back, per replies: closing a chapter and thanking people who shaped her, or a last look before the door shuts. Led to: one message, the advice was not to reply.'","y":"2025"},{"r":"r5b","s":"Ex closure","o":"bad","oc":"still stuck","p":"Forums","g":"Man","a":"","x":"A two year relationship ended in 2014 when he was about 25. Now married with two kids, he still thinks of her daily and has ignored two emails she sent since. His rule: \"The best course of action was to stop talking to her altogether\". Over a decade with no contact gave peace but not full closure. Replies named nostalgia for a carefree age and suggested an unsent letter. Year inferred, Blind shows Feb 27 with no year for the current year.'","y":"2026"},{"r":"r5b","s":"Thai friendly","o":"bad","oc":"still stuck","p":"App reviews","g":"","a":"","x":"Sex worker or money-seeking. Two-star reviewer (review id 14270646270) likes the app but says \"soooo many people on here that are there trying to sell sexual services\" and asks for better reporting.","y":"2026"},{"r":"r5b","s":"Thai friendly","o":"good","oc":"got out","p":"App reviews","g":"","a":"","x":"Scam, crypto. Reviewer (id 12 ry clearly.","y":"2026"},{"r":"r5b","s":"Love bomb flip","o":"bad","oc":"still stuck","p":"Russian sites","g":"Woman","a":"","x":"Fast intense start, then quarrels, silent punishment and cycles of making up. He finally rejected her. She says she should have left at the first quarrel and was still processing it at the time of the comment.","y":"2026"},{"r":"r5b","s":"Limerence","o":"mid","oc":"improving","p":"Russian sites","g":"Man","a":30,"x":"Reader story. About 1.5 years stuck on a woman who never gave him a yes. Hot and cold: she wrote that she missed him or asked for help moving, then went silent for weeks, then invited him for a walk and mentioned a new admirer. What got him out: he stopped initiating and saw a psychologist, felt relief. Later contact: none reported.","y":"2025"},{"r":"r5b","s":"Limerence","o":"bad","oc":"still stuck","p":"Russian sites","g":"Man","a":"","x":"Commenter on the story above. He played the good guy and she used him for convenience. She never answered his declarations of love yes or no. It ended when he heard a voice message where another man called her love. About a year of no contact since, still hurts.","y":"2025"},{"r":"r5b","s":"Limerence","o":"bad","oc":"still stuck","p":"Russian sites","g":"Man","a":30,"x":"Letter to the therapist column. She was cold from the start, answered gifts with a flat thanks, rarely made plans. After he kissed her she wrote she saw him only as a friend, he kept trying with more gifts and heard just a friend a second time after her birthday. He cut contact but still cannot let go.","y":"2024"},{"r":"r5b","s":"Push-pull switch","o":"good","oc":"got out","p":"YouTube","g":"Man","a":"","x":"His first girlfriend, first relationship of his life, ran hot and cold for about 5 years. Looking back he says \"лучше бы её послал сразу как начались эти качели\" [I should have dumped her as soon as the swings started]. What got him out not stated, he frames it as wasted years.","y":"2024"},{"r":"r5b","s":"Push-pul
