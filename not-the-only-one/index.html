dit","g":"","a":"","x":"After five years, a former partner congratulated the writer on getting married and disclosed ongoing feelings. The writer thanked him, wished him well and had no further conversation.","y":"2026"},{"r":"r5b","s":"Ex reconnect","o":"good","oc":"got out","p":"Reddit","g":"","a":"","x":"They resumed texting about six years after separating, reunited a year after that and married eight years after reuniting. They were together at the post.","y":"2026"},{"r":"r5b","s":"Ex reconnect","o":"good","oc":"got out","p":"Reddit","g":"","a":"","x":"They wrote occasionally over 23 years without seeing each other, then met in 2024 and married. Continuous prior silence is not reported.","y":"2026"},{"r":"r5b","s":"Ex reconnect","o":"good","oc":"got out","p":"Reddit","g":"","a":"","x":"After a year blocked, old conversations reappeared on a new phone and the writer reached out. He wanted to see her immediately, but she had healed and decided to stay apart.","y":"2026"},{"r":"r5b","s":"Ex reconnect","o":"mid","oc":"improving","p":"Reddit","g":"","a":"","x":"Lived away from family for work and had moved for her years earlier. She reconnected, later promised to try again while still in another relationship, and would not act on it. The writer removed photos and chose to reduce contact.","y":"2026"},{"r":"r5b","s":"Ex closure","o":"good","oc":"got out","p":"Reddit","g":"Man","a":"","x":"After his divorce was finalized, kept his boundaries when his former partner continued emailing. Reports deliberately giving those messages no attention.","y":"2026"},{"r":"r5b","s":"Ex reconnect","o":"mid","oc":"improving","p":"Reddit","g":"Man","a":25,"x":"At 25 noticed his 22-year-old ex's old account reappear after more than two years and thought she had unblocked him. He followed her, she did not follow back and there was no direct contact. He wanted to be on good terms.","y":"2026"},{"r":"r5b","s":"Ex came back","o":"good","oc":"got out","p":"Reddit","g":"","a":"","x":"He would disappear for around four months and they would restart for another roughly 18 months. She eventually declined another return after the same pattern.","y":"2026"},{"r":"r5b","s":"Ex reconnect","o":"good","oc":"got out","p":"Reddit","g":"","a":"","x":"Dated twice, and both saw other people during breaks. Their third time together led to a marriage still continuing 33 years later. Length of each separation was unstated.","y":"2026"},{"r":"r5b","s":"Ex came back","o":"good","oc":"got out","p":"Reddit","g":"","a":"","x":"An ex returned a month after the breakup. The first weeks felt very good, then the same distance returned. They split again after another six months.","y":"2026"},{"r":"r5b","s":"Ex came back","o":"bad","oc":"still stuck","p":"Reddit","g":"Man","a":"","x":"After a two-year relationship, they briefly reunited after she first ended things. In hindsight he felt uneasy about getting back together after only a few days without resolving the issue, then ended the relationship himself.","y":"2026"},{"r":"r5b","s":"Ex closure","o":"good","oc":"got out","p":"Reddit","g":"","a":"","x":"The commenter recalls a first serious breakup just after university about 20 years earlier. They say the thoughts faded over time and they are not still stuck, and advise the younger poster to process feedback beyond only friends taking their side.","y":"2026"},{"r":"r5b","s":"Pattaya","o":"bad","oc":"still stuck","p":"Reddit","g":"Man","a":25,"x":"A 25-year-old New Zealander who had fully moved to Jomtien three months earlier said finding solid friends felt harder than in Bangkok.","y":"2024"},{"r":"r5b","s":"Pattaya","o":"bad","oc":"still stuck","p":"Reddit","g":"Man","a":27,"x":"A 27-year-old Brit living there almost five months struggled to find people who would be around for more than two weeks.","y":"2024"},{"r":"r5b","s":"Pattaya","o":"mid","oc":"improving","p":"Reddit","g":"Man","a":27,"x":"A 27-year-old Jomtien resident described himself as outside the party scene and expressed interest in meeting another resident. No later outcome.","y":"2024"},{"r":"r5b","s":"Pattaya","o":"advice","oc":"advice only","p":"Reddit","g":"","a":"","x":"A former resident returned for longer stays, described having had several groups of friends and said companionship improved the experience.","y":"2024"},{"r":"r5b","s":"Pattaya","o":"mid","oc":"improving","p":"Reddit","g":"Man","a":27,"x":"Has a small group of late-20s friends and says they stay long term","y":"2024"},{"r":"r5b","s":"Pattaya","o":"mid","oc":"improving","p":"Reddit","g":"","a":29,"x":"Says he is based there long term","y":"2024"},{"r":"r5b","s":"Pattaya","o":"mid","oc":"improving","p":"Reddit","g":"Man","a":36,"x":"Says he has lived there two years and suggests gym or walks","y":"2024"},{"r":"r5b","s":"Pattaya","o":"mid","oc":"improving","p":"Reddit","g":"Man","a":33,"x":"Moved from the UK 14 months earlier, says he is 33 with wife and child and struggles to meet genuine same-age friends","y":"2025"},{"r":"r5b","s":"Pattaya","o":"mid","oc":"improving","p":"Reddit","g":"Man","a":34,"x":"Says he has worked in Pattaya for four years but most local friends are retired and much older","y":"2025"},{"r":"r5b","s":"Pattaya","o":"mid","oc":"improving","p":"Reddit","g":"Man","a":36,"x":"Says he is around 36, lives locally and offers to meet while looking for people to socialize with","y":"2025"},{"r":"r5b","s":"Pattaya","o":"mid","oc":"improving","p":"Reddit","g":"","a":23,"x":"Moved into a condo and asks for closer-age friends who stay long term","y":"2025"},{"r":"r5b","s":"Pattaya","o":"mid","oc":"improving","p":"Reddit","g":"Man","a":26,"x":"Says he has lived there two years and invites OP to meet","y":"2025"},{"r":"r5b","s":"Pattaya","o":"mid","oc":"improving","p":"Reddit","g":"Man","a":23,"x":"Says he is 23 and lives in Pattaya and invites a message","y":"2025"},{"r":"r5b","s":"Pattaya","o":"mid","oc":"improving","p":"Reddit","g":"Woman","a":21,"x":"Says she moved to Thailand and plans a year lease, wants local women friends and Thai classes","y":"2026"},{"r":"r5b","s":"Pattaya","o":"mid","oc":"improving","p":"Reddit","g":"Man","a":30,"x":"Says he has lived in Pattaya and other tourism hubs for seven years and built a stable routine","y":"2026"},{"r":"r5b","s":"Pattaya","o":"mid","oc":"improving","p":"Reddit","g":"Man","a":27,"x":"Met his 26-year-old partner through a friend after a football game, says they now both live in Pattaya permanently and plan to marry","y":"2026"},{"r":"r5b","s":"Advice","o":"advice","oc":"advice only","p":"Reddit","g":"","a":34,"x":"Reports two days with a 34-year-old professional companion, then a 30,000 baht request about two weeks later which he declined","y":"2024"},{"r":"r5b","s":"Thai friendly","o":"mid","oc":"improving","p":"Reddit","g":"","a":"","x":"Says he met his fiancée on ThaiFriendly and she is now in the United States","y":"2024"},{"r":"r5b","s":"Advice","o":"mid","oc":"improving","p":"Reddit","g":"Man","a":39,"x":"Says he and his 34-year-old accountant girlfriend have been together two years and she supports him through a health scare","y":"2024"},{"r":"r5b","s":"Advice","o":"mid","oc":"improving","p":"Reddit","g":"","a":"","x":"Says a similar connection has reached a second anniversary and his partner plans to arrive in his country","y":"2024"},{"r":"r5b","s":"Thai friendly","o":"advice","oc":"advice only","p":"Reddit","g":"Man","a":45,"x":"Says he met a 34-year-old divorced business owner on TF, she refused flight money and invited him to meet","y":"2024"},{"r":"r5b","s":"Thai friendly","o":"mid","oc":"improving","p":"Reddit","g":"","a":"","x":"Says he met his wife on ThaiFriendly, she worked at a bank, they have two children and rarely have friction","y":"2024"},{"r":"r5b","s":"Thai friendly","o":"mid","oc":"improving","p":"Reddit","g":"","a":"","x":"Says he has been involved with the same divorced small-business owner for over two years, her grown children support themselves","y":"2024"},{"r":"r5b","s":"Thai friendly","o":"mid","oc":"improving","p":"Reddit","g":"Man","a":"","x":"Says he met his last three girlfriends on ThaiFriendly and his current partner has been with him five years and works in a US-company role","y":"2024"},{"r":"r5b","s":"Thai friendly","o":"advice","oc":"advice only","p":"Reddit","g":"Woman","a":"","x":"A self-identified Thai woman disputed that the situation in the thread was typical. She supplied no broader platform estimate.","y":"2025"},{"r":"r5b","s":"Thai friendly","o":"advice","oc":"advice only","p":"Reddit","g":"","a":"","x":"Suggested ThaiCupid as an alternative while acknowledging that it still requires judgment about each person.","y":"2025"},{"r":"r5b","s":"Thai friendly","o":"advice","oc":"advice only","p":"Reddit","g":"","a":"","x":"Questioned the tendency to take a fixer role in an uncertain match.","y":"2025"},{"r":"r5b","s":"Thai friendly","o":"good","oc":"got out","p":"Reddit","g":"Man","a":"","x":"Says he met a 34-year-old restaurant owner on ThaiFriendly, learned she had other partners, later money requests began and he decided to move on","y":"2025"},{"r":"r5b","s":"Thai friendly","o":"advice","oc":"advice only","p":"Reddit","g":"Woman","a":33,"x":"Thai woman says she uses Bumble and Coffee Meets Bagel for a life partner and sees many short-term visitors and sparse profiles","y":"2025"},{"r":"r5b","s":"Thai friendly","o":"advice","oc":"advice only","p":"Reddit","g":"","a":"","x":"Says he met someone on TF, spent most of a month with her, she had a regular job at Terminal 21 and the time together went well","y":"2025"},{"r":"r5b","s":"Thai friendly","o":"mid","oc":"improving","p":"Reddit","g":"","a":"","x":"Says he met his wife on ThaiFriendly, she is two years younger, owns a home and car and has a job","y":"2025"},{"r":"r5b","s":"Thai friendly","o":"mid","oc":"improving","p":"Reddit","g":"","a":"","x":"Says he is happy with the wife he met on ThaiFriendly, later says she has a bachelor degree","y":"2025"},{"r":"r5b","s":"Thai friendly","o":"good","oc":"got out","p":"Reddit","g":"","a":"","x":"Met a partner on ThaiFriendly three years earlier and reported now living together in Jomtien. She had a job at a clinic. He said it was going well.","y":"2025"},{"r":"r5b","s":"Thai friendly","o":"mid","oc":"improving","p":"Reddit","g":"Man","a":30,"x":"A 30-year-old matched with an 18-year-old working at a restaurant. They traveled for two months and continued contact. He says he provided financial support while away. Later durability unknown.","y":"2025"},{"r":"r5b","s":"Thai friendly","o":"advice","oc":"advice only","p":"Reddit","g":"Man","a":33,"x":"Reports two ThaiFriendly dates, one asked for payment upfront and he paid, another agreed to pay after","y":"2026"},{"r":"r5b","s":"Thai friendly","o":"mid","oc":"improving","p":"Reddit","g":"","a":"","x":"Says he met his current girlfriend on ThaiFriendly and they have two children together","y":"2026"},{"r":"r5b","s":"Thai friendly","o":"mid","oc":"improving","p":"Reddit","g":"","a":"","x":"Says he met his girlfriend on TF, met her family and spends time with her child","y":"2026"},{"r":"r5b","s":"Thai friendly","o":"good","oc":"got out","p":"Reddit","g":"","a":"","x":"Says he married a woman met on ThaiFriendly after knowing her for seven years, lived together in Thailand for five years and later divorced","y":"2026"},{"r":"r5b","s":"Thai friendly","o":"bad","oc":"still stuck","p":"Reddit","g":"Man","a":43,"x":"Reports three trips with a woman in her mid-30s, says she never requested transfers, noticed her often active on ThaiFriendly and states he has no proof of sex work","y":"2026"},{"r":"r5b","s":"Thai friendly","o":"good","oc":"got out","p":"Reddit","g":"Man","a":58,"x":"A 58-year-old reported a 36-year-old girlfriend he met on ThaiFriendly. He advised a video call early to establish identity. Duration unstated.","y":"2026"},{"r":"r5b","s":"Thai friendly","o":"advice","oc":"advice only","p":"Reddit","g":"","a":"","x":"A recurring tourist described unpaid companionship from the app during trips, while paying for activities and meals. No ongoing relationship reported.","y":"2026"}]}</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const V=D.voices;
const RUNN=D.runNames;
const OL={good:'Got out or met someone',mid:'Getting there',bad:'Still stuck or didn\'t',advice:'Advice'};
const OC={good:'#F4B23E',mid:'#B7A8D6',bad:'#8DB6F2',advice:'#6F7FA6'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function bubble(v){
 if(!v)return'';
 const who=[v.p, v.g, v.a?('age '+v.a):'', v.y].filter(Boolean).map(esc).join('</span><span>');
 return `<div class="bub ${v.o}"><p class="x">${esc(v.x)}</p><div class="who"><span class="o ${v.o}">${esc(v.oc?cap(v.oc):OL[v.o])}</span><span>${who}</span></div></div>`;
}
const OCL={"didn't":"Didn't meet anyone",'advice only':'Advice','improving':'Getting there','still stuck':'Still stuck','got out':'Got out','met someone':'Met someone','met in person':'Met in person','nothing':'Nothing came of it','long distance relationship':'Long distance','daily talking':'Talking daily','FWB':'Friends with benefits'};
function cap(s){return OCL[s]||s.charAt(0).toUpperCase()+s.slice(1)}
function story(s){ // s: {v:index} or {text,...}
 if(typeof s.v==='number')return bubble(V[s.v]);
 return `<div class="bub ${s.o||'advice'}"><p class="x">${esc(s.text)}</p><div class="who">${s.oc?`<span class="o ${s.o}">${esc(s.oc)}</span>`:''}${(s.meta||[]).filter(Boolean).map(m=>`<span>${esc(m)}</span>`).join('')}</div></div>`;
}
function nums(list){return `<div class="nums">${list.map(n=>`<div class="num"><div class="v ${n.c==='b'?'b':''}">${esc(n.v)}</div><div class="l">${esc(n.l)}${n.nv?'<span class="nv">not verified</span>':''}</div>${n.s?`<div class="src">${esc(n.s)}</div>`:''}</div>`).join('')}</div>`}
function bars(c){
 const max=c.max||Math.max(...c.rows.map(r=>r.value));
 return `<div class="chart"><h4>${esc(c.title)}</h4>${c.rows.map(r=>{const w=Math.max(2,r.value/max*100);const inside=w>18;return `<div class="brow"><div class="lab">${esc(r.label)}</div><div class="track"><div class="fill ${r.a?'a':''}" style="width:${w}%"></div><span class="val ${inside?'':'out'}" style="${inside?'':'left:calc('+w+'% + 8px)'}">${esc(r.display)}</span></div></div>`}).join('')}${c.src?`<div class="src">${esc(c.src)}</div>`:''}</div>`;
}
function table(c){return `<div class="chart"><h4>${esc(c.title)}</h4><table class="t"><thead><tr>${c.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${c.rows.map(r=>`<tr>${r.map((x,i)=>`<td class="${i?'n':''}">${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table>${c.src?`<div class="src">${esc(c.src)}</div>`:''}</div>`}
function split(c){const tot=c.parts.reduce((a,p)=>a+p.value,0);return `<div class="chart"><h4>${esc(c.title)}</h4><div class="split">${c.parts.map(p=>`<div style="flex:${p.value};background:${p.color}" title="${esc(p.label)}">${p.value/tot>.12?esc(p.value.toLocaleString('en')):''}</div>`).join('')}</div><ul class="key">${c.parts.map(p=>`<li><i style="background:${p.color}"></i>${esc(p.label)}, ${p.value.toLocaleString('en')}</li>`).join('')}</ul>${c.src?`<div class="src" style="margin-top:8px">${esc(c.src)}</div>`:''}</div>`}
function chart(c){if(!c)return'';return c.type==='table'?table(c):c.type==='split'?split(c):bars(c)}
function sec(id,title,inner,cls=''){return `<section id="${id}" class="${cls}" data-nav="${esc(title)}"><div class="wrap">${inner}</div></section>`}
const M=document.getElementById('main');
let html='';
// hero text
document.getElementById('heroLede').innerHTML=D.hero.lede;
document.getElementById('heroKey').innerHTML=['good','mid','bad','advice'].map(k=>`<li><i style="background:${OC[k]}"></i>${OL[k]}</li>`).join('');
// method
html+=sec('method','How we read',`<div class="col"><h2>${esc(D.method.title)}</h2>${D.method.body}</div>
 <ol class="runs">${D.method.runs.map((r,i)=>`<li><div class="k">${esc(r.k)}</div><div><div class="t">${esc(r.t)}</div><div class="d">${esc(r.d)}</div></div></li>`).join('')}</ol>
 ${chart(D.method.platforms)}<div class="col">${D.method.after||''}</div>`);
// scale
html+=sec('scale','How bad',`<div class="col"><h2>${esc(D.scale.title)}</h2>${D.scale.intro}</div>${nums(D.scale.numbers)}
 <div class="widget" id="tvn"><h4>Then and now</h4><p class="muted" style="margin:0">${esc(D.scale.thenNow.note)}</p><div class="mlab"><span>Then</span><span>Now</span></div><input type="range" min="0" max="100" value="0" step="1" aria-label="From then to now"><div id="tvnOut">${D.scale.thenNow.rows.map(x=>`<div class="tn"><div class="tl">${esc(x.label)}</div><div class="tb"><i style="width:${x.then}%"></i></div><div class="tv"><b>${x.then}%</b> <span>${esc(x.ty)}</span></div></div>`).join('')}</div><div class="src">${esc(D.scale.thenNow.src)}</div></div>
 ${D.scale.charts.map(chart).join('')}<div class="col">${D.scale.outro}</div>${chart(D.scale.outSplit)}<div class="col">${D.scale.end}</div>`);
// rules
html+=sec('rules','The rules',`<div class="col"><h2>${esc(D.rules.title)}</h2>${D.rules.intro}</div>
 <div class="widget" id="svm"><h4>The story view meter</h4><p class="muted" style="margin:0">${esc(D.rules.meter.note)}</p><input type="range" min="0" max="${D.rules.meter.steps.length-1}" value="0" aria-label="How long she has watched your stories"><div class="mlab"><span>predicts nothing</span><span>predicts a lot</span></div><div class="meter"><div class="needle"></div></div><div id="svmOut"></div></div>
 <div class="widget" id="eff"><h4>${esc(D.rules.effort.title)}</h4><p class="muted">${esc(D.rules.effort.note)}</p><div class="seg" role="group">${D.rules.effort.modes.map((m,i)=>`<button aria-pressed="${i==0}" data-i="${i}">${esc(m.label)}</button>`).join('')}</div><div id="effOut"></div></div>
 <ul class="rules">${D.rules.list.map(r=>`<li><div><div class="r">${esc(r.rule)}</div><p class="re">${esc(r.explain)}${r.nv?'<span class="nv">not verified</span>':''}</p></div><div><div class="rn">${esc(r.number)}</div>${r.story?`<p class="rs">${esc(r.story)}</p>`:''}${r.src?`<div class="src">${esc(r.src)}</div>`:''}</div></li>`).join('')}</ul>`);
// topics
html+=`<section id="topics" data-nav="By topic"><div class="wrap"><div class="col"><h2>${esc(D.topicsIntro.title)}</h2>${D.topicsIntro.body}</div></div></section>`;
D.topics.forEach(t=>{
 html+=`<section class="topic" id="t-${t.key}"><div class="wrap"><div class="col"><h3>${esc(t.title)}</h3><p class="lede">${esc(t.lede)}</p></div>${t.numbers&&t.numbers.length?nums(t.numbers):''}${(t.charts||[t.chart]).map(chart).join('')}${t.body?`<div class="col read">${t.body}</div>`:''}<div class="swipe" aria-label="Stories">${t.stories.map(story).join('')}</div></div></section>`;
});
// wild
html+=sec('wild','Wild stories',`<div class="col"><h2>${esc(D.wild.title)}</h2>${D.wild.intro}</div><div class="wall">${D.wild.list.map(story).join('')}</div>`);
// explorer
const opts=(arr)=>arr.map(([v,l])=>`<option value="${esc(v)}">${esc(l)}</option>`).join('');
const uniq=k=>[...new Set(V.map(v=>v[k]).filter(Boolean))].sort();
html+=sec('explore','All voices',`<div class="col"><h2>${esc(D.explore.title)}</h2>${D.explore.intro}</div>
<div class="ex-controls"><input id="q" type="search" placeholder="Search, for example sober, run club, ex, story" aria-label="Search stories">
<select id="fr" aria-label="Round"><option value="">All rounds</option>${opts(Object.entries(RUNN))}</select>
<select id="fs" aria-label="Situation"><option value="">All situations</option>${opts(uniq('s').map(s=>[s,s]))}</select>
<select id="fo" aria-label="Outcome"><option value="">All outcomes</option>${opts(Object.entries(OL))}</select>
<select id="fp" aria-label="Platform"><option value="">All platforms</option>${opts(uniq('p').map(s=>[s,s]))}</select>
<select id="fg" aria-label="Gender"><option value="">Any gender</option><option>Man</option><option>Woman</option><option value="-">Not stated</option></select></div>
<p class="ex-count" id="exc"></p><div class="ex-list" id="exl"></div><button class="more" id="exm">Show more</button>`);
// meaning, gaps
html+=sec('meaning','What it means',`<div class="col"><h2>${esc(D.meaning.title)}</h2><div class="read">${D.meaning.body}</div></div>`,'dawn');
html+=sec('gaps','What we couldn\'t find',`<div class="col"><h2>${esc(D.gaps.title)}</h2>${D.gaps.intro||''}<ul class="plain read">${D.gaps.list.map(g=>`<li>${esc(g)}</li>`).join('')}</ul></div>`,'dawn');
html+=`<footer class="dawn" id="help" data-nav="Help"><div class="wrap"><div class="col"><h3>If it is heavy right now</h3><p>You can talk to someone today, for free.</p></div>

// nav
const secs=[...document.querySelectorAll('[data-nav]')];
const nav=document.getElementById('nav');
nav.innerHTML=secs.map(s=>`<a href="#${s.id}">${esc(s.dataset.nav)}</a>`).join('');
const links=[...nav.children];
const prog=document.getElementById('prog');
let ticking=false;
function onScroll(){
 const y=scrollY,h=document.documentElement.scrollHeight-innerHeight;
 const f=Math.min(1,Math.max(0,y/h));
 prog.style.width=(f*100)+'%';
 document.body.style.setProperty('--night',(f*50).toFixed(2));
 let cur=-1;secs.forEach((s,i)=>{if(s.getBoundingClientRect().top<innerHeight*.35)cur=i});
 links.forEach((a,i)=>a.classList.toggle('on',i===cur));
 if(cur>=0&&links[cur]&&!links[cur].dataset.seen){links.forEach(a=>delete a.dataset.seen);links[cur].dataset.seen=1;const a=links[cur];nav.scrollTo({left:a.offsetLeft-nav.clientWidth/2+a.clientWidth/2,behavior:'smooth'})}
 ticking=false;
}
addEventListener('scroll',()=>{if(!ticking){ticking=true;requestAnimationFrame(onScroll)}},{passive:true});
onScroll();

// explorer
(function(){
 const q=document.getElementById('q'),fr=document.getElementById('fr'),fs=document.getElementById('fs'),fo=document.getElementById('fo'),fp=document.getElementById('fp'),fg=document.getElementById('fg'),L=document.getElementById('exl'),C=document.getElementById('exc'),Mb=document.getElementById('exm');
 let res=[],shown=0;
 function run(){const t=q.value.trim().toLowerCase();res=V.filter(v=>(!fr.value||v.r===fr.value)&&(!fs.value||v.s===fs.value)&&(!fo.value||v.o===fo.value)&&(!fp.value||v.p===fp.value)&&(!fg.value||(fg.value==='-'?!v.g:v.g===fg.value))&&(!t||v.x.toLowerCase().includes(t)||v.s.toLowerCase().includes(t)));shown=0;L.innerHTML='';more();}
 function more(){const n=res.slice(shown,shown+24);L.insertAdjacentHTML('beforeend',n.map(bubble).join(''));shown+=n.length;C.textContent=res.length.toLocaleString('en')+' of '+V.length.toLocaleString('en')+' voices';Mb.style.display=shown<res.length?'':'none';if(!res.length)L.innerHTML='<p class="muted">No voices match. Clear a filter or try a shorter word.</p>'}
 let tm;q.addEventListener('input',()=>{clearTimeout(tm);tm=setTimeout(run,160)});[fr,fs,fo,fp,fg].forEach(s=>s.addEventListener('change',run));Mb.addEventListener('click',more);run();
})();

// sky
(function(){
 const c=document.getElementById('sky'),x=c.getContext('2d'),N=D.hero.people;
 const peek=document.getElementById('peek'),pb=document.getElementById('peekBody');
 document.getElementById('peekX').onclick=()=>peek.classList.remove('show');
 let W,H,dpr,pts=[];
 // seeded random
 let sd=7;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647;
 const order=[];for(let i=0;i<N;i++)order.push(i<V.length?i:-1);
 const groups={good:[],mid:[],bad:[],advice:[],none:[]};
 const base=[];for(let i=0;i<N;i++){base.push({u:rnd(),v:rnd(),s:rnd(),tw:rnd()*6.28})}
 function size(){dpr=Math.min(2,devicePixelRatio||1);W=c.clientWidth;H=c.clientHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);
  pts=base.map((b,i)=>{const vi=order[i];const o=vi>=0?V[vi].o:'none';
   // denser toward the top, like a city sky
   const yy=Math.pow(b.v,1.25)*H*.98;return {x:b.u*W,y:yy,r:.7+b.s*(W<600?1.3:1.7),o,vi,tw:b.tw}})}
 const col={good:'244,178,62',mid:'183,168,214',bad:'141,182,242',advice:'200,208,230',none:'120,130,160'};
 const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
 let t0=performance.now(),sel=-1,raf,nb=[],selT=0;
 function draw(now){const t=(now-t0)/1000;x.clearRect(0,0,W,H);const intro=reduce?1:Math.min(1,t/2.2);
  for(let i=0;i<pts.length;i++){const p=pts[i];const appear=Math.min(1,Math.max(0,intro*1.6-(p.y/H)*.6));if(appear<=0)continue;
   const a=(p.o==='none'?.25:p.o==='advice'?.45:.9)*appear*(reduce?1:(.78+.22*Math.sin(t*.9+p.tw)));
   x.fillStyle=`rgba(${col[p.o]},${a.toFixed(3)})`;x.beginPath();x.arc(p.x,p.y-(1-appear)*30,i===sel?p.r+2.5:p.r,0,6.283);x.fill()}
  if(sel>=0&&nb.length){const p=pts[sel];const k=reduce?1:Math.min(1,(now-selT)/700);x.strokeStyle=`rgba(${col[p.o]},.6)`;x.lineWidth=1;x.beginPath();let q=p;nb.forEach(j=>{const n=pts[j];x.moveTo(q.x,q.y);x.lineTo(q.x+(n.x-q.x)*k,q.y+(n.y-q.y)*k);q=n});x.stroke()}
  if(sel>=0){const p=pts[sel];x.strokeStyle='rgba(238,231,220,.9)';x.lineWidth=1.2;x.beginPath();x.arc(p.x,p.y,p.r+7,0,6.283);x.stroke()}
  if(!reduce&&!document.hidden)raf=requestAnimationFrame(draw)}
 function pick(e){const r=c.getBoundingClientRect();const mx=e.clientX-r.left,my=e.clientY-r.top;let best=-1,bd=1e9;
  pts.forEach((p,i)=>{if(p.vi<0)return;const d=(p.x-mx)**2+(p.y-my)**2;if(d<bd){bd=d;best=i}});
  if(best>=0&&bd<1600){sel=best;selT=performance.now();const P=pts[best];const cand=[];pts.forEach((p,i)=>{if(i!==best&&p.o===P.o&&p.vi>=0)cand.push([(p.x-P.x)**2+(p.y-P.y)**2,i])});cand.sort((a,b)=>a[0]-b[0]);const near=cand.slice(0,6).map(c=>c[1]);nb=[];let cur=P,left=near.slice();while(left.length){let bi=0,bv=1e18;left.forEach((j,ii)=>{const d=(pts[j].x-cur.x)**2+(pts[j].y-cur.y)**2;if(d<bv){bv=d;bi=ii}});const j=left.splice(bi,1)[0];nb.push(j);cur=pts[j]}pb.innerHTML=bubble(V[pts[best].vi]);peek.classList.add('show');if(reduce)draw(performance.now())}}
 c.addEventListener('click',pick);
 addEventListener('resize',()=>{size();if(reduce)draw(performance.now())});
 document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!reduce){cancelAnimationFrame(raf);raf=requestAnimationFrame(draw)}});
 size();raf=requestAnimationFrame(draw);
 // stop twinkle when hero is off screen
 new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting&&!reduce){cancelAnimationFrame(raf);raf=requestAnimationFrame(draw)}else cancelAnimationFrame(raf)})}).observe(c);
})();
</script>
