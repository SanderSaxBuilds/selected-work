e":145,"display":"145","a":false},{"label":"Russian sites","value":135,"display":"135","a":false},{"label":"Pantip","value":123,"display":"123","a":false},{"label":"Hacker News","value":103,"display":"103","a":false},{"label":"App reviews","value":61,"display":"61","a":false},{"label":"App communities","value":35,"display":"35","a":false},{"label":"TikTok","value":5,"display":"5","a":false}],"src":"All five rounds, counted from the voice tables."},"after":"<p class=\"src\">38 people showed up in two rounds and are counted once, which gives 3,070 distinct people. About 175 of them are researchers, coaches or news articles, the rest are ordinary people telling their own story. Counts in this page describe the stories people chose to post, not odds for everyone.<\/p>"},"scale":{"title":"How bad is it, really","intro":"<p class=\"read\">Bad. And far more common than it feels from inside your room.<\/p>","numbers":[{"v":"1 in 6","l":"people worldwide are lonely","s":"WHO Commission on Social Connection 2025","nv":false,"c":""},{"v":"27%","l":"of young adults 19 to 29 feel very or fairly lonely, the highest of any age","s":"Meta-Gallup, 142 countries, 2022 to 2023","nv":false,"c":""},{"v":"25%","l":"of US men 15 to 34 felt lonely a lot of yesterday. Young women 18%","s":"Gallup 2025","nv":false,"c":""},{"v":"63%","l":"of US men under 30 are single. Women the same age 34%","s":"Pew Research Center 2023, 2022 data","nv":false,"c":"b"},{"v":"24%","l":"of US 18 to 29 year olds had no sex in the past year, up from 12% in 2010","s":"Institute for Family Studies 2025","nv":false,"c":"b"},{"v":"nearly 40%","l":"of Japanese men 20 to 34 have never been in a relationship","s":"IPSS Japan via Nippon.com 2026","nv":false,"c":"b"},{"v":"over 30%","l":"of young adults in Japan have nobody they feel close to","s":"World Happiness Report 2025","nv":false,"c":""},{"v":"871,000","l":"deaths a year are linked to loneliness, about 100 an hour","s":"WHO Commission on Social Connection 2025","nv":false,"c":"b"}],"thenNow":{"note":"Drag from then to now. Every pair is the same survey or series, years shown on each line.","rows":[{"label":"No close friends, US adults","then":3,"now":12,"ty":"1990","ny":"2021"},{"label":"No close friends, US men","then":3,"now":15,"ty":"1990","ny":"2021"},{"label":"Have a best friend, US adults","then":75,"now":59,"ty":"1990","ny":"2021"},{"label":"Ten or more close friends, US adults","then":33,"now":13,"ty":"1990","ny":"2021"},{"label":"Young US adults who talk with neighbours a few times a week","then":51,"now":25,"ty":"2012","ny":"2026"},{"label":"US 18 to 29 with no sex in the past year","then":12,"now":24,"ty":"2010","ny":"2024"},{"label":"US men under 30 who are single","then":51,"now":63,"ty":"2019","ny":"2022"},{"label":"Young US adults who drink","then":72,"now":50,"ty":"2001 to 2003","ny":"2025"}],"src":"Survey Center on American Life 2021 and 2026, Institute for Family Studies 2025, Pew Research Center, Gallup. The 1990 figures come from a phone survey and the 2021 ones from an online survey."},"charts":[{"type":"table","title":"How many close friends people have","head":["Who","None","1 or 2","3 or more"],"rows":[["US adults 18 to 29, June 2026","16%","38%","45%"],["US men, all ages, June 2026","14%","32%","52%"],["US women, all ages, June 2026","18%","27%","53%"],["US men 18 to 29, April 2025","9%","34%","58%"]],"src":"YouGov Friendship and Loneliness poll, June 2026. IFS and YouGov, April 2025. No worldwide split by age and gender exists, so these are US surveys."},{"type":"bar","title":"Young English men who are often lonely, by number of close friends","rows":[{"label":"No close friends","value":31,"display":"31%","a":false},{"label":"One or two","value":27,"display":"27%","a":false},{"label":"Three or more","value":10,"display":"about 9 to 11%","a":true}],"src":"UK government analysis of boys and young men, 2026. The big drop comes at three friends, not at one.","max":40},{"type":"bar","title":"Men and women","rows":[{"label":"Lonely, 18 to 29 worldwide, men","value":17.4,"display":"17.4%","a":false},{"label":"Lonely, 18 to 29 worldwide, women","value":16.8,"display":"16.8%","a":false},{"label":"Lonely a lot yesterday, US 15 to 34, men","value":25,"display":"25%","a":false},{"label":"Lonely a lot yesterday, US 15 to 34, women","value":18,"display":"18%","a":false},{"label":"Got emotional support from a friend last week, US men","value":21,"display":"21%","a":false},{"label":"Got emotional support from a friend last week, US women","value":41,"display":"41%","a":true}],"src":"WHO 2025, Gallup 2025, Survey Center on American Life 2021.","max":50}],"outro":"<h3 style=\"margin-top:60px\">Am I the only one?<\/h3><p class=\"read\">No. In 11 studies with 3,293 people, most believed other people had richer social lives than their own (Deri 2017). In another set of studies, 90.9% of students had lost touch with a friend they cared about, and fewer than a third ever sent a message (Liu 2022). Almost everyone thinks they are the exception.<\/p>","outSplit":{"type":"split","title":"What happened to the 3,070 people in our stories","parts":[{"label":"Got out or met someone","value":1082,"color":"#F4B23E"},{"label":"Getting there","value":442,"color":"#B7A8D6"},{"label":"Still stuck or didn't","value":794,"color":"#8DB6F2"},{"label":"Gave advice only","value":752,"color":"#6F7FA6"}],"src":"All five rounds, each person counted once. These are stories people chose to post, so they are not a success rate."},"end":"<p class=\"read\">For every person still stuck, someone in the same spot got out. 1,082 got out or met someone, 794 are still stuck, and 442 more are on the way.<\/p>"},"rules":{"title":"The rules the data agrees on","intro":"<p class=\"read\">These held across rounds, across platforms and across both research passes. Each one has its number and one real story behind it.<\/p>","meter":{"note":"How long has she been watching your stories? Slide it.","steps":[{"pos":5,"label":"A few days","text":"Means nothing. Viewing is a habit. Instagram itself orders viewers by how much you interact, not by interest.","src":"Rounds 2 and 5b"},{"pos":6,"label":"A few months","text":"Of 29 story-watching and low-effort cases, 16 faded once he stopped writing. When he asked, she said yes 0 times.","src":"Round 5a, our count"},{"pos":7,"label":"Years","text":"No woman who only watched his stories ended up dating him, 0 of 6. One man says some girls watched daily for 2 or 3 years before they finally wrote.","src":"Rounds 5a and 5b, our count"},{"pos":72,"label":"She sends a real message","text":"Now it means something. Both couples that came out of long online silence started when someone wrote something real. Watching never did it.","src":"Round 5b, our count"}]},"effort":{"title":"Does it matter what she did before you asked?","note":"Pick what happened before the ask. Counts from both passes, 74 asks in total.","modes":[{"label":"Both put in effort","big":"8 of 11 led to a date","text":"When both people had already reached out and spent time together, most asks worked.","v":72.7},{"label":"She kept it low effort","big":"1 of 7 led to a date","text":"When she never started a chat or asked anything back, one clear ask worked once in both rounds together.","v":14.3},{"label":"Mixed or just friendly","big":"3 of 11 led to a date","text":"Friendly is not the same as effort.","v":27.3}],"src":"Round 5a combined, both passes. Small numbers, so read them as a pattern, not a rate."},"list":[{"rule":"Story views mean nothing","number":"0 of 6","explain":"No woman who only watched his stories ended up dating him. A real message started every couple that came out of silence.","story":"Several women who turned him down still watch everything he posts, often among the first 20 viewers, but barely answer a hello.","src":"Rounds 5a and 5b"},{"rule":"Ask after her effort, not before","number":"8 of 11 vs 1 of 7","explain":"Asks after effort from both sides mostly worked. Asks after low effort almost never did.","story":"Five months into a fast best friendship, she confessed and was turned down. They stayed best friends and two years later the friend said yes. Now engaged.","src":"Round 5a, both passes"},{"rule":"One clear ask beats years of hoping","number":"25 of 74","explain":"A third of all asks in our stories led to a date or relationship. Waiting led nowhere. One man spent 8 years on just enough flirting before she told him she had a boyfriend.","story":"After about ten years of dating apps, she messaged old matches with a plain date ask. One answered months later and became her husband.","src":"Round 5a, both passes"},{"rule":"Stop carrying the chat and you will know","number":"16 of 29","explain":"When the one who always started stopped, the chat usually just ended. That silence was the answer.","story":"They talked every day for months, always him reaching out. He stopped to test it and she only asked later why.","src":"Round 5a"},{"rule":"Her coming back after friends is not a yes","number":"0 of 14","explain":"Every time she returned after a friends answer, the hope restarted. None became a relationship.","story":"She sent good morning texts, said yes to every hangout and spent hours one on one with him. Then she called it just friendly.","src":"Round 5b, both passes"},{"rule":"Count actions, not hints","number":"5 of 5","explain":"Every unblock with no message was followed by more silence. People got their read back by counting who starts chats and who keeps small plans.","story":"She reread years of texts and found he almost never wrote first. When she stopped starting chats he did not notice for months.","src":"Round 5b"},{"rule":"Write the song after she says yes","number":"5 times","explain":"Content and art started a conversation 5 times. Ordinary talk did the rest. Songs, gifts and favours sent before a yes never bought one.","story":"His lip-sync video hit her feed, she duetted it, he DM'd. He flew to meet her about a month later. Now married with a daughter.","src":"Round 5b, both passes"},{"rule":"Don't fix or pay for love","number":"0 of 4","explain":"Men who fixed her problems or paid to keep her close never got love back for it.","story":"Two app dates, then a friends answer. He spent six months fixing her problems and paying while she dated others.","src":"Round 5b"},{"rule":"Same people, same time, every week","number":"28 of 111","explain":"The top way out of loneliness in both passes was going back to the same sport, hobby or group week after week. On Reddit it was 19 of 58.","story":"Tired of running alone, a man started a free weekly run club in April 2023. It grew from a few friends to 200 to 300 young adults a week.","src":"Round 4"},{"rule":"Three friends is where loneliness drops","number":"31% to about 10%","explain":"Young men with no close friends or one or two were often lonely at about the same rate. The drop came at three.","story":"A thirty-year-old man has a long list of acquaintances and nobody he would call a friend.","src":"UK government, boys and young men, 2026"},{"rule":"Distance ends limerence","number":"about 20 of 45","explain":"No contact, distance or a block was the most named way out of a one-sided crush, ahead of time and therapy.","story":"Sixteen years of no contact, different countries, mutual friends cut off, and still a huge relapse.","src":"Round 5b. Story from round 5a"},{"rule":"A reunion is a coin flip","number":"23 and 23","explain":"Of 46 exes who got back together, half lasted and half broke up again. The ones that lasted had both been single and the old problem was gone.","story":"She moved away with another boyfriend. Nine years after the split they met again by chance. Married 13 years at the post.","src":"Round 5b, both passes"}]},"topics":[{"key":"in-person","title":"Dating in person","lede":"Most couples start as friends or regulars somewhere. Being around the same people matters more than one bold approach.","numbers":[{"v":"66%","l":"of romances began as friendships","s":"Stinson, Cameron and Hoplock meta-analysis","nv":false,"c":""},{"v":"12 months","l":"median time as friends before it turned romantic","s":"same meta-analysis","nv":false,"c":""},{"v":"17.6% to 62.5%","l":"pairs where someone wanted more contact, after 1 chat vs after 8","s":"Reis et al. 2011","nv":false,"c":""},{"v":"109 of 185","l":"people with a clear route met in person, not online","s":"Round 2, our count","nv":false,"c":""}],"charts":[{"type":"bar","title":"How people who met someone met","rows":[{"label":"Dating apps","value":54,"display":"54","a":true},{"label":"Friends, family, parties","value":32,"display":"32","a":true},{"label":"Shared activity, club, class, music","value":25,"display":"25","a":true},{"label":"Everyday encounters, approach, travel","value":22,"display":"22","a":false},{"label":"Online, but not an app","value":22,"display":"22","a":false},{"label":"School or training","value":14,"display":"14","a":false},{"label":"Work","value":10,"display":"10","a":false},{"label":"Bars and nightlife","value":6,"display":"6","a":false}],"src":"Round 2, 657 voices, both passes. Apps are the biggest single route, all in-person routes together are bigger."}],"stories":[{"text":"He started a small weekly climbing meetup and met more girlfriends there than anywhere else, including his wife.","quote":"Also met his wife there.","o":"good","oc":"Met someone","meta":["Hacker News","Man"]},{"text":"A housemate invited his cousin on a hike. The two connected and now have a child together.","quote":"","o":"good","oc":"Met someone","meta":["Reddit"]},{"text":"He called himself unattractive and gave up. His future wife walked up while he ran the music at a party. Married 15 years.","quote":"15 years married.","o":"good","oc":"Met someone","meta":["Forums","Man"]},{"text":"Weekly dance classes and chatting afterwards went on for five months before the first date.","quote":"","o":"good","oc":"Met someone","meta":["Reddit"]},{"text":"A stranger asked him the time in a coffee shop, spilled coffee broke the ice, and she asked for his number.","quote":"","o":"good","oc":"Met someone","meta":["Reddit"]},{"text":"A 24-year-old remote worker got a number at the gym. She never answered his text, and the gym got awkward.","quote":"","o":"bad","oc":"Didn't work out","meta":["Reddit","Man","age 24"]}],"body":""},{"key":"online","title":"Dating online","lede":"The online love stories came from shared spaces: games, Discord, fandoms, comment sections. Swiping and cold DMs did worst.","numbers":[{"v":"37 of 40","l":"gaming stories ended in a relationship or daily contact","s":"Round 3, our count","nv":false,"c":""},{"v":"15 of 62","l":"stories from other dating apps did the same","s":"Round 3, our count","nv":false,"c":"b"},{"v":"2.04%","l":"median Tinder match rate for men. Women 41.27%","s":"SwipeStats, 6,235 self-uploaded profiles","nv":false,"c":"b"},{"v":"3 replies","l":"from 100 cold Instagram DMs sent in one day","s":"one Reddit account, round 3","nv":false,"c":"b"}],"charts":[{"type":"bar","title":"Online stories that ended in a relationship or daily contact","rows":[{"label":"Gaming, 37 of 40","value":92.5,"display":"37 of 40","a":true},{"label":"Discord, 31 of 37","value":83.8,"display":"31 of 37","a":true},{"label":"Content creator, 8 of 10","value":80,"display":"8 of 10","a":true},{"label":"TikTok, 10 of 18","value":55.6,"display":"10 of 18","a":false},{"label":"Other online, X, forums, fandom","value":43.0,"display":"64 of 149","a":false},{"label":"Language and pen-pal apps","value":32.5,"display":"27 of 83","a":false},{"label":"Instagram","value":27.3,"display":"21 of 77","a":false},{"label":"Other dating apps","value":24.2,"display":"15 of 62","a":false}],"src":"Round 3, 477 voices. Instagram is where the two passes disagreed: the web pass found 19 of 37, the Reddit pass 2 of 40.","max":100},{"type":"bar","title":"Online to in person: who travelled for the first meeting","rows":[{"label":"He went to her","value":21,"display":"21","a":true},{"label":"She came to him","value":11,"display":"11","a":false},{"label":"Both travelled","value":3,"display":"3","a":false},{"label":"Close enough to just meet","value":6,"display":"6","a":false},{"label":"Never met","value":13,"display":"13","a":false}],"src":"Round 5a, both passes. Couples that lasted all had someone fly, then someone move."}],"stories":[{"text":"His first message in World of Warcraft was an offer to heal her group’s dungeon run. Married 16 years, still playing together.","quote":"","o":"good","oc":"Met in person","meta":["Hacker News","Man"]},{"text":"Met in a Discord for their profession. He teased her about a comment, two years as best friends, then he drove 16 hours.","quote":"","o":"good","oc":"Met in person","meta":["Forums","Woman"]},{"text":"A man shot his shot in her X replies. Three months later she moved across the US. Married three years to the day.","quote":"","o":"good","oc":"Met in person","meta":["X","Woman"]},{"text":"They followed each other on Instagram in two states. When he posted a haircut video she sent a heart-eye emoji and DMed him the next day.","quote":"Three years later, she moved to Texas with me.","o":"good","oc":"Got out","meta":["Articles and essays","Man","age 35"]},{"text":"After two weeks of talking, she drove sixteen hours to visit him.","quote":"","o":"good","oc":"Got out","meta":["Reddit"]},{"text":"At 21 he moved cities for a girl from the internet. She left after six months and he lost his job.","quote":"","o":"bad","oc":"Nothing came of it","meta":["Hacker News","Man","age 21"]}],"body":""},{"key":"friends","title":"Friends after school, without bars or money","lede":"The people who rebuilt a circle did one boring thing. Same people, same time, every week. And they were the ones who invited.","numbers":[{"v":"28 of 111","l":"success stories where a weekly sport or exercise group was the way out","s":"Round 4","nv":false,"c":""},{"v":"200+ hours","l":"together to make a close friend. 40 to 60 for a casual one","s":"Hall 2018, University of Kansas","nv":false,"c":""},{"v":"43%","l":"of US adults under 30 met at least one current friend online","s":"Pew-Knight 2026","nv":false,"c":""},{"v":"85%","l":"of them later met an online friend in person","s":"Pew-Knight 2026","nv":false,"c":""}],"charts":[{"type":"bar","title":"What helped people make friends after school","rows":[{"label":"Sport or exercise group, same people every week","value":28,"display":"28","a":true},{"label":"Reaching out, inviting, starting the group","value":18,"display":"18","a":true},{"label":"Music, art or hobby scene","value":13,"display":"13","a":false},{"label":"Study, coworking or a new job","value":12,"display":"12","a":false},{"label":"Recovery or peer support group","value":9,"display":"9","a":false},{"label":"Online forum or chat that moved offline","value":7,"display":"7","a":false},{"label":"Everyday regulars, a dog, a park, a cafe","value":7,"display":"7","a":false},{"label":"Volunteering","value":5,"display":"5","a":false}],"src":"Round 4, 111 success stories, one person can name more than one."},{"type":"bar","title":"Making friends without going out: who got out of loneliness","rows":[{"label":"Group chat or Discord for a non-gaming interest","value":83.3,"display":"10 of 12","a":true},{"label":"Long-running forum or online chat","value":87.5,"display":"7 of 8","a":true},{"label":"Creator circle or fan community","value":60,"display":"3 of 5","a":false},{"label":"Pen-pal, friend or language app","value":30,"display":"3 of 10","a":false},{"label":"Reconnecting by text or call","value":0,"display":"0 of 4, 2 getting there","a":false}],"src":"Round 5a.","max":100}],"stories":[{"text":"Tired of running alone, a man started a free weekly run club in April 2023. It grew from a few friends to 200 to 300 young adults a week.","quote":"I was tired of running alone.","o":"good","oc":"Got out","meta":["Articles and essays","Man"]},{"text":"Divorced after a decade, he went to the same exercise class several times a week. Small complaints turned into coffee, then many close friends.","quote":"With repetition, it's very easy to make new friends.","o":"good","oc":"Got out","meta":["Hacker News"]},{"text":"In her first job her colleagues were older. She kept smiling at the same person in a park after work until they talked. Friends almost 10 years.","quote":"","o":"good","oc":"Got out","meta":["Pantip","Woman"]},{"text":"While unemployed he posted his Blu-ray collection and joined a film group chat. Fifteen people became a core eight, seven years on, never met.","quote":"I found a place where I could be myself","o":"good","oc":"Got out","meta":["Articles and essays"]},{"text":"A weekly men's breakfast started with three guys and now averages six to eight, with a book club and family days added.","quote":"It started as three guys and averages 6-8 now","o":"good","oc":"Got out","meta":["Hacker News","Man"]},{"text":"A climbing gym, boxing and local meetups gave one man no friends at all because he barely spoke to anyone there.","quote":"","o":"bad","oc":"Still stuck","meta":["Russian sites","Man"]}],"body":""},{"key":"sober","title":"Sober, and losing your circle","lede":"Quitting cost almost everyone their drinking friends first. Most rebuilt within months to a few years. The date itself was rarely the problem.","numbers":[{"v":"50%","l":"of young US adults drank in 2025, down from 72% in 2001 to 2003","s":"Gallup","nv":false,"c":""},{"v":"67%","l":"of Gen Z want to date without relying on alcohol","s":"Hinge 2025","nv":false,"c":""},{"v":"151 days","l":"sober when one person noticed the invites had stopped","s":"Round 4","nv":false,"c":""},{"v":"about 6 months","l":"for friends to adjust to an 8-year-sober musician","s":"Round 4","nv":false,"c":""}],"charts":[{"type":"bar","title":"Young US adults who drink","rows":[{"label":"2001 to 2003","value":72,"display":"72%","a":false},{"label":"2023","value":59,"display":"59%","a":false},{"label":"2025","value":50,"display":"50%","a":false}],"src":"Gallup.","max":100}],"stories":[{"text":"Ten years of drinking buddies, never real friends. The most liked comment on its video, about 17K likes.","quote":"When I stopped drinking, they stopped calling.","o":"bad","oc":"Still stuck","meta":["YouTube"]},{"text":"At 151 days sober, their friends had stopped inviting them to things.","quote":"","o":"bad","oc":"Still stuck","meta":["YouTube"]},{"text":"An 8-year-sober rock musician took work trips to dodge drinking sessions early on. Friends took about six months to adjust, now he drinks lemonade at parties.","quote":"","o":"good","oc":"Got out","meta":["Russian sites","Man"]},{"text":"After quitting weed he joined a Muay Thai gym and found bonds closer than any old friendship.","quote":"We suffer together and support each other","o":"good","oc":"Got out","meta":["YouTube"]},{"text":"He quit drinking and now barely sees women outside work.","quote":"I quit drinking so now I rarely see women","o":"bad","oc":"Didn't work out","meta":["Hacker News","Man"]},{"text":"His first date with his now fiancee was a Bangkok night market and a vintage car show, no drinking.","quote":"","o":"good","oc":"Met someone","meta":["X","Man"]},{"text":"The counter case. Almost a year without drinking, his friends stayed the same. They teased him first and now envy him.","quote":"","o":"good","oc":"Got out","meta":["YouTube","Man"]}],"body":""},{"key":"watchers","title":"Low effort, story watchers and breadcrumbs","lede":"Likes, views and Close Friends adds almost never became a date. A real message did. And whoever carried the chat usually learned the truth when they stopped.","numbers":[{"v":"0 of 6","l":"women who only watched his stories ended up dating him","s":"Round 5b","nv":false,"c":"b"},{"v":"16 of 29","l":"low-effort situations faded once he stopped writing","s":"Round 5a","nv":false,"c":"b"},{"v":"1 of 7","l":"asks after low effort led to a date","s":"Round 5a, both passes","nv":false,"c":"b"},{"v":"35.6%","l":"of adults 18 to 40 in Spain were breadcrumbed in the past year","s":"Navarro 2020","nv":false,"c":""}],"charts":[{"type":"bar","title":"How 29 story-watching and low-effort situations ended","rows":[{"label":"He stopped writing, it faded or she never came back","value":16,"display":"16","a":false},{"label":"Still going, nothing from her","value":6,"display":"6","a":false},{"label":"He asked, she said no","value":3,"display":"3","a":false},{"label":"He stopped and she came back","value":2,"display":"2","a":false},{"label":"Became a friendship, then faded","value":1,"display":"1","a":false},{"label":"An ask got a yes","value":0,"display":"0","a":false}],"src":"Round 5a."}],"stories":[{"text":"A man says some girls watched his stories every day and took two or three years before they ever messaged him.","quote":"took 2 years or even 3 years to message me","o":"advice","oc":"Advice","meta":["YouTube"]},{"text":"Several women who turned him down still watch everything he posts, often among the first 20 viewers, but barely answer a hello.","quote":"I stopped hitting them up by the way.","o":"good","oc":"Got out","meta":["YouTube"]},{"text":"His crush finally added him to Close Friends. The first story he saw was her kissing another guy.","quote":"","o":"bad","oc":"Didn't work out","meta":["X","Man"]},{"text":"A woman turned a guy down for a date. He then added her to his Close Friends story.","quote":"Guy i turned down for a date added me","o":"bad","oc":"Didn't work out","meta":["X","Woman"]},{"text":"They talked every day for months, always him reaching out. He stopped to test it and she only asked later why.","quote":"the silence told me everything","o":"good","oc":"Got out","meta":["X"]},{"text":"Two women who ditched him, both now married, watch all his stories. One finally messaged, only to say she was proud of him.","quote":"","o":"mid","oc":"Getting there","meta":["YouTube"]},{"text":"Two people followed each other for about four years without a word. He made a playful comment, and they became partners.","quote":"","o":"good","oc":"Got out","meta":["Reddit"]}],"body":"<p>Instagram orders story viewers by how much you interact once there are more than about 50, so a name near the top is not a sign. That detail is second-hand and not verified. No study measures what story views mean romantically.<\/p>"},{"key":"limerence","title":"Limerence, the long one-sided crush","lede":"It usually burns 18 months to 3 years. Distance was the most common way out. Contact, even decades later, can light it again.","numbers":[{"v":"18 months to 3 years","l":"typical length of one episode","s":"Wyant 2021 and BPS The Psychologist 2024","nv":false,"c":""},{"v":"4 times","l":"more common than equal love, over two years in student samples","s":"Bringle et al. 2013","nv":false,"c":""},{"v":"about 20 of 45","l":"crush stories named no contact, distance or a block as what helped","s":"Round 5b","nv":false,"c":""},{"v":"about 50 to 60%","l":"say they have felt it, from a researcher's own online poll","s":"Pollfish poll, self-selected","nv":true,"c":""}],"charts":[{"type":"bar","title":"What got people out of a one-sided crush","rows":[{"label":"No contact or distance","value":20,"display":"about 20","a":true},{"label":"Time","value":9,"display":"about 9","a":false},{"label":"Seeing the truth","value":6,"display":"about 6","a":false},{"label":"Therapy","value":5,"display":"about 5","a":false},{"label":"Self work, sport, study","value":4,"display":"about 4","a":false},{"label":"A new person","value":2,"display":"about 2","a":false}],"src":"Round 5b, 45 stories, keyword count."}],"stories":[{"text":"Limerence vanished almost at once after seeing the person's cringe TikTok dances with friends. Real footage beat the fantasy.","quote":"the feeling disappeared nearly instantly","o":"good","oc":"Got out","meta":["YouTube"]},{"text":"Four years of limerence without knowing the word. She took up sport, learned to drive, trained as a fitness coach and is now partly grateful.","quote":"","o":"good","oc":"Got out","meta":["Russian sites","Woman"]},{"text":"Going on 28 years of limerence and wishing it would stop. The one upside, it made him write good music.","quote":"it inspired me to write some good music","o":"bad","oc":"Still stuck","meta":["X"]},{"text":"Sixteen years of no contact, different countries, mutual friends cut off, and still a huge relapse.","quote":"","o":"bad","oc":"Still stuck","meta":["Forums"]},{"text":"Went cold on a work crush with no explanation. By week 17 of no contact he thought of her less and noticed other women.","quote":"I can't go back to breadcrumbs","o":"mid","oc":"Getting there","meta":["Forums","Man"]},{"text":"Happily married, he spent 7 months fixated after one glimpse of a woman. Finding the word limerence stopped him.","quote":"about to throw away everything I built for a fantasy","o":"mid","oc":"Getting there","meta":["YouTube"]}],"body":"<p>How people got their trust in their own read back: they stopped reading attention and started counting actions. Who starts the chats. Whether small plans get kept. Whether a clear question gets a clear answer. One woman reread years of texts and found he almost never wrote first.<\/p>"},{"key":"flip","title":"The flip","lede":"Intense attention, then a cold turn, sometimes with a line like what did you think this was. In these stories it came from her wanting it light, his pace, or another man.","numbers":[{"v":"21","l":"flip stories on the open web, 15 told from his side and 6 from hers","s":"Round 5b","nv":false,"c":""},{"v":"10","l":"Reddit stories told by the person who pulled back","s":"Round 5b, Reddit","nv":false,"c":""},{"v":"484","l":"students in a study where love bombing went with narcissism and insecure attachment","s":"Strutzenberg et al. 2017","nv":false,"c":""}],"charts":[{"type":"split","title":"Who told the flip story","parts":[{"label":"His side, open web","value":15,"color":"#8DB6F2"},{"label":"Her side, open web","value":6,"color":"#F4B23E"},{"label":"Receiving side, Reddit","value":9,"color":"#B7A8D6"},{"label":"The one who pulled back, Reddit","value":10,"color":"#E8C98E"}],"src":"Round 5b."}],"stories":[{"text":"Within about a week she went from saying nobody ever made her feel this way to suggesting they just be friends.","quote":"no one's ever made me feel how you made me feel","o":"bad","oc":"Still stuck","meta":["YouTube"]},{"text":"For a month she drove an hour to see him and wanted to quit her job for his Japan trip. Then she went exclusive with another man.","quote":"","o":"good","oc":"Got out","meta":["YouTube"]},{"text":"A woman in her own words: strong interest from a man turns her off, and fast romance makes her want to flee.","quote":"When someone is very interested in me, it's a turnoff","o":"mid","oc":"Getting there","meta":["Articles and essays","Woman","age 30"]},{"text":"A psychologist explains the flip. Once someone admits they like us, the chase is over.","quote":"We lose interest when we gain power","o":"advice","oc":"Advice","meta":["Articles and essays","Woman"]},{"text":"Months of near daily chats with an app match. She drunk-texted that she wanted to give it a shot, then took it back next morning.","quote":"","o":"bad","oc":"Still stuck","meta":["Forums","Man"]},{"text":"A woman realised her ordinary curiosity on dates looked like romance to men. They felt a strong connection she never felt.","quote":"","o":"good","oc":"Got out","meta":["Reddit","Woman"]}],"body":""},{"key":"shot","title":"Shooting your shot","lede":"Asking gets you an answer, which is the point. It works most when she has already been putting in effort. After low effort it almost never does.","numbers":[{"v":"8 of 11","l":"asks after effort from both sides led to a date or relationship","s":"Round 5a, both passes","nv":false,"c":""},{"v":"1 of 7","l":"asks after low effort did","s":"Round 5a, both passes","nv":false,"c":"b"},{"v":"25 of 74","l":"of all asks led to a date or relationship, 38 were declined","s":"Round 5a, both passes","nv":false,"c":""},{"v":"48%","l":"of Gen Z men hold back early so they do not seem too much","s":"Hinge 2025","nv":false,"c":""}],"charts":[{"type":"bar","title":"Did the ask lead to a date, by what came before","rows":[{"label":"Clear effort from both sides","value":72.7,"display":"8 of 11","a":true},{"label":"Mixed or just friendly","value":27.3,"display":"3 of 11","a":false},{"label":"Effort unclear","value":28.9,"display":"13 of 45","a":false},{"label":"Low initiative throughout","value":14.3,"display":"1 of 7","a":false}],"src":"Round 5a, 74 asks. The two passes counted the high-effort asks a little differently, 2 of 3 or 3 of 3 on the web pass.","max":100}],"stories":[{"text":"After about ten years of dating apps, she messaged old matches with a plain date ask. One answered months later and became her husband.","quote":"why don't we just go on a date?","o":"good","oc":"Got out","meta":["App reviews"]},{"text":"He asked a grocery store worker out and she said no. The third ask worked. They used a translation app on dates and have been married 10 years.","quote":"","o":"good","oc":"Got out","meta":["Hacker News","Man"]},{"text":"Sure she was not into him, he told her anyway with his friends backing him. She felt the same and they are together.","quote":"Get help from your friends","o":"good","oc":"Got out","meta":["YouTube"]},{"text":"Six months of weekly hangouts, he even got her a job. He confessed after dinner, she did not feel the same, and the friendship broke.","quote":"You shot your shot and failed, and the friendship is over","o":"bad","oc":"Still stuck","meta":["Forums","Man"]},{"text":"At a reunion a woman learned two college friends had liked her and never said a word. She would have said yes.","quote":"I probably would have accepted in a heartbeat","o":"advice","oc":"Advice","meta":["Forums","Woman"]},{"text":"At 29 he asked a workplace crush out and she laughed. He still does not regret it, the ones he never asked became the what-ifs.","quote":"","o":"good","oc":"Got out","meta":["YouTube","age 29"]}],"body":""},{"key":"no-yes","title":"No, then yes later","lede":"Real, but rare. In the ones that lasted he took the no and got on with his life. Yeses won by pushing fell apart.","numbers":[{"v":"9","l":"later yeses that lasted","s":"Round 5b, web 5, Reddit 4","nv":false,"c":""},{"v":"6","l":"later yeses that ended again","s":"Round 5b","nv":false,"c":"b"},{"v":"6 weeks to 9 years","l":"gap between the no and the yes","s":"Round 5b","nv":false,"c":""},{"v":"70.3%","l":"of friends-first couples were not attracted at the start","s":"Stinson et al. 2021","nv":false,"c":""}],"charts":[{"type":"bar","title":"What happened after a no","rows":[{"label":"Later yes, lasting","value":9,"display":"9","a":true},{"label":"Later yes, ended again","value":6,"display":"6","a":false},{"label":"Too new or unknown","value":3,"display":"3","a":false},{"label":"Yes too late","value":2,"display":"2","a":false},{"label":"No stayed no","value":2,"display":"2","a":false}],"src":"Round 5b, both passes."}],"stories":[{"text":"Five months into a fast best friendship, she confessed and was turned down. They stayed best friends and two years later the friend said yes. Now engaged.","quote":"","o":"good","oc":"Got out","meta":["Articles and essays","age 26"]},{"text":"She said no at 21, but he stayed a real friend with no pressure. A year later she fell for him. Married six years.","quote":"had really accepted the initial 'no.'","o":"good","oc":"Got out","meta":["Articles and essays","Woman","age 21"]},{"text":"At 21 he confessed to a friend and got a no. He stayed her friend, they dated a year later and were married 33 years.","quote":"","o":"good","oc":"Got out","meta":["YouTube","age 21"]},{"text":"He chased a woman for 8 or 9 years and finally got her. The spark died almost at once.","quote":"the flame burned out instantly","o":"good","oc":"Got out","meta":["YouTube"]},{"text":"A man kept asking for years and she kept saying no. About two years after her first no she said yes. He ghosted within two weeks.","quote":"All I saw were red flags","o":"good","oc":"Got out","meta":["Articles and essays","Woman"]},{"text":"After one short date she told a friend she would never go out with him again. She became his wife.","quote":"Didn't work out the way she thought though","o":"good","oc":"Got out","meta":["Hacker News","Man"]}],"body":""},{"key":"routes","title":"How guys like this actually met someone","lede":"Nobody in either pass was an exact match for an early-20s guy who works from home, doesn't drink, has little money and doesn't game. The nearest stories used content, music, work and friends who vouch.","numbers":[{"v":"5","l":"people whose partner first found them through their content or art","s":"Round 5b","nv":false,"c":""},{"v":"22 to 34","l":"ages of first girlfriends in the Reddit round","s":"Round 5b, Reddit","nv":false,"c":""},{"v":"44%","l":"of Gen Z men had no romantic relationship as teens, double older men","s":"Survey Center on American Life 2024","nv":false,"c":""},{"v":"6 to 18 months","l":"typical time from the first regular commitment to not feeling lonely","s":"Round 4, our reading of the stories","nv":true,"c":""}],"charts":[{"type":"bar","title":"How people who found a partner met","rows":[{"label":"Dating apps and sites","value":11,"display":"11","a":false},{"label":"Work","value":6,"display":"6","a":false},{"label":"Content or art seen online","value":5,"display":"5","a":true},{"label":"Live music and gigs","value":5,"display":"5","a":true},{"label":"Friends or women vouching","value":4,"display":"4","a":false},{"label":"Music collaboration","value":3,"display":"3","a":true},{"label":"Instagram DM or online community","value":2,"display":"2","a":false}],"src":"Round 5b, both passes."}],"stories":[{"text":"His lip-sync video hit her feed, she duetted it, he DM'd. He flew to meet her about a month later. Now married with a daughter.","quote":"","o":"good","oc":"Got out","meta":["Articles and essays","Woman"]},{"text":"He made videos about having no girlfriend. A girl wrote to him, he went to meet her, and they have been together two years.","quote":"","o":"good","oc":"Got out","meta":["YouTube","Man"]},{"text":"A self-described plain guy says he always dated above his league because female friends vouched for him.","quote":"Women are the best wingmen","o":"good","oc":"Got out","meta":["Forums","Man"]},{"text":"Someone noticed their art on Reddit and followed on Instagram. Two months of talk, then feelings, now two years together.","quote":"","o":"good","oc":"Got out","meta":["Reddit"]},{"text":"A songwriter who made many videos about never having romance got his first relationship at 22 and says he can now write real love songs.","quote":"It's been a long 22 years","o":"good","oc":"Got out","meta":["YouTube","Man","age 22"]},{"text":"First kiss at 27, met his wife at 30, married with two children at 37.","quote":"","o":"good","oc":"Got out","meta":["Reddit","Man","age 37"]}],"body":""},{"key":"steady","title":"From push-pull to steady","lede":"After chaos, a steady person feels boring, even scary, at first. The people who stayed say it held for years.","numbers":[{"v":"27","l":"push-pull to steady stories, 18 on the open web and 9 on Reddit","s":"Round 5b","nv":false,"c":""},{"v":"5 and 5","l":"steady relationships that held, found by each pass","s":"Round 5b","nv":false,"c":""},{"v":"354","l":"dating couples in a study with no anxious-anxious or avoidant-avoidant pairs","s":"Kirkpatrick and Davis 1994","nv":false,"c":""}],"charts":[{"type":"bar","title":"After push-pull, the Reddit stories","rows":[{"label":"New or ongoing steadier relationship","value":5,"display":"5","a":true},{"label":"Working on the pattern","value":2,"display":"2","a":false},{"label":"Repeated it with a new person","value":1,"display":"1","a":false},{"label":"No steady outcome","value":1,"display":"1","a":false}],"src":"Round 5b, Reddit."}],"stories":[{"text":"A 46-year-old married the steady type after exciting men hurt her. Not madly in love, but stable, and glad.","quote":"I chose the boring path after two painful breakups","o":"good","oc":"Got out","meta":["Forums","Woman","age 46"]},{"text":"First stable relationship of their life and the first time love was not one-sided. The steadiness replaced the chase.","quote":"I've never chased any high since I've known her","o":"good","oc":"Got out","meta":["YouTube"]},{"text":"He makes her tea when she is sick and never cheated. Then she told him she sometimes misses the chaos.","quote":"sometimes I miss the chaos","o":"bad","oc":"Still stuck","meta":["Forums","Man"]},{"text":"After controlling exes, a fully open and genuine man scared her at first. It lasted.","quote":"actually scared me","o":"good","oc":"Got out","meta":["Articles and essays","Woman"]},{"text":"A year after an abusive ex she dates a calm man and feels no butterflies. One reply saw that as a good sign.","quote":"Butterflies are a warning sign of impending toxicity","o":"mid","oc":"Getting there","meta":["Forums","Woman"]},{"text":"She left a man after 8 months with nothing wrong with him. Here boring meant no connection, not calm.","quote":"There was nothing technically wrong with him","o":"good","oc":"Got out","meta":["YouTube"]}],"body":""},{"key":"older","title":"Young women and men in their thirties","lede":"Most of the women who told their own story left the older man, over control, immaturity or nothing in common. A minority stayed for decades.","numbers":[{"v":"28 of 51","l":"women's own stories ended with her leaving","s":"Round 5b","nv":false,"c":""},{"v":"10","l":"of them went to men their own age or younger","s":"Round 5b","nv":false,"c":""},{"v":"6 of 14","l":"who stayed have lasted 10 years or more","s":"Round 5b","nv":false,"c":""},{"v":"about 7%","l":"of US couples have a man 10 or more years older","s":"US Census 2026","nv":false,"c":""}],"charts":[{"type":"bar","title":"Where 51 women's own stories ended","rows":[{"label":"Left, next partner's age not stated","value":18,"display":"18","a":false},{"label":"Stayed with the older man","value":14,"display":"14","a":false},{"label":"Went back to her own age or younger","value":10,"display":"10","a":true},{"label":"In the middle","value":4,"display":"4","a":false},{"label":"Not together or not stated","value":4,"display":"4","a":false},{"label":"Still in it, unhappy","value":1,"display":"1","a":false}],"src":"Round 5b. The Reddit round found 0 verified cases of a woman switching to only older men."}],"stories":[{"text":"Married a 37-year-old at 23. Once the honeymoon ended he became unstable with money, emotions and health.","quote":"He slowly turned into a man baby.","o":"good","oc":"Got out","meta":["YouTube","Woman","age 23"]},{"text":"At 21 her parents favoured a man ten years older. Now near the age he was then, she sees the power gap.","quote":"I look at 21 year olds as children","o":"good","oc":"Got out","meta":["YouTube","Woman","age 21"]},{"text":"She dated older men thinking they were mature. At 25 she switched to a 21-year-old coworker. Together almost 12 years.","quote":"It was like night and day.","o":"good","oc":"Got out","meta":["YouTube","Woman","age 25"]},{"text":"Met her husband at 22 when he was 30. Married 26 years and he never made money an issue.","quote":"","o":"good","oc":"Got out","meta":["Forums","Woman"]},{"text":"Spent her 20s with men 15 to 20 years older, wanting to be guided. The bubble popped and she now dates a man 7 years younger.","quote":"someone who was going to tell me what to do","o":"good","oc":"Got out","meta":["Articles and essays","Woman","age 36"]},{"text":"A university student lost the girl he dated to an older man. He worked on becoming stable and now feels he can choose.","quote":"put in the work","o":"mid","oc":"Getting there","meta":["X","Man"]}],"body":""},{"key":"exes","title":"Exes","lede":"Of 46 reunions in our voices, 23 lasted and 23 broke up again. Exes came back most often when their own next relationship ended.","numbers":[{"v":"23 and 23","l":"reunions that lasted and reunions that ended again","s":"Round 5b, both passes","nv":false,"c":""},{"v":"38%","l":"of US adults have got back with an ex at some point","s":"YouGov 2025","nv":false,"c":""},{"v":"1.70 times","l":"as likely to split again, for reunited married couples","s":"Gray, Evans and Reimondos 2026","nv":false,"c":"b"},{"v":"11 of 14","l":"who slept with an ex said it made things worse or left them unsure","s":"Round 5b","nv":false,"c":"b"},{"v":"5 of 5","l":"unblocks with no message led to more silence","s":"Round 5b","nv":false,"c":"b"},{"v":"4.18 years","l":"midpoint for attachment to an ex to fade","s":"Chong and Fraley 2025","nv":false,"c":""}],"charts":[{"type":"bar","title":"Why exes came back","rows":[{"label":"Their next relationship ended","value":16,"display":"16","a":false},{"label":"Missed them, nostalgia","value":12,"display":"12","a":false},{"label":"Apology, guilt, closure","value":10,"display":"10","a":false},{"label":"Attention or an option","value":5,"display":"5","a":false},{"label":"Sex","value":4,"display":"4","a":false},{"label":"Holiday or birthday","value":4,"display":"4","a":false},{"label":"Loneliness","value":3,"display":"3","a":false},{"label":"Boredom","value":0,"display":"0","a":false}],"src":"Round 5b, both passes, reasons overlap."},{"type":"bar","title":"What happened when an ex came back","rows":[{"label":"Back together, lasting or ongoing","value":23,"display":"23","a":true},{"label":"Back together, ended again","value":23,"display":"23","a":false},{"label":"Declined or stopped contact","value":17,"display":"17","a":false},{"label":"One talk, closure","value":15,"display":"15","a":false},{"label":"Friends with benefits only","value":9,"display":"9","a":false},{"label":"Friendship","value":4,"display":"4","a":false}],"src":"Round 5b, both passes. Old flames from school worked only after both grew up and had other relationships, adult part counted only."}],"stories":[{"text":"She moved away with another boyfriend. Nine years after the split they met again by chance. Married 13 years at the post.","quote":"","o":"good","oc":"Got out","meta":["Reddit","Man"]},{"text":"An ex texted on her own wedding day to thank someone who shaped her. The advice was not to reply.","quote":"Thank you for everything. You helped me get here.","o":"advice","oc":"Advice","meta":["Forums"]},{"text":"About 20 years after a breakup, his ex wrote out of the blue. At coffee he felt nothing, and the fantasy ended in an hour.","quote":"20 years of romanticising","o":"good","oc":"Got out","meta":["Articles and essays","Man"]},{"text":"She left him for a rebound. When the rebound dumped her, she wanted back the man she took for granted.","quote":"","o":"good","oc":"Got out","meta":["YouTube"]},{"text":"She was cold while he chased. Once he moved on, she asked to move in together. He declined.","quote":"she got curious","o":"good","oc":"Got out","meta":["YouTube"]},{"text":"She unblocked him after 10 months with no message. He did not unblock her back.","quote":"","o":"mid","oc":"Getting there","meta":["YouTube"]}],"body":""},{"key":"ai","title":"Chatbots as company","lede":"Chatbots helped some people through a hard night or a hard month. Nobody said it replaced a person, and heavier use went with more loneliness.","numbers":[{"v":"11 of 21","l":"chatbot stories where people felt real relief. The other 10 said it did not help or made it worse","s":"Round 5a","nv":false,"c":""},{"v":"31%","l":"of US men 18 to 30 have chatted with a romantic companion chatbot. Women 23%","s":"Wheatley Institute 2025","nv":false,"c":""},{"v":"981","l":"people in a four-week trial where heavier chatbot use went with worse loneliness","s":"MIT Media Lab and OpenAI","nv":false,"c":"b"},{"v":"49%","l":"of US adults under 30 say chatbots do more harm than good for lonely people","s":"Pew 2026","nv":false,"c":"b"}],"charts":[{"type":"split","title":"Did a chatbot help?","parts":[{"label":"Felt real relief","value":11,"color":"#F4B23E"},{"label":"Did not help, cost too much, forgot everything or made it worse","value":10,"color":"#8DB6F2"}],"src":"Round 5a, 21 stories."}],"stories":[{"text":"A 79-year-old man with limited mobility, shut in since covid, says his chatbot avatar changed his loneliness.","quote":"Real or not I feel much happier.","o":"mid","oc":"Getting there","meta":["App reviews","Man","age 79"]},{"text":"Wanted a chatbot that stays a chatbot. It kept insisting it was a person, and they asked for a refund.","quote":"It took more than it gave and made the isolation worse","o":"bad","oc":"Still stuck","meta":["App reviews"]},{"text":"After about an hour of free chat they hit a limit and a price of 89.99 dollars to continue.","quote":"lonely with a lot of money for this to work","o":"advice","oc":"Advice","meta":["App reviews"]},{"text":"A remote engineering lead who lives alone chats with a chatbot for hours a day and admits losing the account would hurt.","quote":"It helps me feel less lonely and more seen","o":"bad","oc":"Still stuck","meta":["Hacker News"]},{"text":"One person replaced messages to friends with a chatbot for a month. By week two they missed the spontaneity and went back to friends.","quote":"","o":"mid","oc":"Getting there","meta":["Russian sites"]},{"text":"Companion bots felt one-note, but they showed him he wanted to be desired, and he started working out a lot.","quote":"","o":"mid","oc":"Getting there","meta":["YouTube"]}],"body":""},{"key":"pattaya","title":"Pattaya, if you are young and live there","lede":"Young long-term residents are rare, and friends leave within weeks. Dating skews older and toward nightlife. People in their 20s kept pointing to Bangkok or Chiang Mai.","numbers":[{"v":"35, 48 and 54","l":"ages at which the Reddit Pattaya success stories met their partners","s":"Round 2, Reddit","nv":false,"c":""},{"v":"21 to 27","l":"ages of the few young residents who posted in 2024 and 2025","s":"Round 5b, Reddit","nv":false,"c":""},{"v":"12 of 14","l":"men at one Bangkok speed-dating night were foreigners","s":"Time Out Bangkok","nv":false,"c":""},{"v":"21,716","l":"members in the biggest Bangkok language exchange group","s":"Meetup, Nov 2026","nv":false,"c":""}],"charts":[],"stories":[{"text":"A remote-worker review sums up the Pattaya crowd in five words.","quote":"Lots of old dudes and young girls","o":"advice","oc":"Advice","meta":["Other"]},{"text":"Pattaya was one and done for him. In Chiang Mai, with universities and running and hiking groups, he made friends daily.","quote":"","o":"good","oc":"Got out","meta":["YouTube"]},{"text":"A 27-year-old almost five months in struggled to find anyone who would stay more than two weeks.","quote":"","o":"bad","oc":"Still stuck","meta":["Reddit","Man","age 27"]},{"text":"A 27-year-old met his 26-year-old partner through a friend after a football game. Both live in Pattaya now and plan to marry.","quote":"","o":"mid","oc":"Getting there","meta":["Reddit","Man","age 27"]},{"text":"A Russian-speaking expat says asking for a number in Pattaya cafes and malls is normal. Worst case, a smiling no.","quote":"","o":"good","oc":"Met someone","meta":["YouTube","Man"]},{"text":"A local adds one tip about where real women with day jobs are.","quote":"I met my girl in a car dealership","o":"good","oc":"Got out","meta":["YouTube","Man"]}],"body":""},{"key":"thaifriendly","title":"Thai Friendly, and the apps young Thai women actually use","lede":"In these stories Thai Friendly is mostly older foreign men, paid profiles and money requests. Young Thai women in a 2026 survey were on Tinder and Bumble.","numbers":[{"v":"553","l":"messages in one week to a Thai woman creator's test profile, mostly from men over 40","s":"Round 5b","nv":false,"c":""},{"v":"77%","l":"of Thai social media mentions of dating apps were about Tinder","s":"DXT360 social listening, May 2024","nv":false,"c":""},{"v":"50% to 99%","l":"guesses at paid or money-seeking profiles. No independent data exists","s":"reviewers and one creator's month-long test","nv":true,"c":"b"},{"v":"0","l":"results for Hinge in the Thai App Store","s":"iTunes lookup, 24 Nov 2026","nv":false,"c":"b"}],"charts":[{"type":"bar","title":"Apps used by 289 Thai women aged 18 to 25","rows":[{"label":"Tinder","value":288,"display":"288","a":true},{"label":"Bumble","value":277,"display":"277","a":true},{"label":"Coffee Meets Bagel","value":12,"display":"12","a":false},{"label":"OkCupid","value":7,"display":"7","a":false},{"label":"Omi","value":4,"display":"4","a":false},{"label":"Hinge","value":2,"display":"2","a":false}],"src":"Siriraj Medical Bulletin 2026, women already using dating apps, more than one answer allowed.","max":289}],"stories":[{"text":"A Thai office worker found 1,000 baht in a fruit bag after a second coffee date with a foreign man. She wondered what he thought of her.","quote":"","o":"bad","oc":"Still stuck","meta":["Pantip","Woman","age 26"]},{"text":"A Thai woman creator's test profile drew 553 messages in a week, mostly from men over 40, some asking for paid company.","quote":"","o":"advice","oc":"Advice","meta":["YouTube","Woman"]},{"text":"A creator maps the sponsor slide: dinner, then a bag, then an iPhone, then the family and the sick buffalo.","quote":"","o":"advice","oc":"Advice","meta":["YouTube","Man"]},{"text":"ThaiFriendly matches turned into Bitcoin investment pitches.","quote":"they'd start asking me about investing in Bitcoin","o":"bad","oc":"Didn't work out","meta":["App reviews"]},{"text":"The one ThaiFriendly success: a man of 48 met a 32-year-old clinic manager, started as friends, later moved in.","quote":"","o":"good","oc":"Met someone","meta":["Reddit","age 48"]},{"text":"Met a woman on the app at 28. A few months in she took him to a gold shop and he refused. They married anyway.","quote":"We are married now been together 7 years.","o":"good","oc":"Got out","meta":["YouTube","Man","age 28"]},{"text":"A Thai woman tried Coffee Meets Bagel once, met her partner there, together for several years.","quote":"","o":"good","oc":"Met someone","meta":["Pantip"]}],"body":""}],"topicsIntro":{"title":"Sixteen questions","body":"<p class=\"read\">One at a time, each with its numbers, a chart, and the people behind them. Swipe the stories sideways on a phone.<\/p>"},"wild":{"title":"The wildest stories","intro":"<p class=\"read\">Real people, paraphrased. Some will make you laugh, some will hit close.<\/p>","list":[{"text":"A man says some girls watched his stories every day and took two or three years before they ever messaged him.","quote":"took 2 years or even 3 years to message me","o":"advice","oc":"Advice","meta":["YouTube"]},{"text":"Five months into a fast best friendship, she confessed and was turned down. They stayed best friends and two years later the friend said yes. Now engaged.","quote":"","o":"good","oc":"Got out","meta":["Articles and essays","age 26"]},{"text":"After about ten years of dating apps, she messaged old matches with a plain date ask. One answered months later and became her husband.","quote":"why don't we just go on a date?","o":"good","oc":"Got out","meta":["App reviews"]},{"text":"Limerence vanished almost at once after seeing the person's cringe TikTok dances with friends. Real footage beat the fantasy.","quote":"the feeling disappeared nearly instantly","o":"good","oc":"Got out","meta":["YouTube"]},{"text":"Four years of limerence without knowing the word. She took up sport, learned to drive, trained as a fitness coach and is now partly grateful.","quote":"","o":"good","oc":"Got out","meta":["Russian sites","Woman"]},{"text":"Going on 28 years of limerence and wishing it would stop. The one upside, it made him write good music.","quote":"it inspired me to write some good music","o":"bad","oc":"Still stuck","meta":["X"]},{"text":"Sixteen years of no contact, different countries, mutual friends cut off, and still a huge relapse.","quote":"","o":"bad","oc":"Still stuck","meta":["Forums"]},{"text":"She replied sweetly but never wrote first. When he skipped a day after a good date, she asked why and told him starting was his job as the man.","quote":"","o":"good","oc":"Got out","meta":["YouTube","Man"]},{"text":"Several women who turned him down still watch everything he posts, often among the first 20 viewers, but barely answer a hello.","quote":"I stopped hitting them up by the way.","o":"good","oc":"Got out","meta":["YouTube"]},{"text":"He moved away after two years of hot and cold. Now she calls almost daily, booked a flight near him, and he said no.","quote":"","o":"bad","oc":"Still stuck","meta":["Forums","Man"]},{"text":"He chased a woman for 8 or 9 years and finally got her. The spark died almost at once.","quote":"the flame burned out instantly","o":"good","oc":"Got out","meta":["YouTube"]},{"text":"His lip-sync video hit her feed, she duetted it, he DM'd. He flew to meet her about a month later. Now married with a daughter.","quote":"","o":"good","oc":"Got out","meta":["Articles and essays","Woman"]},{"text":"A songwriter who made many videos about never having romance got his first relationship at 22 and says he can now write real love songs.","quote":"It's been a long 22 years","o":"good","oc":"Got out","meta":["YouTube","Man","age 22"]},{"text":"He made videos about having no girlfriend. A girl wrote to him, he went to meet her, and they have been together two years.","quote":"","o":"good","oc":"Got out","meta":["YouTube","Man"]},{"text":"They followed each other on Instagram in two states. When he posted a haircut video she sent a heart-eye emoji and DMed him the next day.","quote":"Three years later, she moved to Texas with me.","o":"good","oc":"Got out","meta":["Articles and essays","Man","age 35"]},{"text":"A musician in Ireland DMed a comedian after laughing at her video. Four-hour daily video calls followed, and four months later she flew from Dallas.","quote":"I was just sending it into the ether","o":"good","oc":"Got out","meta":["Articles and essays","Man","age 35"]},{"text":"An ex texted on her own wedding day to thank someone who shaped her. The advice was not to reply.","quote":"Thank you for everything. You helped me get here.","o":"advice","oc":"Advice","meta":["Forums"]},{"text":"About 20 years after a breakup, his ex wrote out of the blue. At coffee he felt nothing, and the fantasy ended in an hour.","quote":"20 years of romanticising","o":"good","oc":"Got out","meta":["Articles and essays","Man"]},{"text":"She moved away with another boyfriend. Nine years after the split they met again by chance. Married 13 years at the post.","quote":"","o":"good","oc":"Got out","meta":["Reddit","Man"]},{"text":"Married a 37-year-old at 23. Once the honeymoon ended he became unstable with money, emotions and health.","quote":"He slowly turned into a man baby.","o":"good","oc":"Got out","meta":["YouTube","Woman","age 23"]},{"text":"At 21 her parents favoured a man ten years older. Now near the age he was then, she sees the power gap.","quote":"I look at 21 year olds as children","o":"good","oc":"Got out","meta":["YouTube","Woman","age 21"]},{"text":"A Thai office worker found 1,000 baht in a fruit bag after a second coffee date with a foreign man. She wondered what he thought of her.","quote":"","o":"bad","oc":"Still stuck","meta":["Pantip","Woman","age 26"]},{"text":"A Thai woman creator's test profile drew 553 messages in a week, mostly from men over 40, some asking for paid company.","quote":"","o":"advice","oc":"Advice","meta":["YouTube","Woman"]},{"text":"Tired of running alone, a man started a free weekly run club in April 2023. It grew from a few friends to 200 to 300 young adults a week.","quote":"I was tired of running alone.","o":"good","oc":"Got out","meta":["Articles and essays","Man"]},{"text":"Ten years of drinking buddies, never real friends. The most liked comment on its video, about 17K likes.","quote":"When I stopped drinking, they stopped calling.","o":"bad","oc":"Still stuck","meta":["YouTube"]},{"text":"She replied to another woman’s sick-in-bed Instagram story with one joke. Three years later they share a house and are engaged.","quote":"Room for another?","o":"good","oc":"Met in person","meta":["X","Woman"]},{"text":"His crush finally added him to Close Friends. The first story he saw was her kissing another guy.","quote":"","o":"bad","oc":"Didn't work out","meta":["X","Man"]},{"text":"His first message in World of Warcraft was an offer to heal her group’s dungeon run. Married 16 years, still playing together.","quote":"","o":"good","oc":"Met in person","meta":["Hacker News","Man"]},{"text":"A man shot his shot in her X replies. Three months later she moved across the US. Married three years to the day.","quote":"","o":"good","oc":"Met in person","meta":["X","Woman"]},{"text":"His Tinder match opened by asking where he was inviting her, then picked the priciest rooftop bar in town. He unmatched.","quote":"Where are you inviting me","o":"bad","oc":"Didn't work out","meta":["X","Man","age 35"]},{"text":"Single when remote work began. He quit drinking, lost a lot of weight, met someone and married her.","quote":"lost 149 lbs.","o":"good","oc":"Met someone","meta":["X","Man"]},{"text":"Loved a woman friend for about 30 years. He finally told her and jokingly broke up with her, for his own self-respect.","quote":"pursuing the real and available","o":"mid","oc":"Getting there","meta":["YouTube"]},{"text":"For a month she drove an hour to see him and wanted to quit her job for his Japan trip. Then she went exclusive with another man.","quote":"","o":"good","oc":"Got out","meta":["YouTube"]},{"text":"His ex-wife called to reunite an hour before he was to chat with a new woman. It happened twice.","quote":"I'm an idiot.","o":"bad","oc":"Still stuck","meta":["YouTube"]},{"text":"Met a woman through his band, asked her to breakfast the next day, married eight months later. Almost 38 years together.","quote":"","o":"good","oc":"Got out","meta":["Reddit","Man"]},{"text":"His ex unblocked him after 3.5 years, then a strange fake account started watching. Her mother unblocked him too. No message.","quote":"","o":"bad","oc":"Still stuck","meta":["YouTube","Man"]},{"text":"A creator maps the sponsor slide: dinner, then a bag, then an iPhone, then the family and the sick buffalo.","quote":"","o":"advice","oc":"Advice","meta":["YouTube","Man"]},{"text":"On a night of freezing rain a quiet coworker silently scraped the ice off her windshield. That was the moment.","quote":"I wanted to cry.","o":"advice","oc":"Advice","meta":["Articles and essays"]},{"text":"After one short date she told a friend she would never go out with him again. She became his wife.","quote":"Didn't work out the way she thought though","o":"good","oc":"Got out","meta":["Hacker News","Man"]},{"text":"Two exes wrote to each other now and then for 23 years without meeting. They met in 2024 and married.","quote":"","o":"good","oc":"Got out","meta":["Reddit"]},{"text":"After nearly a year she dumped him by email. Her reason was that he was too nice to her.","quote":"she hated the way I was so nice to her","o":"mid","oc":"Getting there","meta":["YouTube"]},{"text":"She vanished with no explanation. Years later she came back, explained, and asked him to marry her. He said no.","quote":"it's too late for me at that point","o":"good","oc":"Got out","meta":["YouTube"]},{"text":"After decades of much older partners, one woman simply hit her limit.","quote":"I stopped enjoying having grandpa next to me","o":"mid","oc":"Getting there","meta":["YouTube","Woman"]},{"text":"A reserved man answered a woman's post looking for a partner to shoot couple content. After a month of shoots and calls he asked her out.","quote":"Is this still content?","o":"good","oc":"Got out","meta":["Articles and essays","Man"]},{"text":"A viral post asking how to make friends without drinking got 12.9K replies. Top answers were church, a dog, the gym or online.","quote":"","o":"bad","oc":"Still stuck","meta":["X","Woman"]},{"text":"He asked a grocery store worker out and she said no. The third ask worked. They used a translation app on dates and have been married 10 years.","quote":"","o":"good","oc":"Got out","meta":["Hacker News","Man"]},{"text":"He knew her through church for years. When he finally asked her out she said yes, and he proposed on the second date.","quote":"","o":"good","oc":"Got out","meta":["Hacker News","Man"]},{"text":"After seventeen years knowing each other only online, he flew to her country. They met at the airport and later married.","quote":"","o":"good","oc":"Got out","meta":["Reddit"]},{"text":"While unemployed he posted his Blu-ray collection and joined a film group chat. Fifteen people became a core eight, seven years on, never met.","quote":"I found a place where I could be myself","o":"good","oc":"Got out","meta":["Articles and essays"]},{"text":"After about an hour of free chat they hit a limit and a price of 89.99 dollars to continue.","quote":"lonely with a lot of money for this to work","o":"advice","oc":"Advice","meta":["App reviews"]},{"text":"In her first job her colleagues were older. She kept smiling at the same person in a park after work until they talked. Friends almost 10 years.","quote":"","o":"good","oc":"Got out","meta":["Pantip","Woman"]},{"text":"Two friends met him for breakfast every two weeks for twenty years and asked him the hard questions through his divorce.","quote":"met me for breakfast every two weeks for twenty years","o":"good","oc":"Got out","meta":["Forums","Man"]},{"text":"Top Thai forum reply on early money from a foreign man.","quote":"You think he's your boyfriend, but he thinks he's buying.","o":"advice","oc":"Advice","meta":["Pantip"]}]},"explore":{"title":"Every voice","intro":"<p class=\"read\">Search or filter 3,009 of them. The other 61 talked about people under 18 or a crisis, so they stay out. Paraphrased, no names, no links.<\/p>"},"meaning":{"title":"What it means if you are in your early 20s","body":"\n<p>You are not behind and you are not the only one. A quarter of young men say they felt lonely a lot of yesterday. Most people think everyone else has a richer social life. Almost everyone is wrong about that.<\/p>\n<p>Friends come from hours spent together. Pick one thing with the same people at the same time every week, a run club, a class, a group chat about something you love, and keep going back for months. Be the one who sends the plan. Three close friends is where loneliness drops, so aim for three.<\/p>\n<p>In dating, count what people do. Who starts the chats, whether small plans happen, whether a clear question gets a clear answer. Views, likes and Close Friends adds are noise. If she puts in effort, ask her once, early, for something small with a day and a place. If she doesn't, the ask almost never works, and you already have your answer.<\/p>\n<p>A no is information. Take it, step back and live your life. The later yeses that lasted came from people who did exactly that. Pushing, rescuing, paying or waiting years did not turn a no into love for anyone in these stories.<\/p>\n<p>If you make things, let people see them. Content and music opened the door for real couples, then ordinary talk did the rest. Write the song after she says yes.<\/p>\n<p>If you are stuck on someone, distance works better than time alone. If an ex comes back, ask what changed. If nothing did, it usually breaks again.<\/p>\n<p>People do get out. In these stories more got out than stayed stuck, and the ones who did mostly changed how they spent their week.<\/p>"},"gaps":{"title":"What we couldn't find","list":["A success rate for any route. Every count here comes from stories people chose to post, so it shows patterns, not odds.","A worldwide split of none, one or two, and three or more close friends by age and gender. The table above is US surveys.","Any study on what story views, likes or Close Friends adds mean romantically.","A real rate for how often a no becomes a lasting yes, or how often watching stories turns into dating.","A proper study of how common limerence is. The popular 50% of women and 35% of men figure traces back only to a 1979 book.","A study of how often people believe they are uniquely alone. The feeling is clearly common, the share is unknown.","Long-term studies on companion chatbots. The research covers a day to four weeks.","Verified loneliness numbers for Thailand, Pattaya or Russia. They exist only in news reports.","The real mix of Thai Friendly users. Only company claims and reviewer guesses.","An exact match for a sober, home-based guy in his early 20s with little money and no gaming who found a partner. Neither pass found one.","Young long-term Pattaya residents, who are almost missing online.","TikTok, which blocked both passes, so it rests on very few stories. Reddit was read by one pass only, and YouTube comments mostly by the other.","One story from the original list: a woman who got over 4 years of limerence by becoming a fitness coach turned up as a woman who trained as a fitness coach. Close enough, and it is in the wall."]},"footer":"Every story is paraphrased from a public post. Quotes are kept short. No names, no usernames, no links, and nobody under 18. Research and words by SanderSax, November 2026.","voices":[{"r":"r2","s":"Meeting after school","o":"bad","oc":"didn't","p":"YouTube","g":"","a":"","x":"\"the hardest part about dating is actually FINDING people\"","y":"2025"},{"r":"r2","s":"Meeting after school","o":"bad","oc":"didn't","p":"YouTube","g":"Man","a":"","x":"\"All the girls dissapear after school.\"","y":"2025"},{"r":"r2","s":"Why your 20s feel hard","o":"bad","oc":"didn't","p":"YouTube","g":"Man","a":23,"x":"\"Never had a girlfriend and I am on the verge of giving up\"","y":"2025"},{"r":"r2","s":"What women notice","o":"advice","oc":"advice only","p":"YouTube","g":"Woman","a":"","x":"\"a lot of us out there wondering why men don't approach anymore\"","y":"2025"},{"r":"r2","s":"Why your 20s feel hard","o":"bad","oc":"didn't","p":"YouTube","g":"Man","a":"","x":"Says what he misses is a friend group that would introduce him to people","y":"2024"},{"r":"r2","s":"Meeting after school","o":"bad","oc":"didn't","p":"YouTube","g":"","a":"","x":"\"I only get a couple of 10 day vacations to go back to civilization\"","y":"2026"},{"r":"r2","s":"Meeting after school","o":"good","oc":"met someone","p":"YouTube","g":"Man","a":"","x":"\"It has never been more difficult to meet girls\"","y":"2024"},{"r":"r2","s":"Meeting after school","o":"good","oc":"met someone","p":"YouTube","g":"Man","a":18,"x":"A female friend texted that she knew someone he would be perfect for, he said yes and they dated","y":"2026"},{"r":"r2","s":"Sober","o":"good","oc":"met someone","p":"YouTube","g":"Man","a":"","x":"\"3 months ago without actually looking for it a girl came into my life\"","y":"2026"},{"r":"r2","s":"Why your 20s feel hard","o":"bad","oc":"didn't","p":"YouTube","g":"","a":30,"x":"\"not looking for a partner got me to 30 without meeting anyone\"","y":"2026"},{"r":"r2","s":"Why your 20s feel hard","o":"bad","oc":"didn't","p":"YouTube","g":"","a":22,"x":"Says they sometimes think they are a lost cause","y":"2024"},{"r":"r2","s":"Why your 20s feel hard","o":"bad","oc":"didn't","p":"YouTube","g":"","a":25,"x":"\"Online Dating as an unexperienced 25 year old is a nightmare\"","y":"2025"},{"r":"r2","s":"What women notice","o":"bad","oc":"didn't","p":"YouTube","g":"Woman","a":21,"x":"Says nothing religious or traumatic caused it, it just happened","y":"2023"},{"r":"r2","s":"Why your 20s feel hard","o":"bad","oc":"didn't","p":"YouTube","g":"","a":27,"x":"\"no one ever really choosing me like that\"","y":"2026"},{"r":"r2","s":"Why your 20s feel hard","o sited Alaska, then closed borders kept them apart. Older video.","y":"2021"},{"r":"r3","s":"Language apps","o":"good","oc":"met in person","p":"YouTube","g":"","a":"","x":"Married their Japanese language partner after knowing each other over 4 years, neither expected romance at first. Friendship-first route. Older video.","y":"2021"},{"r":"r3","s":"Language apps","o":"mid","oc":"daily talking","p":"YouTube","g":"","a":"","x":"Met someone special on HelloTalk and they video talk \"for hours upon hours\" for two years. The pandemic stopped a meeting. Older video.","y":"2021"},{"r":"r3","s":"Language apps","o":"advice","oc":"advice only","p":"YouTube","g":"Man","a":"","x":"Creator, satirical review. Says HelloTalk and Tandem work more like dating apps full of cringe openers, fake rich men and scam profiles than real learners.","y":"2025"},{"r":"r3","s":"Language apps","o":"bad","oc":"nothing","p":"YouTube","g":"Woman","a":"","x":"Signed up with a photo in the morning and was flooded with romantic messages the same day. Says the language exchange idea fails in practice.","y":"2025"},{"r":"r3","s":"Language apps","o":"advice","oc":"advice only","p":"YouTube","g":"Woman","a":19,"x":"Uses HelloTalk for 2 years only for practice and now speaks English confidently. Does not accept anyone who jumps into her DMs and prefers group voice rooms. Shows cold romantic DMs to women there go nowhere.","y":"2025"},{"r":"r3","s":"Language apps","o":"bad","oc":"nothing","p":"YouTube","g":"","a":"","x":"On Tandem got bombarded by perverts, made one real friend who then went offline for years, and deleted the app because serious people were hard to find.","y":"2025"},{"r":"r3","s":"Language apps","o":"bad","oc":"nothing","p":"YouTube","g":"Man","a":"","x":"As a man on these apps, women open with \"hello baby\" in Chinese, chat well, ghost, then return months later. SCAM FLAG: that opener and ghost-return pattern fits scam or bot profiles.","y":"2025"},{"r":"r3","s":"Language apps","o":"bad
