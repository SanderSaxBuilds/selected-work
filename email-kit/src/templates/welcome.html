<tr>
<td class="bg-card" style="padding:0;">
<img src="{{images.hero}}" width="{{hero.width}}" height="{{hero.height}}" alt="{{hero.alt}}" class="fluid" style="max-width:600px;font-family:Arial,sans-serif;font-size:14px;line-height:20px;color:#6e5a52;">
</td>
</tr>
<tr>
<td class="bg-card pad" style="padding:32px 40px 8px;">
<h1>Welcome to Kettlewick</h1>
{{#each intro}}
<p>{{this}}</p>
{{/each}}
</td>
</tr>
<tr>
<td class="bg-card pad" style="padding:8px 40px 28px;">
<table role="presentation" width="100%" border="0" cellpadding="0" cellspacing="0">
<tr>
<td align="center" class="bg-tint code-box" style="padding:20px 16px;">
<p class="small muted center" style="margin:0 0 4px;">{{code.label}}</p>
<p class="code center">{{code.value}}</p>
<p class="small center last">{{code.terms}}</p>
</td>
</tr>
</table>
</td>
</tr>
<tr>
<td align="center" class="bg-card pad" style="padding:0 40px 36px;">
{{> button href=links.firstCoffee label=cta width=280}}
</td>
</tr>
<tr>
<td class="bg-card pad" style="padding:0 40px;">
<table role="presentation" width="100%" border="0" cellpadding="0" cellspacing="0"><tr><td class="rule">&nbsp;</td></tr></table>
</td>
</tr>
<tr>
<td class="bg-card pad" style="padding:28px 40px 4px;">
<h2>What to expect</h2>
</td>
</tr>
{{#each steps}}
<tr>
<td class="bg-card pad" style="padding:8px 40px 12px;">
<table role="presentation" width="100%" border="0" cellpadding="0" cellspacing="0">
<tr>
<td width="52" valign="top">
<table role="presentation" width="36" border="0" cellpadding="0" cellspacing="0"><tr><td class="step-num" height="36">{{@number}}</td></tr></table>
</td>
<td valign="top">
<h3 style="margin:6px 0 4px;">{{title}}</h3>
<p class="last">{{text}}</p>
</td>
</tr>
</table>
</td>
</tr>
{{/each}}
<tr>
<td class="bg-card pad" style="padding:20px 40px 36px;">
<p class="last">{{signoff.line}}<br><strong>{{signoff.name}}</strong></p>
</td>
</tr>
